    /* Apply the saved theme before first paint (reads the unified record, or an earlier application's record). */
    (function () {
      try {
        var raw = localStorage.getItem('ifl.v3') || localStorage.getItem('ifl.v1'), s = raw ? (JSON.parse(raw).settings || {}) : null;
        if (!s) { var b = localStorage.getItem('ifl_v1'); s = b ? (JSON.parse(b).settings || {}) : {}; }
        var t = s.theme || 'system';
        if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (s.fontScale) document.documentElement.style.setProperty('--font-scale', s.fontScale);
        if (s.reduceMotion || s.reducedMotion) document.documentElement.classList.add('reduce-motion');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
