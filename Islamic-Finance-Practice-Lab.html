/* ==========================================================================
   Islamic Finance Learning — design system
   Tokens → base → layout → components → views → utilities
   ========================================================================== */
:root {
  --font-scale: 1;
  --font-sans: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Source Serif Pro", "Georgia", "Cambria", serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --fs-xs: calc(0.75rem * var(--font-scale));
  --fs-sm: calc(0.8125rem * var(--font-scale));
  --fs-md: calc(0.9375rem * var(--font-scale));
  --fs-lg: calc(1.0625rem * var(--font-scale));
  --fs-xl: calc(1.25rem * var(--font-scale));
  --fs-2xl: calc(1.5rem * var(--font-scale));
  --fs-3xl: calc(1.875rem * var(--font-scale));
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --radius-sm: 6px; --radius: 10px; --radius-lg: 14px;
  --sidebar-w: 264px; --topbar-h: 58px;
  --ease: cubic-bezier(.2,.7,.2,1);
  --dur: 160ms;
}
:root, [data-theme="light"] {
  --bg: #f6f5f1;
  --bg-elev: #ffffff;
  --bg-sunk: #eeece6;
  --bg-hover: #f0efe9;
  --text: #1d2327;
  --text-2: #4a545b;
  --text-3: #626c73;
  --border: #dedbd2;
  --border-strong: #c9c5ba;
  --accent: #1f5f5b;
  --accent-2: #2b7a74;
  --accent-soft: #e3efed;
  --accent-contrast: #ffffff;
  --gold: #8a5c0f;
  --gold-soft: #f6ecd9;
  --ok: #2c6e3f; --ok-soft: #e2f0e5;
  --warn: #8a5a00; --warn-soft: #fbf0d9;
  --bad: #a13a2b; --bad-soft: #f8e3df;
  --info: #2f5a8a; --info-soft: #e3ecf6;
  --shadow: 0 1px 2px rgba(20,30,30,.06), 0 2px 8px rgba(20,30,30,.05);
  --shadow-lg: 0 10px 30px rgba(20,30,30,.16);
  --focus: 0 0 0 3px rgba(31,95,91,.35);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #111416;
  --bg-elev: #191d20;
  --bg-sunk: #0c0e10;
  --bg-hover: #21262a;
  --text: #e7e9ea;
  --text-2: #b7bec2;
  --text-3: #8b9499;
  --border: #2c3236;
  --border-strong: #3b4347;
  --accent: #5fb3aa;
  --accent-2: #7cc6be;
  --accent-soft: #1b3431;
  --accent-contrast: #0c1413;
  --gold: #d9ad5b;
  --gold-soft: #3a2f1a;
  --ok: #7cc58f; --ok-soft: #1c3223;
  --warn: #e0b05a; --warn-soft: #3a2f16;
  --bad: #ec8f80; --bad-soft: #3d201b;
  --info: #8db6e3; --info-soft: #1b2a3b;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  --focus: 0 0 0 3px rgba(95,179,170,.45);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: var(--fs-md)/1.6 var(--font-sans); -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 var(--sp-3); font-weight: 650; letter-spacing: -0.01em; }
h1 { font-size: var(--fs-3xl); font-family: var(--font-serif); font-weight: 600; }
h2 { font-size: var(--fs-2xl); font-family: var(--font-serif); font-weight: 600; }
h3 { font-size: var(--fs-xl); }
h4 { font-size: var(--fs-lg); }
p { margin: 0 0 var(--sp-3); }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { color: var(--accent-2); }
small { font-size: var(--fs-sm); }
ul, ol { padding-left: 1.25rem; margin: 0 0 var(--sp-3); }
li { margin-bottom: 4px; }
hr { border: 0; border-top: 1px solid var(--border); margin: var(--sp-5) 0; }
kbd { font-family: var(--font-mono); font-size: var(--fs-xs); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg-elev); color: var(--text-2); }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
svg.diagram-svg, svg.cmap, svg.chart-svg { stroke: none; stroke-width: 1; width: 100%; height: auto; }
svg.diagram-svg text, svg.cmap text, svg.chart-svg text { stroke: none; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--radius-sm); }
button, input, select, textarea { font: inherit; color: inherit; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: -999px; top: 8px; z-index: 100; background: var(--accent); color: var(--accent-contrast); padding: 8px 12px; border-radius: var(--radius-sm); }
.skip-link:focus { left: 8px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after { transition: none !important; animation: none !important; }

/* ---------- Layout ---------- */
.app { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: var(--topbar-h) 1fr; grid-template-areas: "top top" "side main"; }
.topbar { grid-area: top; position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-4); background: color-mix(in srgb, var(--bg-elev) 92%, transparent); backdrop-filter: saturate(1.2) blur(6px); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); min-width: 0; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-size: var(--fs-md); font-weight: 700; }
.brand-text small { color: var(--text-3); font-size: var(--fs-xs); white-space: nowrap; }
.search-form { flex: 1; max-width: 520px; margin-left: auto; position: relative; }
.search-form input { width: 100%; height: 38px; border: 1px solid var(--border); background: var(--bg-sunk); border-radius: 999px; padding: 0 40px 0 16px; }
.search-form input:focus { outline: none; box-shadow: var(--focus); background: var(--bg-elev); }
.search-kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); }
.topbar-actions { display: flex; gap: 4px; }
.icon-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 38px; height: 38px; padding: 0 8px; border: 1px solid transparent; border-radius: var(--radius); background: transparent; color: var(--text-2); cursor: pointer; }
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.timer-chip { font-variant-numeric: tabular-nums; font-size: var(--fs-sm); color: var(--accent); font-weight: 600; }
.menu-btn { display: none; }

.sidebar { grid-area: side; position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); border-right: 1px solid var(--border); background: var(--bg-elev); }
.nav-scroll { height: 100%; overflow-y: auto; padding: var(--sp-3) var(--sp-2) var(--sp-8); }
.nav-group { margin-bottom: var(--sp-3); }
.nav-label { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); padding: var(--sp-2) var(--sp-3) 4px; font-weight: 600; }
.nav-link, .nav-toggle { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px var(--sp-3); border-radius: var(--radius-sm); color: var(--text-2); text-decoration: none; font-size: var(--fs-sm); border: 0; background: transparent; cursor: pointer; text-align: left; }
.nav-link:hover, .nav-toggle:hover { background: var(--bg-hover); color: var(--text); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-link svg, .nav-toggle svg { width: 18px; height: 18px; }
.nav-sub { padding-left: 28px; }
.nav-sub .nav-link { font-size: var(--fs-sm); padding: 5px var(--sp-3); }
.nav-toggle .chev { margin-left: auto; transition: transform var(--dur) var(--ease); }
.nav-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.nav-meter { margin-left: auto; font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }

.main { grid-area: main; min-width: 0; outline: none; }
.view { max-width: 1120px; margin: 0 auto; padding: var(--sp-6) var(--sp-6) 96px; }
.view.wide { max-width: 1320px; }
.scrim { display: none; }
.bottom-nav { display: none; }

@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; grid-template-areas: "top" "main"; }
  .menu-btn { display: inline-flex; }
  .sidebar { position: fixed; z-index: 50; top: 0; left: 0; bottom: 0; height: 100vh; width: min(86vw, 320px); transform: translateX(-102%); transition: transform 220ms var(--ease); box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: none; }
  .scrim:not([hidden]) { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; }
  .brand-text small { display: none; }
  .view { padding: var(--sp-4) var(--sp-4) 110px; }
  .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--bg-elev); border-top: 1px solid var(--border); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
  .bottom-nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; color: var(--text-3); text-decoration: none; border-radius: var(--radius-sm); }
  .bottom-nav a[aria-current="page"] { color: var(--accent); font-weight: 600; }
}
@media (max-width: 600px) {
  .search-kbd { display: none; }
  .brand-text { display: none; }
  h1 { font-size: var(--fs-2xl); }
  h2 { font-size: var(--fs-xl); }
}

/* ---------- Components ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-5); }
.page-head p { color: var(--text-2); margin: 0; max-width: 72ch; }
.eyebrow { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.crumbs { font-size: var(--fs-sm); color: var(--text-3); margin-bottom: var(--sp-3); display: flex; flex-wrap: wrap; gap: 6px; }
.crumbs a { color: var(--text-3); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }

.card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--sp-5); box-shadow: var(--shadow); }
.card + .card { margin-top: var(--sp-4); }
.card.flat { box-shadow: none; }
.card.sunk { background: var(--bg-sunk); box-shadow: none; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.card-title h2, .card-title h3 { margin: 0; font-size: var(--fs-lg); font-family: var(--font-sans); font-weight: 650; }
.card-link { display: block; text-decoration: none; color: inherit; transition: border-color var(--dur), transform var(--dur); }
.card-link:hover { border-color: var(--accent); color: inherit; }
.grid { display: grid; gap: var(--sp-4); }
.grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
@media (max-width: 960px) { .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 600px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }
.stack > * + * { margin-top: var(--sp-4); }
/* Grid gaps already space items; cancel the stacked-card margins inside grids. */
.grid > * + *, .grid > .card + .card { margin-top: 0; }
.row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }
.muted { color: var(--text-3); }
.text-2 { color: var(--text-2); }
.small { font-size: var(--fs-sm); }
.tabular { font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--bg-elev); color: var(--text); font-weight: 600; font-size: var(--fs-sm); cursor: pointer; text-decoration: none; white-space: nowrap; transition: background var(--dur), border-color var(--dur); }
.btn:hover { background: var(--bg-hover); color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: var(--accent-contrast); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--bg-hover); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { height: 30px; padding: 0 10px; font-size: var(--fs-xs); border-radius: var(--radius-sm); }
.btn.lg { height: 46px; padding: 0 22px; font-size: var(--fs-md); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.btn.on { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.btn-group { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }
.btn-group .btn { border: 0; border-radius: 0; height: 34px; }
.btn-group .btn + .btn { border-left: 1px solid var(--border); }
.seg { display: inline-flex; background: var(--bg-sunk); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font-size: var(--fs-sm); color: var(--text-2); cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--bg-elev); color: var(--accent); box-shadow: var(--shadow); }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 600; background: var(--bg-sunk); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.badge.gold { background: var(--gold-soft); color: var(--gold); border-color: transparent; }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.badge.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.tier-core { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tier-supporting { background: var(--info-soft); color: var(--info); border-color: transparent; }
.tier-detailed { background: var(--gold-soft); color: var(--gold); border-color: transparent; }
.tier-revision { background: var(--bg-sunk); color: var(--text-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-2); font-size: var(--fs-sm); cursor: pointer; text-decoration: none; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }

.progress { height: 8px; background: var(--bg-sunk); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 400ms var(--ease); }
.progress.thin { height: 5px; }
.progress.gold > span { background: var(--gold); }
.ring { --p: 0; --size: 92px; width: var(--size); height: var(--size); border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--bg-sunk) 0); display: grid; place-items: center; }
.ring::before { content: ""; grid-area: 1/1; width: calc(var(--size) - 16px); height: calc(var(--size) - 16px); border-radius: 50%; background: var(--bg-elev); }
.ring > span { grid-area: 1/1; z-index: 1; font-weight: 700; font-size: var(--fs-lg); font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: var(--fs-2xl); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .l { font-size: var(--fs-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }

.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: var(--sp-3) var(--sp-4); border-radius: 0 var(--radius) var(--radius) 0; margin: var(--sp-3) 0; }
.callout.gold { border-color: var(--gold); background: var(--gold-soft); }
.callout.warn { border-color: var(--warn); background: var(--warn-soft); }
.callout.bad { border-color: var(--bad); background: var(--bad-soft); }
.callout.info { border-color: var(--info); background: var(--info-soft); }
.callout .t { font-weight: 700; font-size: var(--fs-sm); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.callout p:last-child, .callout ul:last-child { margin-bottom: 0; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); margin: var(--sp-3) 0; background: var(--bg-elev); }
table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--border); }
thead th { background: var(--bg-sunk); font-weight: 650; color: var(--text); position: sticky; top: 0; }
tbody tr:last-child td { border-bottom: 0; }
tbody th { font-weight: 600; color: var(--text); background: color-mix(in srgb, var(--bg-sunk) 50%, transparent); }
caption { caption-side: top; text-align: left; padding: 10px 12px; font-weight: 650; font-size: var(--fs-sm); color: var(--text-2); border-bottom: 1px solid var(--border); }

details.acc { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev); }
details.acc + details.acc { margin-top: var(--sp-2); }
details.acc > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary::before { content: "›"; font-size: 1.2em; color: var(--text-3); transition: transform var(--dur); }
details.acc[open] > summary::before { transform: rotate(90deg); }
details.acc > .acc-body { padding: 0 14px 12px; }

.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.input, select.input, textarea.input { border: 1px solid var(--border-strong); background: var(--bg-elev); border-radius: var(--radius-sm); padding: 8px 10px; min-height: 38px; width: 100%; }
textarea.input { min-height: 110px; resize: vertical; line-height: 1.5; }
.input:focus { outline: none; box-shadow: var(--focus); border-color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

.list { list-style: none; padding: 0; margin: 0; }
.list > li { padding: 10px 0; border-bottom: 1px solid var(--border); margin: 0; }
.list > li:last-child { border-bottom: 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: var(--fs-sm); }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; }

.empty { text-align: center; padding: var(--sp-8) var(--sp-4); color: var(--text-3); }
.empty h3 { color: var(--text-2); }
.notice { padding: var(--sp-4); background: var(--warn-soft); border-radius: var(--radius); color: var(--warn); }
.loading { display: flex; align-items: center; gap: 10px; color: var(--text-3); padding: var(--sp-8); justify-content: center; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin 800ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.source-foot { margin-top: var(--sp-4); padding-top: var(--sp-3); border-top: 1px dashed var(--border); font-size: var(--fs-xs); color: var(--text-3); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.source-foot strong { color: var(--text-2); font-weight: 600; }

.modal-root .backdrop { position: fixed; inset: 0; background: rgba(10,15,15,.45); z-index: 90; display: grid; place-items: center; padding: var(--sp-4); }
.modal { background: var(--bg-elev); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: min(560px, 100%); max-height: 90vh; overflow: auto; border: 1px solid var(--border); }
.modal.wide { width: min(820px, 100%); }
.modal header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); }
.modal header h2 { margin: 0; font-size: var(--fs-lg); font-family: var(--font-sans); }
.modal .body { padding: var(--sp-5); }
.modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: var(--sp-3) var(--sp-5) var(--sp-5); }
.toast-root { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 95; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: var(--fs-sm); box-shadow: var(--shadow-lg); animation: toastIn 200ms var(--ease); pointer-events: auto; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }
@media (max-width: 960px) { .toast-root { bottom: 84px; } }

/* ---------- Dashboard ---------- */
.hero { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-5); align-items: center; }
.hero h1 { margin-bottom: 4px; }
.next-card { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: linear-gradient(0deg, var(--bg-elev), var(--bg-elev)) padding-box; }
.next-card .why { font-size: var(--fs-sm); color: var(--text-2); }
.weak-row { display: grid; grid-template-columns: 1fr 120px 44px; gap: 10px; align-items: center; padding: 6px 0; }
.heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; }
.heat span { aspect-ratio: 1; border-radius: 3px; background: var(--bg-sunk); border: 1px solid var(--border); }
.heat span[data-l="1"] { background: color-mix(in srgb, var(--accent) 30%, var(--bg-sunk)); }
.heat span[data-l="2"] { background: color-mix(in srgb, var(--accent) 60%, var(--bg-sunk)); }
.heat span[data-l="3"] { background: var(--accent); }
@media (max-width: 600px) { .hero { grid-template-columns: 1fr; } }

/* ---------- Chapters / topics ---------- */
.chapter-card { display: flex; flex-direction: column; gap: 8px; min-height: 150px; }
.chapter-card .num { font-family: var(--font-serif); font-size: var(--fs-2xl); color: var(--accent); line-height: 1; }
.chapter-card h3 { font-size: var(--fs-md); margin: 0; }
.chapter-card .meta { margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--text-3); }
.topic-list { list-style: none; margin: 0; padding: 0; }
.topic-list li { margin: 0; }
.topic-list a { display: grid; grid-template-columns: 22px 64px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: var(--radius-sm); color: var(--text); text-decoration: none; }
.topic-list a:hover { background: var(--bg-hover); }
.topic-list .sec { color: var(--text-3); font-variant-numeric: tabular-nums; font-size: var(--fs-sm); }
.status-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border-strong); display: inline-block; }
.status-dot.visited { border-color: var(--accent); }
.status-dot.done { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--bg-elev); }
@media (max-width: 600px) { .topic-list a { grid-template-columns: 18px 48px 1fr; } .topic-list a .badge { display: none; } }

.lesson { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: var(--sp-6); }
.lesson-aside { position: sticky; top: calc(var(--topbar-h) + 16px); align-self: start; display: flex; flex-direction: column; gap: var(--sp-3); }
@media (max-width: 1100px) { .lesson { grid-template-columns: 1fr; } .lesson-aside { position: static; } }
.lesson-body { font-size: var(--fs-lg); line-height: 1.7; }
.lesson-body .card { font-size: var(--fs-md); }
.level-switch { position: sticky; top: calc(var(--topbar-h) + 8px); z-index: 5; }
.intuition { font-family: var(--font-serif); font-style: italic; font-size: var(--fs-xl); color: var(--text-2); border-left: 3px solid var(--gold); padding-left: var(--sp-4); margin: var(--sp-2) 0 var(--sp-5); }
.def { padding: 10px 0; border-bottom: 1px solid var(--border); }
.def:last-child { border-bottom: 0; }
.def dt { font-weight: 700; color: var(--text); }
.def dd { margin: 2px 0 0; color: var(--text-2); }
.steps { counter-reset: s; list-style: none; padding: 0; }
.steps li { counter-increment: s; position: relative; padding: 6px 0 6px 40px; margin: 0; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 5px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: var(--fs-sm); display: grid; place-items: center; }
.confusion { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.confusion > div { padding: var(--sp-3); border-radius: var(--radius); font-size: var(--fs-sm); }
.confusion .wrong { background: var(--bad-soft); }
.confusion .right { background: var(--ok-soft); }
.confusion .lbl { font-weight: 700; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
@media (max-width: 600px) { .confusion { grid-template-columns: 1fr; } }
.debate { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin: var(--sp-3) 0; }
.debate > div { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: var(--fs-sm); }
.debate > div:last-child { border-bottom: 0; }
.debate .k { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin-bottom: 2px; }
.debate .issue { background: var(--bg-sunk); font-weight: 600; font-size: var(--fs-md); }
.debate .crit .k { color: var(--bad); }
.debate .resp .k { color: var(--accent); }
.debate .alt .k { color: var(--info); }
.debate .take { background: var(--gold-soft); }
.debate .take .k { color: var(--gold); }
.example { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-3) var(--sp-4); margin: var(--sp-2) 0; }
.example .h { display: flex; gap: 8px; align-items: center; font-weight: 650; margin-bottom: 4px; font-size: var(--fs-sm); }
.quickcheck .opts { display: grid; gap: 8px; margin-top: var(--sp-2); }

/* ---------- Quiz ---------- */
.q-card { max-width: 820px; }
.q-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--sp-3); }
.q-text { font-size: var(--fs-lg); font-weight: 600; margin-bottom: var(--sp-4); line-height: 1.5; }
.opt { width: 100%; text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg-elev); cursor: pointer; line-height: 1.45; }
.opt + .opt { margin-top: 8px; }
.opt:hover:not([disabled]) { border-color: var(--accent); background: var(--bg-hover); }
.opt .key { flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px; background: var(--bg-sunk); display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 700; color: var(--text-2); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.incorrect { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.feedback { margin-top: var(--sp-4); padding: var(--sp-4); border-radius: var(--radius); }
.feedback.ok { background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
.feedback.bad { background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); }
.feedback .t { font-weight: 700; margin-bottom: 4px; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; align-items: center; }
.order-list { list-style: none; padding: 0; margin: 0; }
.order-list li { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg-elev); margin-bottom: 8px; }
.order-list li .grow { flex: 1; }
.order-list li.correct { border-color: var(--ok); background: var(--ok-soft); }
.order-list li.incorrect { border-color: var(--bad); background: var(--bad-soft); }
@media (max-width: 600px) { .match-grid { grid-template-columns: 1fr; } }
.score-big { font-size: 56px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }

/* ---------- Flashcards ---------- */
.flash-stage { perspective: 1400px; max-width: 700px; margin: 0 auto; }
.flash { position: relative; min-height: 290px; transform-style: preserve-3d; transition: transform 420ms var(--ease); cursor: pointer; }
.flash.flipped { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; padding: var(--sp-8) var(--sp-6); border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--bg-elev); box-shadow: var(--shadow); text-align: center; }
.flash-face.back { transform: rotateY(180deg); text-align: left; justify-content: flex-start; overflow-y: auto; }
.flash-face .front-text { font-size: var(--fs-2xl); font-family: var(--font-serif); font-weight: 600; }
.flash-face .cat { position: absolute; top: 14px; left: 16px; }
.flash-face .hint { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: var(--fs-xs); color: var(--text-3); }
html.reduce-motion .flash.flipped .front, html.reduce-motion .flash:not(.flipped) .back { visibility: hidden; }
.grade-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 700px; margin: var(--sp-4) auto 0; }
.grade-bar .btn { height: 52px; flex-direction: column; gap: 0; line-height: 1.2; }
.grade-bar .btn small { font-weight: 500; color: var(--text-3); font-size: 11px; }
.grade-bar .again { border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }
.grade-bar .hard { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }
.grade-bar .good { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
.grade-bar .easy { border-color: color-mix(in srgb, var(--info) 45%, var(--border)); }

/* ---------- Diagrams / concept map ---------- */
.diagram-wrap { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-sunk); overflow: hidden; }
.diagram-svg { width: 100%; height: auto; display: block; }
.diagram-svg .party rect { fill: var(--bg-elev); stroke: var(--border-strong); stroke-width: 1.5; }
.diagram-svg .party text { fill: var(--text); font-size: 12px; font-weight: 600; font-family: var(--font-sans); }
.diagram-svg .party.active rect { stroke: var(--accent); stroke-width: 2.5; }
.diagram-svg .edge path { stroke: var(--border-strong); stroke-width: 1.6; fill: none; }
.diagram-svg .edge text { fill: var(--text-3); font-size: 11px; font-family: var(--font-sans); }
.diagram-svg .dlbl { display: none; paint-order: stroke; stroke: var(--bg-sunk); stroke-width: 6px; stroke-linejoin: round; font-size: 12.5px; font-family: var(--font-sans); fill: var(--text-2); pointer-events: none; }
.diagram-svg .dlbl.active { display: inline; fill: var(--accent); font-weight: 700; }
.diagram-svg .dlbl.hover { display: inline; }
.diagram-svg .edge .num { fill: var(--bg-elev); stroke: var(--border-strong); }
.diagram-svg .edge .numt { fill: var(--text-2); font-size: 10px; font-weight: 700; }
.diagram-svg .edge.done path { stroke: var(--text-3); }
.diagram-svg .edge.active path { stroke: var(--accent); stroke-width: 2.6; }
.diagram-svg .edge.active text { fill: var(--accent); font-weight: 700; }
.diagram-svg .edge.active .num { fill: var(--accent); stroke: var(--accent); }
.diagram-svg .edge.active .numt { fill: var(--accent-contrast); }
.diagram-svg .edge.future { opacity: .45; }
.diagram-svg .edge { cursor: pointer; }
.kind-contract { color: var(--accent); } .kind-cash { color: var(--gold); } .kind-goods, .kind-ownership { color: var(--info); } .kind-promise, .kind-agency { color: var(--text-2); } .kind-rent { color: var(--ok); } .kind-risk { color: var(--bad); }
.step-list { list-style: none; padding: 0; margin: 0; }
.step-list li { margin: 0; }
.step-list button { width: 100%; text-align: left; display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 8px 10px; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; cursor: pointer; font-size: var(--fs-sm); }
.step-list button:hover { background: var(--bg-hover); }
.step-list button[aria-current="step"] { border-color: var(--accent); background: var(--accent-soft); }
.step-list .n { width: 22px; height: 22px; border-radius: 50%; background: var(--bg-sunk); display: grid; place-items: center; font-weight: 700; font-size: 11px; }
.cmap { width: 100%; height: auto; display: block; background: var(--bg-sunk); border-radius: var(--radius-lg); border: 1px solid var(--border); touch-action: manipulation; }
.cmap .node rect { fill: var(--bg-elev); stroke: var(--border-strong); stroke-width: 1.3; }
.cmap .node text { fill: var(--text); font-size: 12px; font-weight: 600; font-family: var(--font-sans); pointer-events: none; }
.cmap .node { cursor: pointer; }
.cmap .node:hover rect, .cmap .node:focus rect { stroke: var(--accent); stroke-width: 2.2; }
.cmap .node.sel rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.4; }
.cmap .node.dim { opacity: .35; }
.cmap .link { stroke: var(--border-strong); stroke-width: 1.2; fill: none; }
.cmap .link.hl { stroke: var(--accent); stroke-width: 2.2; }
.cmap .link.spine { stroke: var(--gold); stroke-width: 2; }
.cmap .lane text { fill: var(--text-3); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.cmap .node:focus { outline: none; }

/* ---------- Guided study ---------- */
.guided-bar { position: sticky; top: var(--topbar-h); z-index: 6; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--sp-3) var(--sp-4); box-shadow: var(--shadow); display: grid; grid-template-columns: auto 1fr auto; gap: var(--sp-4); align-items: center; margin-bottom: var(--sp-4); }
.countdown { font-size: var(--fs-2xl); font-weight: 800; font-variant-numeric: tabular-nums; min-width: 90px; }
.seg-track { display: flex; gap: 3px; margin-top: 6px; }
.seg-track span { flex: var(--w, 1); height: 6px; border-radius: 3px; background: var(--bg-sunk); border: 1px solid var(--border); }
.seg-track span.done { background: var(--accent); border-color: var(--accent); }
.seg-track span.cur { background: var(--gold); border-color: var(--gold); }
@media (max-width: 600px) { .guided-bar { grid-template-columns: 1fr; gap: 8px; } }

/* ---------- Revision cards ---------- */
.rev-card { max-width: 760px; margin: 0 auto; }
.rev-card h2 { font-size: var(--fs-3xl); margin-bottom: 4px; }
.rev-card .one { font-size: var(--fs-lg); font-family: var(--font-serif); margin: var(--sp-3) 0 var(--sp-4); }
.rev-card .trig { background: var(--gold-soft); border-radius: var(--radius); padding: 10px 14px; font-size: var(--fs-sm); }

/* ---------- Glossary ---------- */
.az { display: flex; flex-wrap: wrap; gap: 4px; }
.az button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-elev); cursor: pointer; font-weight: 600; font-size: var(--fs-sm); color: var(--text-2); }
.az button[aria-pressed="true"] { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
.az button:disabled { opacity: .35; cursor: default; }
.gl-entry { padding: 14px 0; border-bottom: 1px solid var(--border); }
.gl-entry h3 { font-size: var(--fs-lg); margin: 0 0 2px; font-family: var(--font-serif); }
.gl-entry .alt { font-size: var(--fs-sm); color: var(--text-3); }

/* ---------- Search ---------- */
.result { padding: 12px 0; border-bottom: 1px solid var(--border); }
.result a.t { font-weight: 650; text-decoration: none; }
.result .ctx { color: var(--text-2); font-size: var(--fs-sm); margin: 2px 0; }
.result .src { color: var(--text-3); font-size: var(--fs-xs); }
mark { background: var(--gold-soft); color: inherit; padding: 0 2px; border-radius: 2px; }

/* ---------- Calculators ---------- */
.calc { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-4); background: var(--bg-sunk); }
.calc .inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: var(--sp-3); margin-bottom: var(--sp-3); }
.calc .formula { font-family: var(--font-mono); font-size: var(--fs-sm); background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; margin: 6px 0; overflow-x: auto; }
.calc .result-line { font-size: var(--fs-lg); font-weight: 700; }
.calc .steps-out li { font-size: var(--fs-sm); }

/* ---------- Timer ---------- */
.timer-face { font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; letter-spacing: -0.02em; }

/* ---------- Print ---------- */
/* Exam mode (mock exam): answers are recorded without revealing correctness. */
.q-card.defer .opt.correct, .q-card.defer .opt.incorrect,
.q-card.defer .order-list li.correct, .q-card.defer .order-list li.incorrect { border-color: var(--border-strong); background: var(--bg-elev); }
.q-card.defer .opt.chosen, .q-card.defer .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.mock-bar { position: sticky; top: var(--topbar-h); z-index: 5; background: var(--bg); padding: 6px 0; margin-bottom: 8px; }
.review-item p { margin: 6px 0; }

/* Printable revision sheet */
.print-sheet header h1 { margin: 4px 0 8px; }
.print-sheet section { margin-top: 22px; }
.print-sheet h2 { font-family: var(--font-sans); font-size: var(--fs-lg); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.print-topic { margin: 14px 0; break-inside: avoid; }
.print-topic h3 { font-size: var(--fs-md); margin: 0 0 4px; }
.print-topic dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 6px 0; font-size: var(--fs-sm); }
.print-topic dt { font-weight: 600; }
.print-topic dd { margin: 0; }
.print-check { list-style: none; padding-left: 0; }
@media (max-width: 600px) { .print-topic dl { grid-template-columns: 1fr; } .print-topic dd { margin-bottom: 6px; } }

@media print {
  .topbar, .sidebar, .bottom-nav, .lesson-aside, .level-switch, .btn, .no-print, .toast { display: none !important; }
  .app { display: block; }
  .view { max-width: none; padding: 0; }
  .card { box-shadow: none; border-color: #ccc; }
  body { background: #fff !important; color: #000 !important; font-size: 11pt; }
  a { color: inherit; text-decoration: none; }
  .print-sheet h2 { break-after: avoid; }
  .print-topic, .card { break-inside: avoid; }
}

@media (max-width: 960px) { .cmp-grid, .concept-grid { grid-template-columns: 1fr !important; } }
.flash:focus-visible { box-shadow: none; }
.flash:focus-visible .flash-face { box-shadow: var(--focus); }
.grade-bar .btn { padding: 0 4px; min-width: 0; }
@media (max-width: 600px) {

}
tr.current td { background: var(--accent-soft); }
button.tool-card { text-align: left; width: 100%; font: inherit; color: inherit; cursor: pointer; }

/* ---------- Islamic banking products ---------- */

/* ---------- Numericals trainer ---------- */

.num-given dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

.num-answer .res { font-size: var(--fs-sm); font-weight: 600; }

/* ==========================================================================
   Unified platform additions (financing modes, learning-flow concept map,
   search suggestions, streak pill, collapsible sidebar)
   ========================================================================== */
.topbar .streak-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; border: 1px solid transparent; text-decoration: none; }

@media (max-width: 720px) { .topbar .streak-pill .streak-text { display: none; } }
.search-form { position: relative; }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 60; background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow-lg); overflow: hidden; max-height: 70vh; overflow-y: auto; }

.suggest .sg-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

}
.concept-map-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-sunk); }

.concept-col { display: flex; flex-direction: column; gap: var(--sp-2); width: 210px; flex-shrink: 0; position: relative; z-index: 1; }

.streak-line { display: flex; gap: 8px; align-items: center; }
.acc-body dl.def dt, dl.kv dt { font-weight: 600; }
@media print { .suggest, .collapse-btn, .streak-pill { display: none !important; } }

/* ---------- Mobile robustness (no horizontal page scroll; long labels wrap) ---------- */
.lesson { grid-template-columns: minmax(0, 1fr) 260px; }

}

.badge { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
.grid .btn { white-space: normal; height: auto; min-height: 38px; padding-top: 6px; padding-bottom: 6px; text-align: left; line-height: 1.25; }

/* ---------- Daily session, mastery map, stat strip ---------- */
.hero { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 9%, var(--bg-elev)), var(--bg-elev) 55%); }
.hero-rings { display: flex; gap: var(--sp-5); text-align: center; }

.today-steps { list-style: none; margin: 0; padding: 0; }

.today-step:last-child { border-bottom: 0; padding-bottom: 0; }

@media (max-width: 720px) { .today-head { grid-template-columns: 1fr; } }
.week-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
.week-col { height: 96px; background: var(--bg-sunk); border-radius: 6px; display: flex; align-items: flex-end; overflow: hidden; border: 1px solid var(--border); }
.week-col span { display: block; width: 100%; background: color-mix(in srgb, var(--accent) 55%, var(--bg-sunk)); }
.week-col span.full { background: var(--accent); }
.stat-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; padding: 0; overflow: hidden; }
.strip-item { display: flex; flex-direction: column; gap: 2px; padding: var(--sp-4); color: inherit; text-decoration: none; border-right: 1px solid var(--border); min-width: 0; }
.strip-item:last-child { border-right: 0; }
.strip-item:hover { background: var(--bg-hover); color: inherit; }
.strip-item .v { font-size: var(--fs-xl); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.strip-item .l { font-size: var(--fs-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
@media (max-width: 1100px) { .stat-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); } .strip-item:nth-child(3) { border-right: 0; } .strip-item:nth-child(-n+3) { border-bottom: 1px solid var(--border); } }
@media (max-width: 520px) { .stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } .strip-item { border-bottom: 1px solid var(--border); } .strip-item:nth-child(3) { border-right: 1px solid var(--border); } .strip-item:nth-child(2n) { border-right: 0; } .strip-item:nth-last-child(-n+2) { border-bottom: 0; } }
.mastery-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }

@media (max-width: 520px) { .mastery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mastery-tile { display: grid; gap: 3px; padding: 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-elev); color: var(--text); text-decoration: none; min-width: 0; transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.mastery-tile:hover { border-color: var(--accent); color: var(--text); transform: translateY(-1px); }

.mastery-tile .mt-m { font-size: var(--fs-xs); color: var(--text-2); font-variant-numeric: tabular-nums; }
.mastery-tile[data-l="1"], .mastery-legend span[data-l="1"] { background: color-mix(in srgb, var(--accent) 7%, var(--bg-elev)); }
.mastery-tile[data-l="2"], .mastery-legend span[data-l="2"] { background: color-mix(in srgb, var(--accent) 14%, var(--bg-elev)); }
.mastery-tile[data-l="3"], .mastery-legend span[data-l="3"] { background: color-mix(in srgb, var(--accent) 22%, var(--bg-elev)); }
.mastery-tile[data-l="4"], .mastery-legend span[data-l="4"] { background: color-mix(in srgb, var(--accent) 32%, var(--bg-elev)); border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.mastery-legend { display: flex; align-items: center; gap: 4px; }
.mastery-legend span { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg-elev); }
.reduce-motion .mastery-tile { transition: none; }
.reduce-motion .mastery-tile:hover { transform: none; }

/* ---------- Reading progress + command palette ---------- */
.read-progress { position: fixed; top: var(--topbar-h); left: 0; right: 0; height: 3px; z-index: 29; pointer-events: none; }
.read-progress span { display: block; height: 100%; width: 0; background: var(--accent); }
.palette-btn { border: 1px solid var(--border); background: var(--bg-sunk); border-radius: 8px; height: 32px; padding: 0 8px; cursor: pointer; color: var(--text-2); }
.palette-btn:hover { border-color: var(--accent); color: var(--accent); }
.palette-btn:focus-visible { outline: none; box-shadow: var(--focus); }
.palette-btn kbd, .palette kbd, .key-hint kbd { font: inherit; font-size: var(--fs-xs); font-weight: 600; background: var(--bg-elev); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--text-2); }
.palette-btn kbd { border: 0; background: none; padding: 0; }
@media (max-width: 720px) { .palette-btn, .key-hint { display: none; } }
.modal-root .palette-backdrop { place-items: start center; padding-top: min(14vh, 120px); }
.palette { width: min(640px, 100%); background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column; max-height: min(70vh, 560px); }
.palette-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.palette-head svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; color: var(--text-3); }
.palette-input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: var(--fs-md, 1rem); padding: 4px 0; }
.palette-list { overflow-y: auto; padding: 6px; }
.palette-group { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--text-3); padding: 8px 10px 4px; }
.palette-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; min-width: 0; }
.palette-item svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; color: var(--text-3); }
.palette-item .palette-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-item .small { flex: none; }
.palette-item[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.palette-item[aria-selected="true"] svg { color: var(--accent); }
.palette-empty { padding: 18px 12px; }
.palette-foot { display: flex; gap: 16px; padding: 8px 16px; border-top: 1px solid var(--border); background: var(--bg-sunk); }
@media print { .read-progress, .palette-btn, .key-hint { display: none !important; } }

/* ---------- Charts (calculators) ---------- */
:root, [data-theme="light"] { --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; }
[data-theme="dark"] { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; }
.viz { margin: var(--sp-4) 0; padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev); }
.viz figcaption { font-weight: 650; font-size: var(--fs-sm); margin-bottom: 10px; color: var(--text); }
.viz-split { display: flex; gap: 2px; height: 30px; border-radius: 6px; overflow: hidden; background: var(--bg-sunk); }
.viz-split span { display: block; min-width: 3px; transition: width 220ms var(--ease); }
.viz .s1, .viz-sw.s1 { background: var(--series-1); } .viz .s2, .viz-sw.s2 { background: var(--series-2); } .viz .s3, .viz-sw.s3 { background: var(--series-3); } .viz .s4, .viz-sw.s4 { background: var(--series-4); }
.viz-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: var(--fs-sm); color: var(--text-2); }
.viz-key { display: inline-flex; align-items: center; gap: 6px; }
.viz-key strong { color: var(--text); }
.viz-sw { width: 11px; height: 11px; border-radius: 3px; flex: none; display: inline-block; }
.viz-bars { display: grid; gap: 8px; }
.viz-row { display: grid; grid-template-columns: minmax(90px, 30%) minmax(0, 1fr) minmax(70px, auto); gap: 10px; align-items: center; font-size: var(--fs-sm); }
.viz-lbl { color: var(--text-2); }
.viz-track { position: relative; height: 18px; display: block; }
.viz-zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--border-strong); }
.viz-bar { position: absolute; top: 0; bottom: 0; background: var(--series-1); border-radius: 0 4px 4px 0; transition: width 220ms var(--ease), left 220ms var(--ease); }
.viz-bar.neg { border-radius: 4px 0 0 4px; background: var(--series-2); }
.viz-bar.warn { background: var(--series-2); }
.viz-bar.net { background: var(--series-3); }
.viz-val { text-align: right; font-weight: 600; color: var(--text); }
svg.viz-line { display: block; width: 100%; height: auto; margin-top: 6px; touch-action: pan-y; }
.viz-grid { stroke: var(--border); stroke-width: 1; }
.viz-tick { fill: var(--text-3); font-size: 11px; font-family: var(--font-sans); }
.viz-path { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.viz-path.s1 { stroke: var(--series-1); background: none; } .viz-path.s2 { stroke: var(--series-2); background: none; } .viz-path.s3 { stroke: var(--series-3); background: none; }
.viz-path.dashed { stroke-dasharray: 6 5; }
.viz-dot { stroke: var(--bg-elev); stroke-width: 2; }
.viz-dot.s1 { fill: var(--series-1); } .viz-dot.s2 { fill: var(--series-2); } .viz-dot.s3 { fill: var(--series-3); }
.viz-cross { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 3 3; }
.viz-scrub, .calc-range { width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
.viz-read { display: flex; flex-wrap: wrap; gap: 4px 16px; min-height: 1.5em; margin-top: 4px; color: var(--text-2); }

/* ---------- Animated transaction diagrams ---------- */
.token-bg { fill: var(--accent); stroke: var(--bg-sunk); stroke-width: 2.5; }
.token-fg { fill: var(--accent-contrast); }
.token-ink { stroke: var(--accent); stroke-width: 1.4; fill: none; stroke-linecap: round; }
.token-line { stroke: var(--accent-contrast); stroke-width: 2; fill: none; stroke-linecap: round; }
.token-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.token-legend span { display: inline-flex; align-items: center; gap: 6px; }
svg.token-key { width: 22px; height: 22px; flex: none; }

/* ---------- Learning games ---------- */
.play-card { display: grid; gap: 6px; align-content: start; }
.play-card h2 { margin: 4px 0 0; font-size: var(--fs-lg); font-family: var(--font-sans); }
.play-card p { margin: 0 0 6px; font-size: var(--fs-sm); }
.play-card .badge { justify-self: start; }
.play-ico { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.play-ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.build-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-4); align-items: start; margin-bottom: var(--sp-4); }
@media (max-width: 860px) { .build-grid { grid-template-columns: minmax(0, 1fr); } }
.build-seq { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.build-slot { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; margin: 0; }
.build-n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-sunk); border: 1px solid var(--border-strong); font-weight: 700; font-size: var(--fs-sm); color: var(--text-2); }
.build-empty { border: 1px dashed var(--border-strong); border-radius: var(--radius); min-height: 46px; display: flex; align-items: center; padding: 0 12px; font-size: var(--fs-sm); }
.build-pool { display: grid; gap: 8px; }
.build-step { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; text-align: left; width: 100%; padding: 9px 12px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--bg-elev); color: var(--text); font: inherit; cursor: pointer; min-height: 46px; }
.build-step .build-label { font-weight: 600; grid-column: 1; }
.build-step .small { grid-column: 1; }
.build-step .build-mark { grid-column: 2; grid-row: 1 / span 2; align-self: center; display: grid; }
.build-step .build-mark svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; }
.build-step:hover:not(:disabled) { border-color: var(--accent); background: var(--bg-hover); }
.build-step:focus-visible, .match-item:focus-visible, .sort-bucket:focus-visible { outline: none; box-shadow: var(--focus); }
.build-step:disabled { cursor: default; opacity: 1; }
.build-slot.right .build-step { border-color: var(--ok); background: var(--ok-soft); }
.build-slot.right .build-mark { color: var(--ok); }
.build-slot.wrong .build-step { border-color: var(--bad); background: var(--bad-soft); }

Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[485]},"extendedDefinition":"Rent or wage to be decided by a judge or arbitrator.","relatedTerms":["Ajr al-Musammah","Ujrah"],"chapter":11,"discussedOnPages":[280]},{"id":"g-ajr-al-musammah","term":"Ajr al-Musammah","category":"Leasing & services","definition":"Rent or wage agreed by the parties in an Ijarah or Ujrah contract.","glossaryPage":485,"topicId":"t11.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[485]},"extendedDefinition":"Agreed rent or wage in Ijarah or Ujrah contracts.","relatedTerms":["Ajr al-Mithl","Ujrah","Al-Ajr"],"chapter":11,"discussedOnPages":[280]},{"id":"g-akhlaq","term":"Akhlaq","category":"Ethics","definition":"Moral self-discipline governing one's conduct towards others.","glossaryPage":485,"topicId":"t2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[485]},"extendedDefinition":"Matters for disciplining one’s self regarding relationships with others.","relatedTerms":["Aqaid","Taqwa"],"chapter":2,"discussedOnPages":[21]},{"id":"g-al-ajr","term":"Al-Ajr","category":"Leasing & services","definition":"A fee, commission or wage for services rendered or work done.","glossaryPage":485,"topicId":"t11.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[485]},"extendedDefinition":"Commission, fees or wages charged for services rendered or work done.","relatedTerms":["Ujrah","Ajr al-Musammah"],"chapter":11,"discussedOnPages":[279]},{"id":"g-al-ghunm-bil-ghurm","term":"Al Ghunm bil Ghurm","category":"Principles","definition":"Maxim: gain is justified only by bearing risk and engaging in the venture — the rationale for profit sharing in Shirkah.","glossaryPage":485,"topicId":"t4.2.6","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[485]},"extendedDefinition":"Earning profit is legitimized only by risk-sharing and engaging in an economic venture. This provides the rationale and the principle of profit-sharing in Shirkah arrangements. Al Kharaj bil Daman has similar meaning: one can claim profit only if one is ready to take liability – to bear the business risk, if any.","relatedTerms":["Kharaj bi-al-Daman","Shirkah"],"chapter":4,"discussedOnPages":[81]},{"id":"g-al-hisbah","term":"Al-Hisbah","category":"Ethics","definition":"Ombudsman-type institution that polices market imbalances to restore fair, market-based exchange.","glossaryPage":485,"topicId":"t2.5.5","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[485]},"extendedDefinition":"The institution of ombudsman, a social regulatory body empowered to check imbalances in the market for the purpose of re-establishing a better semblance of market-driven exchanges in the light of the principles of justice.","relatedTerms":["Ghaban-e-Fahish","Najash"],"chapter":2,"discussedOnPages":[31]},{"id":"g-al-kali-bil-kali","term":"Al Kali bil Kali","category":"Prohibitions","definition":"Exchange in which both counter-values are deferred — the sale of a debt for a debt (Bai‘ al-Dayn bid-Dayn).","glossaryPage":485,"topicId":"t6.10","origin":["f1","f2"],"aliases":["Al K ali bil K ali"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[485]},"extendedDefinition":"Exchange of two things, both delayed, or exchange of delayed counter value for another delayed counter value – also termed Bai‘ al-Dayn bid-Dayn.","chapter":6,"discussedOnPages":[147]},{"id":"g-al-sarf","term":"Al-Sarf","category":"Money & exchange","definition":"Exchange of monetary value for monetary value (currency exchange); both prices must be settled simultaneously.","glossaryPage":485,"topicId":"t3.2.1.d","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[485]},"extendedDefinition":"Sale of monetary value for monetary value – currency exchange. In Islamic law such exchange is regarded as “sale of price for price”, and each price is a consideration of the other; has to be simultaneously paid.","relatedTerms":["Bai‘ al Sarf","Sarf"],"chapter":3,"discussedOnPages":[52]},{"id":"g-al-wadiah","term":"Al-Wadi‘ah","category":"Banking","definition":"Safe-keeping of deposits as a trust on which no profit can be sought.","glossaryPage":485,"topicId":"t8.5.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[485]},"extendedDefinition":"A basis for safe-keeping of deposits (Am anah) on which no profit can be sought.","relatedTerms":["Wadi‘ah","Amanah"],"chapter":5,"discussedOnPages":[119]},{"id":"g-amanah","term":"Amanah","category":"Banking","definition":"Property held in trust; the trustee is not liable for loss unless he breaches his duty. If the bank is authorised to use current-account funds, the trust becomes a loan repayable in full.","glossaryPage":485,"topicId":"t7.11","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[485]},"extendedDefinition":"Refers to deposit in trust. A person can hold a property in trust for another, sometimes by express contract and sometimes by implication of a contract. It entails the absence of liability for loss, except in breach of duty. Current accounts are regarded as Amanah. If the bank gets authority to use current account funds in its business, Amanah transforms into a loan. As every loan has to be repaid, banks are liable to repay the full amounts of the current accounts, irrespective of their loss or profit.","chapter":1,"discussedOnPages":[16]},{"id":"g-ameen","term":"Ameen","category":"Contracts","definition":"A trustee who safeguards another's property as his own and is not liable for damage without negligence.","glossaryPage":486,"topicId":"t11.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Trustworthy, trustee – safeguarding others’ entrusted property as if it was his own; not liable in case of any damage to the trust property without any negligence on his part.","relatedTerms":["Amanah","Wadi‘ah"],"chapter":11,"discussedOnPages":[280]},{"id":"g-aqaid","term":"Aqaid","category":"Sources & jurisprudence","definition":"Matters of belief and worship concerning the relationship between man and God.","glossaryPage":486,"topicId":"t2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Matters of belief and worship – rituals pertaining to the relationship between man and God.","relatedTerms":["Iman","Akhlaq"],"chapter":2,"discussedOnPages":[21]},{"id":"g-aqd","term":"‘Aqd","category":"Contracts","definition":"Literally a tie or conjunction; legally, a contract.","glossaryPage":486,"topicId":"t5.2.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Lexically, conjunction or to tie; legally, synonymous with the word “contract” in modern law. ´Aqd Batil : A void or invalid contract – one which does not fulfil the conditions relating to offer and acceptance, subject matter or the consideration and possession or delivery of the subject matter or involves some illegal external attributes like the involvement of Riba, Gharar or Qimar. ´Aqd Ghair L azim: A contract in which any of the parties has a right to revoke it without the consent of the other. ´Aqd L azim: A contract in which none of the parties has a unilateral right to revoke (without the consent of the other).","relatedTerms":["Ijab","Qabul","Fasid","Bai‘ Batil"],"chapter":5,"discussedOnPages":[103,104]},{"id":"g-aqd-batil","term":"‘Aqd Batil","category":"Contracts","definition":"A void contract — defective in offer and acceptance, subject matter, consideration or delivery, or tainted by Riba, Gharar or Qimar.","glossaryPage":486,"topicId":"t5.7.3","origin":["f1"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]}},{"id":"g-aqd-ghair-lazim","term":"‘Aqd Ghair Lazim","category":"Contracts","definition":"A non-binding contract that either party may revoke without the other's consent.","glossaryPage":486,"topicId":"t5.7","origin":["f1"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]}},{"id":"g-aqd-lazim","term":"‘Aqd Lazim","category":"Contracts","definition":"A binding contract that no party can revoke unilaterally.","glossaryPage":486,"topicId":"t5.7","origin":["f1"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]}},{"id":"g-aqilah","term":"‘Aqilah","category":"Takaful & social","definition":"Kinsmen who share a responsibility, historically the payment of blood money — a precedent for Takaful.","glossaryPage":486,"topicId":"t16.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Kin or persons of relationship who share any responsibility.","relatedTerms":["Dhaman Khatr al-Tariq","Takaful"],"chapter":3,"discussedOnPages":[68]},{"id":"g-arbun","term":"‘Arbun","category":"Contracts","definition":"Down-payment taken after a sale is agreed; the seller may keep it if the buyer backs out.","glossaryPage":486,"topicId":"t6.9","origin":["f1","f2"],"aliases":["‘Arb un"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Downpayment; an amount taken from the buyer as part of the price after execution of the sale agreement; the seller has the option to confiscate it if the buyer backs out and does not complete the purchase process.","relatedTerms":["Bai‘al‘Arb un","Hamish Jiddiyah"],"chapter":3,"discussedOnPages":[59]},{"id":"g-ariyah","term":"‘Ariyah","category":"Contracts","definition":"Gratuitous loan of a non-consumable object — a gift of its usufruct; the same item must be returned (unlike Qard).","glossaryPage":486,"topicId":"t7.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Gratuitous loan of objects. It means the loan of a particular piece of property, the substance of which is not consumed by its use, without anything taken in exchange. In other words, it is the gift of usufruct of a commodity that is not consumed on use. It is different from Qard, which is the loan of fungible objects which are consumed on use and in which the similar and not the same commodity has to be returned. It is also a virtuous act like Qard. The borrowed commodity is treated as a liability of the borrower, who is bound to return it to its owner.","relatedTerms":["Qard","Hibah"],"chapter":5,"discussedOnPages":[119]},{"id":"g-athman","term":"Athman","category":"Money & exchange","definition":"Plural of Thaman: monetary units used to pay prices and liabilities.","glossaryPage":486,"topicId":"t4.7.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Plural of Thaman – monetary units – medium of exchange used for payment of prices and liabilities.","relatedTerms":["Thaman","Sarf"],"chapter":3,"discussedOnPages":[52]},{"id":"g-bai-al-arbun","term":"Bai‘ al ‘Arbun","category":"Contracts","definition":"Sale with a down-payment that becomes part of the price if the buyer completes and is forfeited if he does not.","glossaryPage":486,"topicId":"t6.9","origin":["f1","f2"],"aliases":["Bai‘al‘Arb un"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"A sale of downpayment with the condition that if the buyer takes the commodity, the downpayment will become part of the selling price and if he does not purchase the commodity, the advance money will be forfeited.","relatedTerms":["‘Arb un"],"chapter":5,"discussedOnPages":[116,117]},{"id":"g-bai-al-dayn","term":"Bai‘ al Dayn","category":"Prohibitions","definition":"Sale of a debt or debt instrument; at a discount it is rejected by the majority of jurists.","glossaryPage":486,"topicId":"t7.16","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Sale of debt or debt instruments.","relatedTerms":["Dayn","Hawalah"],"chapter":6,"discussedOnPages":[146,147]},{"id":"g-bai-al-ghaib","term":"Bai‘ al-Ghaib","category":"Prohibitions","definition":"Sale of absent or concealed goods whose features are unknown.","glossaryPage":486,"topicId":"t6.7","origin":["f1","f2"],"aliases":["Bai‘ al-Gh aib"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Sale of absent or concealed goods (without knowing their features/specifications).","relatedTerms":["Khiyar al Ro’yat","Gharar"],"chapter":3,"discussedOnPages":[60]},{"id":"g-bai-al-hasat","term":"Bai‘ al Hasat","category":"Prohibitions","definition":"Pre-Islamic sale in which the object is determined by where a thrown pebble falls — prohibited for Gharar.","glossaryPage":486,"topicId":"t6.7","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Sale where the subject matter depends on the fall of a stone or pebble; prohibited due to Gharar.","relatedTerms":["Gharar","Mulamasah","Munabadhah"],"chapter":3,"discussedOnPages":[59]},{"id":"g-bai-al-inah","term":"Bai‘ al ‘Inah","category":"Prohibitions","definition":"Sale and buy-back: an item is sold for cash and bought back at a higher credit price (or vice versa), producing a loan with interest — prohibited.","glossaryPage":486,"topicId":"t6.11","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Double sale by which the borrower and the lender sell and then resell an object between them, once for cash and then for a higher price on credit, with the net result of a loan with interest – prohibited.","relatedTerms":["Tawarruq","Bai‘ bil Wafa","Riba"],"chapter":5,"discussedOnPages":[103]},{"id":"g-bai-al-khiyar","term":"Bai‘ al Khiyar","category":"Contracts","definition":"Sale in which one party has an option to rescind within a set time.","glossaryPage":486,"topicId":"t6.12","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Sale with an option of one party to rescind the contract within a specified time.","relatedTerms":["Khiyar","Khiyar al-Shart"],"chapter":5,"discussedOnPages":[124]},{"id":"g-bai-al-majhul","term":"Bai‘ al-Majhul","category":"Prohibitions","definition":"Sale in which the object, price or payment time is unknown.","glossaryPage":486,"topicId":"t6.7","origin":["f1","f2"],"aliases":["Bai‘ al-Majh ul"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"A sale in which the object of sale or its price or the time of payment remains unknown and unspecified – lacking any material information.","relatedTerms":["Ma‘lum","Gharar"],"chapter":5,"discussedOnPages":[122]},{"id":"g-bai-al-muallaq","term":"Bai‘ al Mu‘allaq","category":"Contracts","definition":"Suspended sale whose effect depends on a future condition or event.","glossaryPage":486,"topicId":"t5.9","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Suspended sale – a sale transaction, the effectiveness of which is related to any future condition or action.","relatedTerms":["Mawquf","T‘aliq"],"chapter":3,"discussedOnPages":[60]},{"id":"g-bai-al-sarf","term":"Bai‘ al Sarf","category":"Money & exchange","definition":"Sale of gold, silver or monetary units against each other; must be spot, and equal where of the same kind.","glossaryPage":486,"topicId":"t3.2.1.d","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Sale of gold, silver or other monetary units on both sides.","relatedTerms":["Sarf","Al-Sarf"],"chapter":3,"discussedOnPages":[52]},{"id":"g-bai-batil","term":"Bai‘ Batil","category":"Contracts","definition":"Void sale with no legal effect on the parties' rights and liabilities.","glossaryPage":486,"topicId":"t5.7.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[486]},"extendedDefinition":"Invalid sale – having no effect in respect of rights and liabilities of the parties.","relatedTerms":["Fasid","‘Aqd"],"chapter":6,"discussedOnPages":[133]},{"id":"g-bai-bil-wafa","term":"Bai‘ bil Wafa","category":"Contracts","definition":"Sale with the seller's right to redeem by refunding the price — in substance a pledge; impermissible if resale is made a condition of the sale.","glossaryPage":487,"topicId":"t6.8","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"Sale with a right of the seller to repurchase (redeem) the property by refunding the purchase price – basically a pledge; treats the sold asset as collateral until the amount is paid back by the other party to sale; not permissible if the resale of the property to the original seller is made a condition for the initial sale.","relatedTerms":["Bai‘ al ‘Inah"],"chapter":6,"discussedOnPages":[150]},{"id":"g-bai-muajjal","term":"Bai‘ Mu’ajjal","category":"Financing modes","definition":"Credit sale: the price is paid later in a lump sum or instalments and is usually higher than the spot price.","glossaryPage":487,"topicId":"t9.6.1","origin":["f1","f2"],"aliases":["Bai‘ Mu´ajjal"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"Literally, a credit sale. Technically, a financing technique adopted by Islamic banks; it is a contract in which the seller allows the buyer to pay the price of a commodity at a future date in a lump sum or in instalments. The price fixed for the commodity in such a transaction can be the same as the spot price or higher or lower than the spot price, but generally it is higher than the spot price.","relatedTerms":["Murabaha","Bai‘ Salam"],"chapter":5,"discussedOnPages":[124]},{"id":"g-bai-murabaha","term":"Bai‘ Murabaha","category":"Financing modes","definition":"Sale at disclosed cost plus an agreed profit.","glossaryPage":487,"topicId":"t9.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"Sale at cost price plus a mutually agreed profit – bargaining on profit margin on the cost price. (See Murabaha)","relatedTerms":["Murabaha","Bai‘ Musawamah","Bai‘ Tawliyah","Bai‘ Wadhi‘ah"],"chapter":5,"discussedOnPages":[124]},{"id":"g-bai-musawamah","term":"Bai‘ Musawamah","category":"Financing modes","definition":"Sale by bargaining on price without disclosing the seller's cost.","glossaryPage":487,"topicId":"t9.11","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"Sale without any reference to the cost price to the seller – bargaining on price.","relatedTerms":["Musawamah","Bai‘ Murabaha"],"chapter":5,"discussedOnPages":[125]},{"id":"g-bai-salam","term":"Bai‘ Salam","category":"Financing modes","definition":"Forward sale with full advance payment for specified goods delivered on a fixed future date — an exception allowed by the Prophet (pbuh); not for gold, silver or currencies.","glossaryPage":487,"topicId":"t10.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"A contract in which advance payment is made for goods to be delivered later on. The seller undertakes to supply some specific goods to the buyer at a future date in exchange of an advance price fully paid at the time of the contract. According to normal rules of the Shar i´ah, no sale can be executed unless the goods are in existence at the time of the bargain, but Salam sale forms an exception given by the holy Prophet himself to the general rule, provided the goods and their prices are defined and the date of delivery is fixed. It is necessary that the quality of the commodity intended to be purchased is fully specified, leaving no ambiguity leading to dispute. The objects of this sale are goods and not media of exchange like gold, silver or currencies, because these are regarded as monetary values, the exchange of which is covered under the rules of Bai‘ al Sarf, i.e. hand to hand without delay. Barring this, Bai‘ Salam covers almost everything which is capable of being definitely described as to quantity, quality and workmanship, subject to the fulfilment of other conditions for valid Salam.","relatedTerms":["Salaf","Istisna‘a","Bai‘ Mu´ajjal"],"chapter":5,"discussedOnPages":[124]},{"id":"g-bai-tawliyah","term":"Bai‘ Tawliyah","category":"Contracts","definition":"Sale at cost price, e.g. to accommodate another.","glossaryPage":487,"topicId":"t9.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"Sale at cost price – to facilitate or serve others.","relatedTerms":["Bai‘ Murabaha","Bai‘ Wadhi‘ah"],"chapter":5,"discussedOnPages":[124]},{"id":"g-bai-wadhiah","term":"Bai‘ Wadhi‘ah","category":"Contracts","definition":"Sale at a loss (below cost price).","glossaryPage":487,"topicId":"t9.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"Sale with loss – at a price less than the cost price.","relatedTerms":["Bai‘ Tawliyah","Bai‘ Murabaha"],"chapter":5,"discussedOnPages":[125]},{"id":"g-bai-wal-salaf","term":"Bai‘ wal Salaf","category":"Prohibitions","definition":"Invalid combination of a sale with a loan as a condition of each other.","glossaryPage":487,"topicId":"t5.5.5","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"A conditional contract combining selling and lending, like one man saying to another: “I purchase your goods for such and such if you lend me such and such” – invalid.","relatedTerms":["Salaf","Qard"],"chapter":6,"discussedOnPages":[145]},{"id":"g-barnamaj","term":"Barnamaj","category":"Contracts","definition":"Catalogue or list of the contents of a consignment.","glossaryPage":487,"topicId":"t6.5.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"Catalogue or list of contents in a sale consignment.","chapter":6,"discussedOnPages":[144]},{"id":"g-bayt-al-mal","term":"Bayt al Mal","category":"Takaful & social","definition":"The public treasury of an Islamic state.","glossaryPage":487,"topicId":"t2.5.1","origin":["f1","f2"],"aliases":["Bayt al M al"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"Public treasury of an Islamic State. Buyoo‘al Am anat: Fiduciary sales like Murabaha, Tawliyah and Wadhi‘ah.","relatedTerms":["Waqf","Zakah/Zakat"],"chapte
