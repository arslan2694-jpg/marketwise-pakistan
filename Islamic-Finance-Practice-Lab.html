   "version 1" record under different keys and shapes:
     application A ("F1"): localStorage "ifl.v1"  — topics/answers/attempts/cards/reviews/notes/...
     application B ("F2"): localStorage "ifl_v1"  — progress.{topicsCompleted, flashcardReviews, questionHistory, ...}
   Legacy records are converted, never deleted, and merged when both exist. Ids from either source
   are resolved to canonical ids through IFL.data (alias tables produced by tools/build-data.js). */
(function () {
  var IFL = window.IFL = window.IFL || {};
  var VERSION = 3;
  var DAY = 86400000;

  function defaults() {
    return {
      version: VERSION,
      created: Date.now(),
      settings: { theme: 'system', level: 'mba', fontScale: 1, reduceMotion: false, dailyGoal: 30, name: '', examDate: '' },
      topics: {},          // topicId -> {visited, completed, time, views}
      chapters: {},        // n -> {visited}
      answers: {},         // questionId -> {n, correct, last, lastCorrect, topic}
      attempts: [],        // {id, ts, mode, label, score, total, chapter, items:[{q, ok, topic}]}
      cards: {},           // flashcardId -> {reps, ease, interval, due, lapses, last, grade}
      reviews: [],         // {ts, card, grade}
      notes: [],           // {id, target:{type,id,label,route}, text, created, updated}
      bookmarks: [],       // {type, id, label, route, ts}
      activity: [],
      days: {},            // yyyy-mm-dd -> seconds studied
      timerSessions: [],
      guided: {},          // planId -> {seg, item, remaining, updated, finished}
      exam: {},            // examItemId / checklist -> {ts, text, self}
      cases: {},           // caseId -> {ts, n}
      calcs: {},           // calculator id -> {n, last}
      numericals: {},      // numerical id -> {n, correct, last}
      achievements: {},    // id -> ts
      games: {},           // game -> key -> {best, n, ts}  (learning games; optional, absent in older records)
      legacy: { reviewsBefore: 0, imported: {} },
      last: {}
    };
  }

  function isObj(x) { return x && typeof x === 'object' && !Array.isArray(x); }
  function deepMerge(base, saved) {
    Object.keys(saved || {}).forEach(function (k) {
      if (k === '__proto__' || k === 'constructor' || k === 'prototype') return;
      if (isObj(saved[k]) && isObj(base[k])) deepMerge(base[k], saved[k]);
      else if (saved[k] !== undefined) base[k] = saved[k];
    });
    return base;
  }
  function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function num(x, d) { x = Number(x); return isFinite(x) ? x : (d == null ? 0 : d); }

  /* ---------- SRS sanitising: never leave NaN / negative / impossible values in a card ---------- */
  function cleanCard(c) {
    if (!isObj(c)) return null;
    var now = Date.now();
    var out = {
      reps: Math.max(0, Math.min(1000, Math.round(num(c.reps)))), ease: Math.max(1.3, Math.min(4, num(c.ease, 2.5))),
      interval: Math.max(0, Math.min(3650, Math.round(num(c.interval)))), lapses: Math.max(0, Math.min(1000, Math.round(num(c.lapses)))),
      due: num(c.due, now), last: num(c.last, 0), grade: [0, 1, 2, 3].indexOf(c.grade) > -1 ? c.grade : 2
    };
    if (!(out.due > 0) || out.due > now + 3650 * DAY) out.due = now;
    return out;
  }

  /* ---------- application A (v1) -> v3: ids are already canonical, add the new collections ---------- */
  function migrateF1StateToV3(old) {
    var s = deepMerge(defaults(), old || {});
    if (old && old.settings && old.settings.level === 'simple') s.settings.level = 'beginner';
    ['attempts', 'reviews', 'notes', 'bookmarks', 'activity', 'timerSessions'].forEach(function (k) { if (!Array.isArray(s[k])) s[k] = []; });
    Object.keys(s.cards).forEach(function (k) { var c = cleanCard(s.cards[k]); if (c) s.cards[k] = c; else delete s.cards[k]; });
    s.version = VERSION; s.legacy.imported.f1 = s.legacy.imported.f1 || Date.now();
    return s;
  }

  /* ---------- application B (v1) -> v3 ---------- */
  var RATING = { again: 0, hard: 1, good: 2, easy: 3 };
  var BOX_DAYS = [1, 1, 2, 4, 8, 16];
  function noteTarget(n, D) {
    var id = String(n.refId || '');
    if (n.scope === 'chapter') return { type: 'chapter', id: id, label: 'Chapter ' + id, route: '/chapter/' + id };
    if (n.scope === 'concept') { var cc = D.canonicalConcept(id) || id; return { type: 'concept', id: cc, label: D.labelOf('concept', cc), route: '/concept/' + cc }; }
    if (n.scope === 'flashcard') { var f = D.canonicalFlashcard(id) || id; return { type: 'flashcard', id: f, label: (D.flashcard(f) || {}).front || f, route: D.route('flashcard', f) }; }
    if (n.scope === 'question') { var q = D.canonicalQuestion(id) || id; return { type: 'question', id: q, label: (D.question(q) || {}).prompt || q, route: D.route('question', q) }; }
    var ts = D.canonicalTopics(id); var t = ts[0] && D.topic(ts[0]);
    return t ? { type: 'topic', id: t.id, label: '§' + t.section + ' ' + t.title, route: '/topic/' + t.id } : { type: 'topic', id: id, label: id, route: '/' };
  }
  function bookmarkTarget(b, D) {
    var id = String(b.refId || ''), type = b.type;
    if (type === 'topic') { var ts = D.canonicalTopics(id); var t = ts[0] && D.topic(ts[0]); if (t) return { type: 'topic', id: t.id, label: b.label || '§' + t.section + ' ' + t.title, route: '/topic/' + t.id }; }
    if (type === 'concept') { var c = D.canonicalConcept(id); if (c) return { type: 'concept', id: c, label: b.label || D.labelOf('concept', c), route: '/concept/' + c }; }
    if (type === 'comparison' || type === 'diagram') {
      var cmp = D.canonicalComparison(id); if (cmp) return { type: 'comparison', id: cmp, label: b.label || D.labelOf('comparison', cmp), route: '/compare?id=' + cmp };
      if (D.diagram(id)) return { type: 'diagram', id: id, label: b.label || D.labelOf('diagram', id), route: '/diagram/' + id };
    }
    if (type === 'glossary' || type === 'definition') {
      var g = D.glossary.filter(function (x) { return x.term === id || x.aliases.indexOf(id) > -1; })[0];
      if (g) return { type: 'term', id: g.id, label: g.term, route: '/glossary?term=' + encodeURIComponent(g.id) };
      return { type: 'term', id: id, label: b.label || id, route: '/glossary?q=' + encodeURIComponent(id) };
    }
    if (type === 'question') { var q = D.canonicalQuestion(id); if (q) return { type: 'question', id: q, label: b.label || q, route: D.route('question', q) }; }
    return { type: type || 'topic', id: id, label: b.label || id, route: '/' };
  }
  function migrateF2StateToV3(old, D) {
    D = D || IFL.data;
    var s = defaults(), p = (old && old.progress) || {}, now = Date.now();
    if (old && old.settings) {
      s.settings.theme = old.settings.theme || 'system';
      s.settings.level = ['beginner', 'mba', 'exam'].indexOf(old.settings.explanationLevel) > -1 ? old.settings.explanationLevel : 'mba';
      s.settings.reduceMotion = !!old.settings.reducedMotion;
    }
    if (old && old.createdAt) s.created = old.createdAt;
    /* topics: an application-B topic can span several canonical topics; all of them count as completed */
    Object.keys(p.topicsCompleted || {}).forEach(function (id) {
      D.canonicalTopics(id).forEach(function (tid) {
        var r = s.topics[tid] = s.topics[tid] || { views: 0, time: 0 };
        r.completed = Math.max(r.completed || 0, num(p.topicsCompleted[id], now)); r.visited = r.visited || r.completed;
      });
    });
    Object.keys(p.chapterOpened || {}).forEach(function (n) { s.chapters[n] = { visited: num(p.chapterOpened[n], now) }; });
    Object.keys(p.visitedChapters || {}).forEach(function (n) { if (!s.chapters[n]) s.chapters[n] = { visited: now }; });
    /* quiz history */
    Object.keys(p.questionHistory || {}).forEach(function (qid) {
      var r = p.questionHistory[qid], cq = D.canonicalQuestion(qid); if (!cq) return;
      var q = D.question(cq), a = s.answers[cq] || (s.answers[cq] = { n: 0, correct: 0, topic: q.topicId });
      a.n += Math.max(0, num(r.attempts)); a.correct += Math.max(0, Math.min(num(r.correct), num(r.attempts)));
      a.last = Math.max(a.last || 0, num(r.lastTs)); a.lastCorrect = !!r.lastCorrect; a.topic = q.topicId;
    });
    (p.quizAttempts || []).forEach(function (a) {
      var missed = {}; (a.missed || []).forEach(function (q) { var c = D.canonicalQuestion(q); if (c) missed[c] = 1; });
      s.attempts.push({ id: a.id || ('att-' + a.ts), ts: num(a.ts, now), mode: a.mode || 'chapter', label: a.chapter ? 'Chapter ' + a.chapter + ' quiz (imported)' : 'Quiz (imported)',
        score: num(a.correct), total: num(a.total), chapter: a.chapter == null ? null : Number(a.chapter),
        items: Object.keys(missed).map(function (q) { return { q: q, ok: false, topic: (D.question(q) || {}).topicId }; }) });
    });
    s.attempts.sort(function (x, y) { return y.ts - x.ts; });
    /* flashcards: Leitner box -> interval/ease/due */
    Object.keys(p.flashcardReviews || {}).forEach(function (fid) {
      var r = p.flashcardReviews[fid], cf = D.canonicalFlashcard(fid); if (!cf) return;
      var box = Math.max(0, Math.min(5, num(r.box)));
      var c = cleanCard({ reps: num(r.reps), ease: Math.max(1.3, 2.5 - 0.2 * num(r.lapses)), interval: box === 0 ? 0 : BOX_DAYS[box], lapses: num(r.lapses), due: num(r.dueAt, now), last: num(r.lastReviewed), grade: RATING[r.lastRating] });
      var cur = s.cards[cf]; if (!cur || (c.last || 0) > (cur.last || 0)) s.cards[cf] = c;
    });
    s.legacy.reviewsBefore = Math.max(0, num(p.flashcardsReviewedCount));
    /* study time & streak: reconstruct the days on which the streak was earned */
    if (p.lastStudyDate && /^\d{4}-\d{2}-\d{2}$/.test(p.lastStudyDate)) {
      var last = new Date(p.lastStudyDate + 'T12:00:00').getTime();
      var span = Math.max(1, Math.min(400, num(p.streakDays, 1)));
      for (var i = 0; i < span; i++) { var k = dayKey(last - i * DAY); s.days[k] = Math.max(s.days[k] || 0, 60); }
      if (num(p.studySeconds) > 0) s.days[p.lastStudyDate] = (s.days[p.lastStudyDate] || 0) + num(p.studySeconds);
    } else if (num(p.studySeconds) > 0) s.days[dayKey(now)] = num(p.studySeconds);
    /* guided study */
    var cc = p.crashCourseProgress || {};
    Object.keys(cc).forEach(function (k) { var pid = D.canonicalPlan(k); if (pid) s.guided[pid] = { seg: num(cc[k].stepIndex), item: 0, updated: num(cc[k].completedAt, now), finished: !!cc[k].completedAt }; });
    Object.keys(p.caseStudiesCompleted || {}).forEach(function (id) { if (D.caseStudy(id)) s.cases[id] = { ts: num(p.caseStudiesCompleted[id], now), n: 1 }; });
    /* notes & bookmarks */
    (old.notes || []).forEach(function (n) { s.notes.push({ id: String(n.id), target: noteTarget(n, D), text: String(n.text || ''), created: num(n.createdAt, now), updated: num(n.updatedAt, now) }); });
    (old.bookmarks || []).forEach(function (b) { var t = bookmarkTarget(b, D); s.bookmarks.push({ type: t.type, id: t.id, label: t.label, route: t.route, ts: num(b.createdAt, now) }); });
    Object.keys(old.achievements || {}).forEach(function (k) { s.achievements[k] = num(old.achievements[k], now); });
    s.legacy.imported.f2 = now;
    return s;
  }

  /* ---------- merge two v3 states (used when both legacy records exist, or on import) ---------- */
  function mergeStates(a, b) {
    var s = deepMerge(defaults(), a);
    Object.keys(b.topics || {}).forEach(function (k) {
      var x = s.topics[k] || (s.topics[k] = { views: 0, time: 0 }), y = b.topics[k];
      x.completed = Math.max(x.completed || 0, y.completed || 0) || null; x.visited = Math.min(x.visited || Infinity, y.visited || Infinity); if (!isFinite(x.visited)) delete x.visited;
      x.views = (x.views || 0) + (y.views || 0); x.time = (x.time || 0) + (y.time || 0);
    });
    Object.keys(b.chapters || {}).forEach(function (k) { s.chapters[k] = s.chapters[k] || b.chapters[k]; });
    Object.keys(b.answers || {}).forEach(function (k) {
      var x = s.answers[k], y = b.answers[k];
      if (!x) s.answers[k] = y; else { x.n += y.n; x.correct += y.correct; if ((y.last || 0) > (x.last || 0)) { x.last = y.last; x.lastCorrect = y.lastCorrect; } }
    });
    var seen = {}; s.attempts = s.attempts.concat(b.attempts || []).filter(function (x) { if (seen[x.id]) return false; seen[x.id] = 1; return true; }).sort(function (x, y) { return y.ts - x.ts; }).slice(0, 400);
    Object.keys(b.cards || {}).forEach(function (k) { var x = s.cards[k], y = b.cards[k]; if (!x || (y.last || 0) > (x.last || 0)) s.cards[k] = y; });
    s.reviews = s.reviews.concat(b.reviews || []).sort(function (x, y) { return x.ts - y.ts; });
    var nid = {}; s.notes.forEach(function (n) { nid[n.id] = 1; }); (b.notes || []).forEach(function (n) { if (!nid[n.id]) s.notes.push(n); });
    (b.bookmarks || []).forEach(function (x) { if (!s.bookmarks.some(function (y) { return y.type === x.type && y.id === x.id; })) s.bookmarks.push(x); });
    Object.keys(b.days || {}).forEach(function (k) { s.days[k] = Math.max(s.days[k] || 0, b.days[k]); });
    Object.keys(b.guided || {}).forEach(function (k) { var x = s.guided[k], y = b.guided[k]; if (!x || (y.finished && !x.finished)) s.guided[k] = y; });
    Object.keys(b.cases || {}).forEach(function (k) { s.cases[k] = s.cases[k] || b.cases[k]; });
    Object.keys(b.achievements || {}).forEach(function (k) { s.achievements[k] = Math.min(s.achievements[k] || Infinity, b.achievements[k]); });
    s.legacy.reviewsBefore = (s.legacy.reviewsBefore || 0) + ((b.legacy && b.legacy.reviewsBefore) || 0);
    Object.keys((b.legacy && b.legacy.imported) || {}).forEach(function (k) { s.legacy.imported[k] = b.legacy.imported[k]; });
    return s;
  }

  /* ---------- version ladder for v3+ records ---------- */
  function migrateStateV3ToLatest(s) {
    s = deepMerge(defaults(), s || {});
    ['attempts', 'reviews', 'notes', 'bookmarks', 'activity', 'timerSessions'].forEach(function (k) { if (!Array.isArray(s[k])) s[k] = []; });
    Object.keys(s.cards).forEach(function (k) { var c = cleanCard(s.cards[k]); if (c) s.cards[k] = c; else delete s.cards[k]; });
    s.version = VERSION;
    return s;
  }

  /* Detect what kind of record an imported/legacy object is. */
  function detect(obj) {
    if (!isObj(obj)) return null;
    var data = obj.data && isObj(obj.data) ? obj.data : obj;
    if (obj.app === 'islamic-finance-mba-learning-system' || (data.version >= 3 && 'legacy' in data)) return { kind: 'v3', data: data };
    if (isObj(data.progress) && ('topicsCompleted' in data.progress || 'flashcardReviews' in data.progress || 'quizAttempts' in data.progress)) return { kind: 'f2', data: data };
    if (isObj(data.settings) && 'topics' in data && ('answers' in data || 'cards' in data)) return { kind: 'f1', data: data };
    return null;
  }
  function toV3(obj, D) {
    var d = detect(obj); if (!d) throw new Error('This file does not look like a study-data export from this application or from either of the applications it combines.');
    if (d.kind === 'f2') return migrateF2StateToV3(d.data, D);
    if (d.kind === 'f1') return migrateF1StateToV3(d.data);
    return migrateStateV3ToLatest(d.data);
  }

  IFL.migrate = { VERSION: VERSION, defaults: defaults, cleanCard: cleanCard, migrateF1StateToV3: migrateF1StateToV3, migrateF2StateToV3: migrateF2StateToV3, migrateStateV3ToLatest: migrateStateV3ToLatest, mergeStates: mergeStates, detect: detect, toV3: toV3 };
})();

</script>
<script data-src="modules/store.js">
/* User-state store — ONE versioned record (APP_STATE_VERSION 3) under localStorage "ifl.v3".
   Legacy records from the two applications this platform combines ("ifl.v1" and "ifl_v1") are
   converted on first run by modules/migrate.js; they are left in place, never overwritten.
   Falls back to in-memory storage (with a warning) if localStorage is unavailable.
   Nothing here is ever sent over the network. */
(function () {
  var IFL = window.IFL;
  var M = IFL.migrate;
  /* A companion build (e.g. the Practice Lab) sets IFL_STORE_KEY so it keeps its own record and never touches or converts the main app's data. */
  var KEY = window.IFL_STORE_KEY || 'ifl.v3', LEGACY_A = 'ifl.v1', LEGACY_B = 'ifl_v1';
  var APP_STATE_VERSION = M.VERSION;
  IFL.APP_STATE_VERSION = APP_STATE_VERSION;

  var mem = null, persistent = true, listeners = [], state;

  function readKey(k) {
    try { return localStorage.getItem(k); }
    catch (e) { persistent = false; return k === KEY ? mem : null; }
  }
  function writeRaw(s) {
    try { localStorage.setItem(KEY, s); return true; }
    catch (e) {
      persistent = false; mem = s;
      if (!writeRaw.warned) { writeRaw.warned = true; IFL.u && IFL.u.toast('Saving is unavailable in this browser mode — progress will last only for this session.', 5000); }
      return false;
    }
  }
  function parse(raw) { try { var o = JSON.parse(raw); return o && typeof o === 'object' ? o : null; } catch (e) { return null; } }

  function load() {
    var raw = readKey(KEY);
    if (raw) {
      var s = parse(raw);
      if (s) return M.migrateStateV3ToLatest(s);
      console.warn('Stored study data was unreadable; a backup copy was kept.');
      try { localStorage.setItem(KEY + '.corrupt.' + Date.now(), raw); } catch (e2) { /* ignore */ }
    }
    /* first run of the unified app: bring over anything the earlier applications stored */
    if (window.IFL_STORE_KEY) return M.defaults();
    var out = null, a = parse(readKey(LEGACY_A)), b = parse(readKey(LEGACY_B));
    try {
      if (a) out = M.migrateF1StateToV3(a);
      if (b) { var sb = M.migrateF2StateToV3(b, IFL.data); out = out ? M.mergeStates(out, sb) : sb; }
    } catch (e) { console.warn('Legacy study data could not be converted; starting fresh.', e); out = null; }
    return out || M.defaults();
  }

  var saveTimer = null;
  function save(immediate) {
    clearTimeout(saveTimer);
    var run = function () { writeRaw(JSON.stringify(state)); };
    if (immediate) run(); else saveTimer = setTimeout(run, 150);
  }
  function emit(what) { listeners.forEach(function (fn) { try { fn(what); } catch (e) { console.error(e); } }); }

  state = load();
  var imported = state.legacy && state.legacy.imported;
  IFL.legacyImported = imported && (imported.f1 || imported.f2) ? imported : null;
  save(true);
  window.addEventListener('beforeunload', function () { save(true); });
  window.addEventListener('pagehide', function () { save(true); });

  IFL.store = {
    get state() { return state; },
    persistent: function () { return persistent; },
    /* update(fn) mutates state inside fn, then saves and notifies. */
    update: function (fn, what) { fn(state); save(); emit(what || 'change'); },
    on: function (fn) { listeners.push(fn); return function () { listeners = listeners.filter(function (f) { return f !== fn; }); }; },
    flush: function () { save(true); },
    exportJSON: function () {
      save(true);
      return JSON.stringify({ app: 'islamic-finance-mba-learning-system', version: APP_STATE_VERSION, exported: new Date().toISOString(), data: state }, null, 2);
    },
    /* Accepts an export from this app, or an export/raw record from either earlier application. mode: 'replace' | 'merge'. */
    importJSON: function (text, mode) {
      var obj = JSON.parse(text);
      var next = M.toV3(obj, IFL.data);
      state = mode === 'merge' ? M.mergeStates(state, next) : next;
      save(true); emit('import');
    },
    reset: function () {
      var keepSettings = state.settings;
      state = M.defaults(); state.settings = keepSettings; save(true); emit('reset');
    }
  };
})();

</script>
<script data-src="modules/progress.js">

/* Progress, performance analytics, bookmarks, notes, activity, study time, streaks,
   achievements and the "What do I study next?" engine. All values come from real interaction. */
(function () {
  var IFL = window.IFL, u = IFL.u, S = IFL.store;
  var CI = window.IFL_DATA.courseIndex;

  /* ---------- Course index lookups ---------- */
  var topicMap = {}, chapterMap = {}, allTopicIds = [];
  CI.chapters.forEach(function (c) {
    chapterMap[c.n] = c;
    c.topicObjs = c.topics.map(function (t) {
      var o = { id: t[0], section: t[1], title: t[2], pages: t[3], tier: t[4], concepts: t[5], chapter: c.n };
      topicMap[o.id] = o; allTopicIds.push(o.id); return o;
    });
  });
  var partTitle = {}; CI.parts.forEach(function (p) { partTitle[p.id] = p.title; });
  IFL.course = {
    index: CI, chapters: CI.chapters, parts: CI.parts, topic: function (id) { return topicMap[id]; },
    chapter: function (n) { return chapterMap[n]; }, partTitle: function (id) { return partTitle[id]; }, allTopicIds: allTopicIds,
    chapterOfTopic: function (id) { var t = topicMap[id]; return t ? chapterMap[t.chapter] : null; },
    nextTopic: function (id) { var i = allTopicIds.indexOf(id); return i > -1 && i < allTopicIds.length - 1 ? topicMap[allTopicIds[i + 1]] : null; },
    prevTopic: function (id) { var i = allTopicIds.indexOf(id); return i > 0 ? topicMap[allTopicIds[i - 1]] : null; },
    sourceLabel: function (id) {
      var t = topicMap[id]; if (!t) return '';
      return 'Ch ' + t.chapter + (t.section && t.section !== 'Appendix' ? ' · §' + t.section : ' · Appendix') + (t.pages ? ' · p. ' + (t.pages[0] === t.pages[1] ? t.pages[0] : t.pages[0] + '–' + t.pages[1]) : '');
    }
  };

  function st() { return S.state; }
  function log(type, label, route) {
    S.update(function (s) {
      var last = s.activity[0];
      if (last && last.route === route && last.type === type && Date.now() - last.ts < 10 * 60 * 1000) { last.ts = Date.now(); return; }
      s.activity.unshift({ ts: Date.now(), type: type, label: label, route: route });
      if (s.activity.length > 150) s.activity.length = 150;
    }, 'activity');
  }

  /* ---------- Topics & chapters ---------- */
  function visitTopic(id) {
    var t = topicMap[id]; if (!t) return;
    S.update(function (s) {
      var r = s.topics[id] = s.topics[id] || { views: 0, time: 0 };
      r.views = (r.views || 0) + 1; r.visited = r.visited || Date.now(); r.lastSeen = Date.now();

  /* ---------- Questions & quizzes ---------- */
  function recordAnswer(q, correct) {

  function studySeconds() { var t = 0, d = st().days; Object.keys(d).forEach(function (k) { t += d[k]; }); return t; }

  }

  /* ---------- Achievements ---------- */

    { id: 'first-topic', title: 'First topic completed', test: function (o) { return o.done >= 1; } },
    { id: 'ten-topics', title: '10 topics completed', test: function (o) { return o.done >= 10; } },
    { id: 'fifty-topics', title: '50 topics completed', test: function (o) { return o.done >= 50; } },
    { id: 'first-chapter', title: 'First chapter completed', test: function (o) { return o.chaptersDone >= 1; } },
    { id: 'all-visited', title: 'All 18 chapters visited', test: function (o) { return o.chaptersVisited >= 18; } },
    { id: 'part-complete', title: 'A full Part completed', test: function () { return CI.parts.some(function (p) { return partProgress(p.id).pct === 100; }); } },
    { id: 'first-quiz', title: 'First quiz passed (≥ 60%)', test: function () { return st().attempts.some(function (a) { return a.total >= 3 && a.score / a.total >= 0.6; }); } },

/* Deterministic spaced-review scheduler (SM-2 style) for flashcards.
   Grades: 0 Again, 1 Hard, 2 Good, 3 Easy. No server or randomness involved. */
(function () {
  var IFL = window.IFL, S = IFL.store;
  var MIN = 60 * 1000, DAY = 24 * 60 * MIN;

  function next(card, grade, now) {
    now = now || Date.now();

    if (grade === 0) {
      c.lapses = (c.lapses || 0) + 1; c.reps = 0; c.interval = 0; c.ease = Math.max(1.3, c.ease - 0.2);
      c.due = now + 10 * MIN;
    } else if (grade === 1) {
      c.interval = Math.max(1, Math.round((c.interval || 1) * 1.2)); c.ease = Math.max(1.3, c.ease - 0.15); c.reps++;
      c.due = now + c.interval * DAY;
    } else if (grade === 2) {
      c.interval = c.reps === 0 ? 1 : c.reps === 1 ? 3 : Math.round(c.interval * c.ease); c.reps++;
      c.due = now + c.interval * DAY;
    } else {
      c.interval = c.reps === 0 ? 4 : Math.round(Math.max(c.interval, 1) * c.ease * 1.3); c.ease = c.ease + 0.15; c.reps++;
      c.due = now + c.interval * DAY;
    }
    c.last = now; c.grade = grade;
    /* guard rails: no NaN / negative / impossible values can ever be stored */
    var due = c.due, safe = IFL.migrate.cleanCard(c);
    safe.due = isFinite(due) && due >= 0 ? due : now;
    return safe;
  }
  function label(card, grade) {
    var n = next(card, grade, 0);
    if (grade === 0) return '10 min';
    return n.interval + (n.interval === 1 ? ' day' : ' days');
  }
  function grade(id, g) {
    S.update(function (s) {
      s.cards[id] = next(s.cards[id], g);
      s.reviews.push({ ts: Date.now(), card: id, grade: g });
      if (s.reviews.length > 3000) s.reviews.splice(0, s.reviews.length - 3000);
    }, 'review');
    IFL.progress.checkAchievements();
  }
  function status(id) {
    var c = S.state.cards[id];
    if (!c || !isFinite(c.due)) return 'new';
    if (c.due <= Date.now()) return 'due';
    if (c.lapses >= 2 || c.ease < 2) return 'difficult';
    return 'scheduled';
  }
  function dueCount() {
    var now = Date.now(), n = 0, cards = S.state.cards;
    Object.keys(cards).forEach(function (k) { if (cards[k].due <= now && IFL.data.flashcard(k)) n++; });
    return n;
  }

      var s = st[c.id]; if (!s) return 1e12 + (c._i || 0);
      if (s.due <= now) return s.due;
      return 2e12 + s.due;
    }
    return cards.map(function (c, i) { c._i = i; return c; }).sort(function (a, b) { return rank(a) - rank(b); });
  }
  IFL.srs = { next: next, label: label, grade: grade, status: status, dueCount: dueCount, order: order };
})();

<script data-src="modules/router.js">

/* Hash router: #/path/segments?query. Views register with IFL.route(pattern, handler). */
(function () {
  var IFL = window.IFL, u = IFL.u;
  var routes = [];
  IFL.route = function (pattern, handler, opts) {
    var keys = [];
    var re = new RegExp('^' + pattern.replace(/\//g, '\\/').replace(/:(\w+)/g, function (_, k) { keys.push(k); return '([^/?]+)'; }) + '$');
    routes.push({ re: re, keys: keys, handler: handler, opts: opts || {} });
  };
  function parse() {
    var raw = (location.hash || '#/').slice(1) || '/';
    var qi = raw.indexOf('?');
    var path = qi > -1 ? raw.slice(0, qi) : raw;
    var query = {};
    if (qi > -1) raw.slice(qi + 1).split('&').forEach(function (p) { if (!p) return; var kv = p.split('='); query[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' ')); });
    return { path: path, query: query, raw: raw };
  }
  var token = 0, cleanup = null;
  function render() {
    var r = parse(), view = document.getElementById('view');
    var match = null, params = {};
    for (var i = 0; i < routes.length; i++) {
      var m = routes[i].re.exec(r.path);
      if (m) { match = routes[i]; match.keys.forEach(function (k, j) { params[k] = decodeURIComponent(m[j + 1]); }); break; }
    }
    if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } cleanup = null; }
    IFL.keys = null;
    var my = ++token;
    view.className = 'view' + (match && match.opts.wide ? ' wide' : '');
    IFL.nav && IFL.nav.highlight(r.path);
    if (!match) { view.innerHTML = ''; view.appendChild(notFound(r.path)); return; }
    var ctx = {
      params: params, query: r.query, path: r.path,
      alive: function () { return my === token; },
      onLeave: function (fn) { cleanup = fn; }
    };
    view.innerHTML = '';
    view.appendChild(u.h('div.loading', { role: 'status' }, u.h('span.spinner'), 'Loading…'));
    Promise.resolve().then(function () { return match.handler(ctx); }).then(function (node) {
      if (!ctx.alive()) return;
      view.innerHTML = '';
      if (node) view.appendChild(node);
      if (!ctx.query._keepScroll) window.scrollTo(0, 0);
      var h1 = view.querySelector('h1');
      document.title = (h1 ? h1.textContent + ' — ' : '') + 'Islamic Finance MBA Learning System';
      if (IFL.afterRender) IFL.afterRender(ctx);
    }).catch(function (err) {
      console.error(err);
      if (!ctx.alive()) return;
      view.innerHTML = '';
      view.appendChild(u.h('div.card', u.h('h2', 'Something went wrong'), u.h('p.text-2', 'This page could not be displayed. ' + (err && err.message ? '(' + err.message + ')' : '')), u.h('p', u.h('a.btn', { href: '#/' }, 'Back to dashboard'))));
    });
  }
  function notFound(path) {
    return u.h('div.card.empty', u.h('h2', 'Page not found'), u.h('p', 'There is no page at ' + path + '.'), u.h('a.btn.primary', { href: '#/' }, 'Go to dashboard'));
  }
  IFL.go = function (path) { if (('#' + path) === location.hash) render(); else location.hash = path; };
  IFL.refresh = render;
  IFL.startRouter = function () { window.addEventListener('hashchange', render); render(); };
})();


</script>

      inputs: [{ k: 'cash', label: 'Cost to the bank / cash price', v: 100000 }, { k: 'markup', label: 'Agreed mark-up (%)', v: 12 }, { k: 'months', label: 'Number of monthly instalments', v: 12 }, { k: 'late', label: 'Months paid late (for illustration)', v: 2 }, { k: 'contract', label: 'Contract', type: 'select', options: ['Murabaha (cost and profit disclosed)', 'Musawamah (only the price is disclosed)'], v: 'Murabaha (cost and profit disclosed)' }],

    'pool-weightage': {
      title: 'Mudarabah deposit pool — weightages', source: 'Box 8.1',
      inputs: [{ k: 'd1', label: '3-month deposits', v: 3000 }, { k: 'w1', label: 'Weightage', v: 0.6, step: 0.05 }, { k: 'd2', label: '6-month deposits', v: 4000 }, { k: 'w2', label: 'Weightage', v: 0.7, step: 0.05 }, { k: 'd3', label: '1-year deposits', v: 3000 }, { k: 'w3', label: 'Weightage', v: 1, step: 0.05 }, { k: 'profit', label: 'Pool profit (negative = loss)', v: 1000 }, { k: 'mudarib', label: 'Bank\'s Mudarib share (%)', v: 50 }],
      textbook: { d1: 3000, w1: 0.6, d2: 4000, w2: 0.7, d3: 3000, w3: 1, profit: 1000, mudarib: 50 },
      compute: function (v) {
        var D = [v.d1, v.d2, v.d3], W = [v.w1, v.w2, v.w3], tot = D[0] + D[1] + D[2];
        if (v.profit < 0) {
          var sh = D.map(function (d) { return r2(v.profit * d / tot); });
          return { formula: 'Loss share = loss × deposit ÷ total deposits (weightages do not apply)', steps: ['Total deposits ' + n(tot) + '.', 'Shares: ' + sh.map(n).join(', ') + '.', 'The bank as Mudarib earns nothing in a loss period.'], result: 'Loss split ' + sh.map(n).join(' / '), meaning: 'Losses follow capital, not weightages.' };
        }
        var bank = v.profit * v.mudarib / 100, pool = v.profit - bank;
        var wa = D.map(function (d, i) { return d * W[i]; }), wt = wa[0] + wa[1] + wa[2];
        var pr = wa.map(function (x) { return x / wt * pool; });
        return { formula: 'Tier profit = pool share × (deposit × weightage) ÷ Σ(deposit × weightage)',
          steps: ['Bank (Mudarib) = ' + n(v.profit) + ' × ' + v.mudarib + '% = ' + n(bank) + '; pool = ' + n(pool) + '.', 'Weighted amounts: ' + wa.map(n).join(', ') + ' (total ' + n(wt) + ').', 'Tier profits: ' + pr.map(function (x) { return n(x, 0); }).join(', ') + '.', 'Monthly rates: ' + pr.map(function (x, i) { return D[i] ? (100 * x / D[i]).toFixed(2) + '%' : '—'; }).join(', ') + '.'],
          result: 'Profit ' + pr.map(function (x) { return n(x, 0); }).join(' / '), meaning: 'Longer tenors receive higher weightages in profit; the textbook figures give 119, 184 and 197.' };
      }
    },
    'salam-discount': {
      title: 'Salam price discount and implied return', source: 'Sections 10.2–10.3 and 10.10 (practice calculator)', topic: 't10.3',
      assumptions: 'The buyer pays the whole price now; the goods are worth the expected spot price at delivery; simple (non-compounded) annualisation.',
      inputs: [{ k: 'qty', label: 'Quantity (tons)', v: 100 }, { k: 'months', label: 'Delivery period (months)', v: 6 }, { k: 'price', label: 'Salam price per ton (paid today)', v: 180 }, { k: 'spot', label: 'Expected spot price per ton at delivery', v: 200 }],

          result: 'Capital ' + n(cap) + ' · discount ' + n(disc) + ' (' + n(pct, 2) + '%)',

    'musharakah-pl': {
      title: 'Musharakah profit and loss sharing (with the sleeping-partner rule)', source: 'Section 12.3.4 and Box 12.1, rule 4 (practice calculator)', topic: 't12.3.4',

        { k: 'sa', label: 'Is A declared a sleeping partner?', type: 'select', options: ['No — A may work', 'Yes — A is sleeping'], v: 'No — A may work' }, { k: 'sb', label: 'Is B declared a sleeping partner?', type: 'select', options: ['No — B may work', 'Yes — B is sleeping'], v: 'No — B may work' }],
      textbook: null,
      compute: function (v) {

        if (sb && pb > kb + 1e-9) { issues.push('B is a declared sleeping partner but was given ' + pb.toFixed(1) + '% of profit against ' + kb.toFixed(1) + '% of capital — capped at ' + kb.toFixed(1) + '%.'); pb = kb; pa = 100 - pb; }
        if (sa && sb) issues.push('Both partners are declared sleeping: someone must manage the business (or a manager must be appointed).');

        var ok0 = v.line === 'Permissible business', ok1 = v.ii <= 5, lo = v.debt <= 10, hi = v.debt <= 33, ilo = v.illiq >= 33, ihi = v.illiq >= 10;
        var pass = ok0 && ok1 && hi && ihi, charity = v.div * Math.min(100, Math.max(0, v.ii)) / 100;
        return { formula: 'Business must be lawful; interest income ≤ 5 %; debt ratio ≤ 10–33 %; illiquid assets ≥ 10–33 % of total assets',
          steps: ['Business line: ' + (ok0 ? 'passes' : 'fails — prohibited activity') + '.', 'Interest income ' + v.ii + ' %: ' + (ok1 ? 'within 5 %' : 'above 5 % — fails') + '.',
            'Debt ' + v.debt + ' %: ' + (lo ? 'passes even the strict 10 % limit' : hi ? 'passes the 33 % limit only' : 'fails both limits') + '.',
            'Illiquid assets ' + v.illiq + ' %: ' + (ilo ? 'meets even the 33 % floor' : ihi ? 'meets the 10 % floor only' : 'below both floors') + '.',
            'Purification (approximate): the interest-related share of income goes to charity — at ' + v.ii + ' % of a ' + n(v.div) + ' dividend that is about ' + n(charity) + '.'],
          result: pass ? (lo && ilo ? 'Passes on strict and lenient thresholds' : 'Passes only on the lenient thresholds') : 'Does not pass the screen',
          meaning: 'The book gives ranges (10–33 %) because boards differ; your bank’s Shari’ah board sets the exact limits (pp. 363–364). Inputs are practice figures.' };
      }
    },
    'floating-rent': {
      title: 'Floating Ijarah rent with floor and cap', source: 'Sections 11.3.2 and 14.3.4 (practice calculator)', topic: 't11.3.2',
      inputs: [{ k: 'inv', label: 'Bank’s outstanding investment', v: 1000000 }, { k: 'r1', label: 'First-period rate (fixed in contract, %)', v: 8 }, { k: 'spread', label: 'Spread over benchmark (%)', v: 2 }, { k: 'floor', label: 'Floor (%)', v: 6 }, { k: 'cap', label: 'Cap (%)', v: 12 },
        { k: 'b2', label: 'Benchmark, period 2 (%)', v: 7 }, { k: 'b3', label: 'Benchmark, period 3 (%)', v: 11 }, { k: 'b4', label: 'Benchmark, period 4 (%)', v: 3 }],
      textbook: null,
      compute: function (v) {

        });

          steps: ['Each period’s rent is agreed in absolute terms before that period starts.', 'Rent already accrued is never re-priced.'],
          table: { head: ['Period', 'Rate basis', 'Rate', 'Annual rent'], rows: rows },
          result: 'Rents stay between ' + v.floor + ' % and ' + v.cap + ' % of the investment', meaning: 'A floor and cap limit Gharar for both parties; the benchmark only prices the rent, while the lessor still bears ownership risk (pp. 283–284, 366).' };

      textbook: null,

    'tawarruq-check': {

        { k: 'resale', label: 'To whom does the client resell?', type: 'select', options: ['An unrelated third party', 'Back to the bank, directly or via an agent'], v: 'An unrelated third party' },
        { k: 'agency', label: 'Does the bank act as the client’s selling agent?', type: 'select', options: ['No', 'Yes — stipulated in the sale contract', 'Yes — arranged after an unconditional sale'], v: 'No' },
        { k: 'goods', label: 'Do the goods actually change hands?', type: 'select', options: ['Yes — ownership and possession pass', 'No — only papers between brokers'], v: 'Yes — ownership and possession pass' },
        { k: 'use', label: 'Purpose', type: 'select', options: ['Unavoidable corporate liquidity need', 'Consumer cash finance'], v: 'Unavoidable corporate liquidity need' }],

      }
    },
    'murabaha-check': {
      title: 'Murabaha compliance checker', source: 'Sections 9.8.3 and 14.3.4', topic: 't9.8.3',

        { k: 'own', label: 'Does the bank own and possess the goods (bear their risk) before selling?', type: 'select', options: ['Yes', 'No'], v: 'Yes' },
        { k: 'client', label: 'Had the client already bought or committed to buy the goods?', type: 'select', options: ['No', 'Yes'], v: 'No' },
        { k: 'supplier', label: 'Is the supplier more than 50 % owned by the client?', type: 'select', options: ['No', 'Yes'], v: 'No' },
        { k: 'cost', label: 'Is the cost disclosed to the client?', type: 'select', options: ['Yes', 'No'], v: 'Yes' },
        { k: 'from', label: 'Mark-up charged from', type: 'select', options: ['Date of sale to the client', 'Date funds were disbursed'], v: 'Date of sale to the client' },

<script data-src="modules/viz.js">
/* Small chart kit for the calculators: a part-to-whole bar, labelled bars and a line chart.
   Marks carry identity by position, label and legend — never by colour alone; values are always
   printed as text beside the marks, so every chart is readable without hovering. */
(function () {
  var IFL = window.IFL, u = IFL.u, h = u.h;
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, text) { var e = document.createElementNS(NS, tag); Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); }); if (text != null) e.textContent = text; return e; }
  function fmt(x, d) { var v = Number(x); if (!isFinite(v)) v = 0; return v.toLocaleString(undefined, { maximumFractionDigits: d == null ? (Math.abs(v) < 100 ? 2 : 0) : d }); }

  /* Part-to-whole: one bar split into up to four labelled parts. Negative or zero parts are listed but not drawn. */
  function split(spec) {

      parts.map(function (p, i) { return p.value > 0 && total ? h('span.s' + (i + 1), { style: { width: (100 * p.value / total) + '%' }, title: p.label + ': ' + fmt(p.value) + ' (' + fmt(100 * p.value / total, 1) + '%)' }) : null; }));
    var keys = h('div.viz-legend', parts.map(function (p, i) {
      return h('span.viz-key', h('i.viz-sw.s' + (i + 1)), p.label, h('strong.tabular', ' ' + fmt(p.value)), total && p.value > 0 ? h('span.muted', ' · ' + fmt(100 * p.value / total, 1) + '%') : null);
    }));

  }

  /* Labelled horizontal bars around a zero line (handles losses). */

    var max = 0, min = 0; spec.items.forEach(function (it) { max = Math.max(max, it.value); min = Math.min(min, it.value); });
    var span = (max - min) || 1, zero = 100 * (-min) / span;
    var rows = spec.items.map(function (it) {
      var w = 100 * Math.abs(it.value) / span, left = it.value >= 0 ? zero : zero - w;
      return h('div.viz-row', h('span.viz-lbl', it.label),
        h('span.viz-track', { title: it.label + ': ' + fmt(it.value) }, h('span.viz-zero', { style: { left: zero + '%' } }), h('span.viz-bar' + (it.value < 0 ? '.neg' : '') + (it.tone ? '.' + it.tone : ''), { style: { left: left + '%', width: Math.max(w, it.value ? 0.6 : 0) + '%' } })),
        h('span.viz-val.tabular', (it.value < 0 ? '−' : '') + fmt(Math.abs(it.value)) + (spec.unit || '')));
    });
    return h('figure.viz', h('figcaption', spec.title), h('div.viz-bars', { role: 'img', 'aria-label': spec.title + ': ' + spec.items.map(function (it) { return it.label + ' ' + fmt(it.value); }).join(', ') }, rows), spec.note ? h('p.small.muted', spec.note) : null);
  }

  /* Line chart with a hover/keyboard read-out. One y-axis; up to three series. */
  function line(spec) {
    var W = 640, H = 220, L = 54, R = 14, T = 12, B = 30, n = spec.x.length;
    var max = 0, min = 0; spec.series.forEach(function (s) { s.values.forEach(function (v) { if (isFinite(v)) { max = Math.max(max, v); min = Math.min(min, v); } }); });
    if (max === min) max = min + 1;
    var pad = (max - min) * 0.08; max += pad;
    function X(i) { return L + (n > 1 ? i / (n - 1) : 0.5) * (W - L - R); }
    function Y(v) { return T + (1 - (v - min) / (max - min)) * (H - T - B); }
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart-svg viz-line', role: 'img', 'aria-label': spec.title + '. ' + spec.series.map(function (s) { return s.name + ' from ' + fmt(s.values[0]) + ' to ' + fmt(s.values[n - 1]); }).join('; ') });

      var val = min + (max - min) * g / 4, y = Y(val);
      svg.appendChild(el('line', { x1: L, x2: W - R, y1: y, y2: y, class: 'viz-grid' }));
      svg.appendChild(el('text', { x: L - 8, y: y + 4, 'text-anchor': 'end', class: 'viz-tick' }, fmt(val, max - min < 20 ? 1 : 0) + (spec.unit || '')));
    }
    var ticks = n <= 8 ? spec.x.map(function (_, i) { return i; }) : [0, Math.round((n - 1) / 4), Math.round((n - 1) / 2), Math.round(3 * (n - 1) / 4), n - 1];
    ticks.forEach(function (i) { svg.appendChild(el('text', { x: X(i), y: H - 8, 'text-anchor': 'middle', class: 'viz-tick' }, String(spec.x[i]))); });

            : ['A loss is always shared by capital, whatever the profit ratio.', 'A = ' + f(p.res) + ' × ' + f(p.ca) + ' ÷ ' + f(t) + ' = ' + f(a) + '.', 'B = ' + f(p.res - a) + '.'] };
      } },
    { id: 'dm-housing', cat: 'Consumer finance', title: 'Diminishing Musharakah home finance', product: 'home-dm', topic: 't12.9.2', source: 'Box 12.5',
      book: { cost: 1000000, share: 80, months: 120, rate: 7 },
      rand: function (r) { return { cost: rnd(r, 20, 120) * 100000, share: rnd(r, 50, 85, 5), months: [60, 84, 120, 180][rnd(r, 0, 3)], rate: rnd(r, 60, 140, 5) / 10 }; },
      solve: function (p) {

        return { given: [['House price', f(p.cost)], ['Bank’s share', p.share + ' %'], ['Units (monthly)', p.months], ['Rent rate on the bank’s outstanding share', p.rate + ' % p.a.']],
          asks: [{ label: 'Unit price', v: unit, dp: 2 }, { label: 'Month 1 rent', v: r1, dp: 2 }, { label: 'Month 1 total payment', v: unit + r1, dp: 2 }, { label: 'Month 2 total payment', v: unit + r2v, dp: 2 }],
          steps: ['Bank investment = ' + f(p.cost) + ' × ' + p.share + ' % = ' + f(inv) + '.', 'Unit price = ' + f(inv) + ' ÷ ' + p.months + ' = ' + f(unit, 2) + '.', 'Month 1 rent = ' + f(inv) + ' × ' + p.rate + ' % ÷ 12 = ' + f(r1, 2) + '; payment = ' + f(unit + r1, 2) + '.', 'Month 2: outstanding ' + f(inv - unit, 2) + ' → rent ' + f(r2v, 2) + '; payment ' + f(unit + r2v, 2) + '. Rent falls as the client buys units.'] };
      } },
    { id: 'salam-margin', cat: 'Trade & working capital', title: 'Salam with a promise to buy', product: 'salam-agri', topic: 't10.10', source: 'Box 10.4',
      book: { salam: 100, promise: 115, hj: 15, market: 108 }, bookNote: 'Salam price, promised price and Hamish Jiddiyah are the book’s; the market price on default is a practice extension.',
      rand: function (r) { var s = rnd(r, 20, 200, 5); return { salam: s, promise: s + rnd(r, 5, 25), hj: rnd(r, 3, 20), market: s + rnd(r, -5, 20) }; },
      solve: function (p) {
        var loss = Math.max(0, p.promise - p.market), take = Math.min(loss, p.hj);
        return { given: [['Salam price paid in advance (Rs m)', f(p.salam)], ['Third party’s promised purchase price (Rs m)', f(p.promise)], ['Hamish Jiddiyah (Rs m)', f(p.hj)], ['Market price if the promisor refuses (Rs m)', f(p.market)]],
          asks: [{ label: 'Gross margin if the promise is kept', v: p.promise - p.salam }, { label: 'Amount taken from Hamish Jiddiyah on refusal', v: take }, { label: 'Bank’s result on refusal (market − Salam price + HJ taken)', v: p.market - p.salam + take }],
          steps: ['Margin = ' + f(p.promise) + ' − ' + f(p.salam) + ' = ' + f(p.promise - p.salam) + '.', 'On refusal the actual loss against the promise = ' + f(p.promise) + ' − ' + f(p.market) + ' = ' + f(loss) + '; take ' + f(take) + ' from the HJ and refund ' + f(p.hj - take) + '.', 'Result = sale ' + f(p.market) + ' − cost ' + f(p.salam) + ' + ' + f(take) + ' = ' + f(p.market - p.salam + take) + '. The bank bears delivery and price risk until it sells.'] };
      } },
    { id: 'salam-agent', cat: 'Trade & working capital', title: 'Salam goods sold through an agent', product: 'salam-working-capital', topic: 't10.10', source: 'Box 10.7',
      book: { price: 19, target: 20, sold: 18, kg: 100000 }, bookNote: 'Prices per kg are the book’s; the quantity is added for practice.',
      rand: function (r) { var p = rnd(r, 30, 90); return { price: p, target: p + rnd(r, 1, 5), sold: p + rnd(r, -4, 7), kg: rnd(r, 1, 20) * 10000 }; },
      solve: function (p) {
        var res = (p.sold - p.price) * p.kg;
        return { given: [['Salam price per kg', 'Rs.' + p.price], ['Bank’s target sale price per kg', 'Rs.' + p.target], ['Price the agent actually obtained per kg', 'Rs.' + p.sold], ['Quantity', f(p.kg) + ' kg']],
          asks: [{ label: 'Target margin per kg', v: p.target - p.price }, { label: 'Bank’s actual result on the lot (loss negative)', v: res }],
          steps: ['Target margin = ' + p.target + ' − ' + p.price + ' = Rs.' + (p.target - p.price) + ' per kg.', 'Actual = (' + p.sold + ' − ' + p.price + ') × ' + f(p.kg) + ' = ' + f(res) + '.', p.sold > p.target ? 'Above target: the excess may be given to the agent as an incentive if so agreed.' : p.sold < p.price ? 'Below cost: the bank bears the loss; the agent does not guarantee the price.' : 'The bank keeps the result; the agent does not guarantee any price.'] };
      } },
    { id: 'parallel-istisna', cat: 'Corporate & project', title: 'Istisna‘a and Parallel Istisna‘a', product: 'project-istisna', topic: 't10.11.7', source: 'Box 10.16',
      book: { sale: 1200, years: 10, cost: 1000, inst: 4 },
      rand: function (r) { var c = rnd(r, 20, 200) * 10; return { sale: c + rnd(r, 5, 40) * 10, years: rnd(r, 3, 12), cost: c, inst: rnd(r, 2, 6) }; },
      solve: function (p) {
        return { given: [['Istisna‘a price agreed with the customer (Rs m)', f(p.sale)], ['Customer pays over (years, equal annual amounts)', p.years], ['Parallel Istisna‘a price with the contractor (Rs m)', f(p.cost)], ['Equal instalments to the contractor', p.inst]],
          asks: [{ label: 'Bank’s gross margin', v: p.sale - p.cost }, { label: 'Customer’s annual payment', v: p.sale / p.years, dp: 2 }, { label: 'Each contractor instalment', v: p.cost / p.inst, dp: 2 }],
          steps: ['Margin = ' + f(p.sale) + ' − ' + f(p.cost) + ' = ' + f(p.sale - p.cost) + '.', 'Customer: ' + f(p.sale) + ' ÷ ' + p.years + ' = ' + f(p.sale / p.years, 2) + ' a year.', 'Contractor: ' + f(p.cost) + ' ÷ ' + p.inst + ' = ' + f(p.cost / p.inst, 2) + ' each.', 'The two contracts are independent: the bank stays liable to the customer even if the contractor fails.'] };
      } },
    { id: 'ijarah-loss', cat: 'Consumer finance', title: 'Leased car destroyed: settlement with Takaful', product: 'auto-ijarah', topic: 't11.4.5', source: 'Box 11.3 (Answer 4)',
      book: { out: 370000, claim: 450000, dep: 50000 },
      rand: function (r) { var o = rnd(r, 20, 90) * 10000; return { out: o, claim: o + rnd(r, -10, 15) * 10000, dep: rnd(r, 2, 10) * 10000 }; },
      solve: function (p) {
        var surplus = Math.max(0, p.claim - p.out);

          asks: [{ label: 'Amount returned to the client', v: p.dep + surplus }, { label: 'Shortfall borne by the bank (0 if none)', v: Math.max(0, p.out - p.claim) }],
          steps: ['The asset is destroyed without negligence: the lease ends, rent stops, and the loss is the owner’s.', 'Refund the deposit: ' + f(p.dep) + '.', surplus ? 'Pass the Takaful surplus (' + f(p.claim) + ' − ' + f(p.out) + ' = ' + f(surplus) + ') to the client, as AAOIFI 8/8 recommends.' : 'No surplus; the bank bears the shortfall of ' + f(p.out - p.claim) + ' as owner.', 'Client receives ' + f(p.dep + surplus) + '.'] };
      } },
    { id: 'ijarah-early', cat: 'Corporate & project', title: 'Early purchase of leased assets', product: 'corporate-ijarah', topic: 't11.4.5', source: 'Box 11.3 (Answer 3)',
      book: { n: 10, offer: 400000, out: 350000, pre: 20000 },
      rand: function (r) { var o = rnd(r, 20, 90) * 10000; return { n: rnd(r, 2, 20), offer: o + rnd(r, -2, 10) * 10000, out: o, pre: rnd(r, 1, 5) * 10000 }; },
      solve: function (p) {

          asks: [{ label: 'Total liabilities to recover', v: liab }, { label: 'Bank’s gain on the sale (loss negative)', v: off - liab }],
          steps: ['Liabilities = (' + f(p.out) + ' + ' + f(p.pre) + ') × ' + p.n + ' = ' + f(liab) + '.', 'Offer = ' + f(p.offer) + ' × ' + p.n + ' = ' + f(off) + '.', 'Gain = ' + f(off - liab) + (off >= liab ? ': the offer covers the bank’s liabilities.' : ': the offer does not cover them; the bank may negotiate, since sale is by mutual consent.')] };
      } },
    { id: 'sukuk-rent', cat: 'Treasury & capital markets', title: 'Floating rent on Ijarah Sukuk', product: 'ijarah-sukuk', topic: 't15.3.6', source: 'Box 15.6',
      book: { size: 600, spread: 220, bench: 4.8 }, bookNote: 'Issue size and the 220 bps spread are the book’s; the benchmark rate is a practice assumption.',

          steps: ['Rate = ' + p.bench.toFixed(2) + ' % + ' + (p.spread / 100).toFixed(2) + ' % = ' + rate.toFixed(2) + ' %.', 'Half-year rent = ' + f(p.size) + ' × ' + rate.toFixed(2) + ' % ÷ 2 = ' + f(half, 2) + '.', 'The benchmark only prices the rent; holders own the leased asset and bear its ownership risk.'] };
      } },
    { id: 'takaful-result', cat: 'Services & Takaful', title: 'Wakalah–Waqf Takaful year-end result', product: 'takaful', topic: 't16.4', source: 'Box 16.1 method (practice figures)',
      book: null,
      rand: function (r) { return { con: rnd(r, 10, 60), fee: rnd(r, 15, 35, 5), claims: rnd(r, 3, 30), inv: rnd(r, 1, 6), mud: rnd(r, 20, 50, 10) }; },
      solve: function (p) {
        var fee = p.con * p.fee / 100, uw = p.con - fee - p.claims, op = p.inv * p.mud / 100;

          asks: [{ label: 'Underwriting surplus (deficit negative)', v: uw, dp: 2 }, { label: 'Operator’s total income', v: fee + op, dp: 2 }],
          steps: ['Fee = ' + f(p.con) + ' × ' + p.fee + ' % = ' + f(fee, 2) + '.', 'Underwriting = ' + f(p.con) + ' − ' + f(fee, 2) + ' − ' + f(p.claims) + ' = ' + f(uw, 2) + (uw < 0 ? ': a deficit, met by a Qard al Hasan from the operator.' : ': a surplus, which belongs to the participants’ fund.'), 'Operator’s share of investment profit = ' + f(op, 2) + '; income = ' + f(fee + op, 2) + '.'] };
      } },
    { id: 'iers-excess', cat: 'Treasury & capital markets', title: 'IERS: SBP’s excess profit', product: 'iers', topic: 't14.4.6', source: 'Section 14.4.6 (practice figures)',
      book: null,
      rand: function (r) { var e = rnd(r, 5, 9); return { inv: rnd(r, 5, 40) * 100, share: e + rnd(r, 1, 4), efs: e }; },

          steps: ['Profit = ' + f(p.inv) + ' × ' + p.share + ' % = ' + f(a) + '.', 'At the EFS rate = ' + f(b) + '.', 'Excess ' + f(a - b) + ' goes to the Takaful fund.'] };

    { id: 'jualah-reward', cat: 'Services & Takaful', title: 'Ju‘alah reward for debt recovery', product: 'jualah-services', topic: 't13.4.2', source: 'Section 13.4 (practice figures)',
      book: null,

      } }    ,
    /* ---- Round 5: further products ---- */
    { id: 'tractor-ijarah', cat: 'Agriculture', title: 'Tractor on Ijarah with harvest-season rents', product: 'farm-machinery-ijarah', topic: 't11.5', source: 'Box 8.2 and Section 11.5 (practice figures)',
      book: null,

        return { given: [['Tractor cost (owned by the bank)', f(p.cost)], ['Tenor', p.years + ' years, rent after each of two harvests a year'], ['Rent basis', 'Capital recovery + ' + p.rate + ' % p.a. on the outstanding amount']],
          asks: [{ label: 'Capital recovered per half-year', v: cap, dp: 2 }, { label: 'First rent', v: r1, dp: 2 }, { label: 'Second rent', v: r2v, dp: 2 }, { label: 'Last rent', v: last, dp: 2 }],

      } },
    { id: 'mii-return', cat: 'Treasury & capital markets', title: 'Mudarabah interbank investment (MII) return', product: 'interbank-mudarabah', topic: 't8.8.5', source: 'Section 8.8.5 (practice figures)',
      book: null,
      rand: function (r) { return { amt: rnd(r, 5, 50) * 10000000, days: [1, 7, 30, 90, 180][rnd(r, 0, 4)], rate: rnd(r, 40, 90, 5) / 10, psr: rnd(r, 50, 85, 5) }; },

        return { given: [['Amount placed', f(p.amt)], ['Tenor (days)', p.days], ['Investee bank’s gross profit rate on 1-year investments', p.rate + ' % p.a.'], ['Profit-sharing ratio (investor : investee)', p.psr + ' : ' + (100 - p.psr)]],
          asks: [{ label: 'Gross profit attributable to the placement', v: gross }, { label: 'Investor bank’s profit', v: inv }, { label: 'Effective return to the investor (% p.a.)', v: p.rate * p.psr / 100, dp: 2 }],
          steps: ['Gross = ' + f(p.amt) + ' × ' + p.rate + ' % × ' + p.days + '/365 = ' + f(gross) + '.', 'Investor = ' + f(gross) + ' × ' + p.psr + ' % = ' + f(inv) + '.', 'Effective rate = ' + p.rate + ' % × ' + p.psr + ' % = ' + (p.rate * p.psr / 100).toFixed(2) + ' % — known only once the investee’s profit rate is crystallised at the end.'] };
      } },
    { id: 'tawarruq-cost', cat: 'Consumer finance', title: 'Cost of cash through Tawarruq', product: 'personal-tawarruq', topic: 't13.3', source: 'Section 13.3 (practice figures)',
      book: null,
      rand: function (r) { var c = rnd(r, 5, 50) * 10000; return { cost: c, mk: rnd(r, 6, 18), spot: rnd(r, 97, 100) / 100, months: [6, 12, 24][rnd(r, 0, 2)] }; },
      solve: function (p) {

      } },
    { id: 'dm-construction', cat: 'Consumer finance', title: 'House on the customer’s land (sale and lease-back DM)', product: 'house-construction-dm', topic: 't12.9.2', source: 'Box 12.4',
      book: { land: 1000000, fin: 800000, inst: 4, unit: 100000, rate: 0 },
      rand: function (r) { var u = rnd(r, 5, 20) * 10000; return { land: u * 10, fin: u * rnd(r, 5, 9), inst: rnd(r, 2, 6), unit: u, rate: 0 }; },
      solve: function (p) {

          asks: [{ label: 'Units the bank buys', v: units }, { label: 'Bank’s ownership share (%)', v: 100 * p.fin / p.land, dp: 1 }, { label: 'Each disbursement', v: p.fin / p.inst }],
          steps: ['The bank buys ' + f(p.fin) + ' ÷ ' + f(p.unit) + ' = ' + units + ' units: a sale and lease-back creating Shirkatulmilk.', 'Ownership: bank ' + (100 * p.fin / p.land).toFixed(1) + ' %, client ' + (100 - 100 * p.fin / p.land).toFixed(1) + ' %.', 'Each instalment = ' + f(p.fin) + ' ÷ ' + p.inst + ' = ' + f(p.fin / p.inst) + ', used by the client to build.', 'Rent starts when the house is habitable; unit buy-back starts one year after the last instalment, to avoid ‘Inah.'] };
      } },
    { id: 'equity-screen', cat: 'Funds & investment banking', title: 'Screening a stock and purifying its dividend', product: 'equity-fund', topic: 't8.8.1', source: 'Section 8.8.1 (DJIM criteria; Al Meezan charity rate)',
      book: null,
      rand: function (r) { return { debt: rnd(r, 5, 45), cash: rnd(r, 5, 40), recv: rnd(r, 5, 45), nc: rnd(r, 0, 60) / 10, div: rnd(r, 2, 40) * 50000 }; },
      solve: function (p) {
        var fails = [p.debt, p.cash, p.recv].filter(function (x) { return x >= 33; }).length, charity = fails ? 0 : p.div * p.nc / 100;
        return { given: [['Debt ÷ 12-month average market cap', p.debt + ' %'], ['Cash + interest-bearing securities ÷ market cap', p.cash + ' %'], ['Receivables ÷ market cap', p.recv + ' %'], ['Non-compliant income ÷ gross revenue', p.nc + ' %'], ['Dividend received', f(p.div)]],
          asks: [{ label: 'Number of DJIM financial ratios failed', v: fails }, { label: 'Charity amount to set aside (0 if the stock is excluded)', v: charity }],
          steps: ['Each of the three ratios must be below 33 %: debt ' + p.debt + ' %, cash ' + p.cash + ' %, receivables ' + p.recv + ' % → ' + fails + ' fail(s).', fails ? 'The stock is excluded; no dividend is held, so nothing is purified.' : 'The stock passes; charity rate ' + p.nc + ' % × ' + f(p.div) + ' = ' + f(charity) + '.', 'Al Meezan’s tolerance for non-permissible income is 5 % of total income' + (p.nc > 5 ? '; at ' + p.nc + ' % this company would also fail that test.' : '.')] };
      } },
    { id: 'mixed-fund-floor', cat: 'Funds & investment banking', title: 'Mixed fund: tradability and minimum unit price', product: 'mixed-fund', topic: 't8.8.1', source: 'Sections 8.8.1 and 15.3.5 (practice figures)',
      book: null,
      rand: function (r) { return { tang: rnd(r, 20, 90) * 1000000, cash: rnd(r, 2, 30) * 1000000, recv: rnd(r, 2, 40) * 1000000, units: rnd(r, 5, 20) * 1000000 }; },
      solve: function (p) {
        var t = p.tang + p.cash + p.recv, pct = 100 * p.tang / t, floor = (p.cash + p.recv) / p.units;
        return { given: [['Shares, leased and other tangible assets', f(p.tang)], ['Cash', f(p.cash)], ['Receivables', f(p.recv)], ['Units in issue', f(p.units)]],
          asks: [{ label: 'Tangible assets as % of the fund', v: pct, dp: 1 }, { label: 'Tradable at market price? (1 = yes, 0 = no)', v: pct > 51 ? 1 : 0 }, { label: 'Price per unit must exceed (liquid + debts per unit)', v: floor, dp: 2 }],
          steps: ['Tangible share = ' + f(p.tang) + ' ÷ ' + f(t) + ' = ' + pct.toFixed(1) + ' %.', pct > 51 ? 'Above 51 %: units may trade at market price.' : 'Not above 51 %: cash and debts dominate, so Sarf and debt rules apply and the units cannot trade at a market price.', 'Price floor = (' + f(p.cash) + ' + ' + f(p.recv) + ') ÷ ' + f(p.units) + ' = ' + f(floor, 2) + ' per unit.'] };
      } },
    { id: 'idb-ijarah-share', cat: 'Sukuk', title: 'Mixed-portfolio Sukuk: keeping Ijarah above 50 %', product: 'mixed-portfolio-sukuk', topic: 't15.3.5.d', source: 'Section 15.3.5 (IDB Solidarity Trust thresholds; practice figures)',
      book: null,
      rand: function (r) { return { ij: rnd(r, 8, 30) * 10, mu: rnd(r, 5, 20) * 10, is: rnd(r, 0, 10) * 10 }; },
      solve: function (p) {
        var t = p.ij + p.mu + p.is, pct = 100 * p.ij / t, need = Math.max(0, t - 2 * p.ij);
        return { given: [['Ijarah assets (US$ m)', f(p.ij)], ['Murabaha receivables (US$ m)', f(p.mu)], ['Istisna‘a receivables (US$ m)', f(p.is)]],
          asks: [{ label: 'Ijarah share of the pool (%)', v: pct, dp: 1 }, { label: 'Extra Ijarah (US$ m) to add before the share exceeds 50 %', v: need }, { label: 'Dissolution event? (1 = yes, below 25 %)', v: pct < 25 ? 1 : 0 }],
          steps: ['Ijarah share = ' + f(p.ij) + ' ÷ ' + f(t) + ' = ' + pct.toFixed(1) + ' %.', need ? 'To reach 50 %: add x with (' + f(p.ij) + ' + x) ÷ (' + f(t) + ' + x) = 50 % → x = ' + f(t) + ' − 2 × ' + f(p.ij) + ' = ' + f(need) + '.' : 'Already at or above 50 %: no additional Ijarah needed.', pct < 25 ? 'Below 25 %: a dissolution event; IDB must buy the assets under its purchase undertaking.' : 'Not below 25 %, so there is no dissolution event.'] };
      } },
    { id: 'mudarabah-sukuk', cat: 'Sukuk', title: 'Mudarabah Sukuk distribution with a reserve', product: 'mudarabah-sukuk', topic: 't15.3.5', source: 'Section 15.3.5 (OIC Fiqh Council rules; practice figures)',
      book: null,
      rand: function (r) { var loss = r() < 0.25; return { size: rnd(r, 5, 30) * 100, res: (loss ? -1 : 1) * rnd(r, 2, 20) * 10, ratio: rnd(r, 60, 85, 5), rsv: rnd(r, 0, 10) }; },
      solve: function (p) {
        if (p.res < 0) return { given: [['Sukuk issued (Rs m)', f(p.size)], ['Project result (Rs m)', 'Loss ' + f(-p.res)], ['Profit ratio (holders : Mudarib)', p.ratio + ' : ' + (100 - p.ratio)], ['Reserve rate', p.rsv + ' % of profit']],
          asks: [{ label: 'Holders’ share of the result (loss negative)', v: p.res }, { label: 'Mudarib’s profit', v: 0 }],
          steps: ['There is no profit, so nothing goes to reserve or to the Mudarib.', 'The loss of ' + f(-p.res) + ' is borne by the holders as capital owners (reserves built in earlier years may absorb it).', 'The issuer cannot guarantee capital; only an unrelated third party may promise a donation.'] };
        var rv = p.res * p.rsv / 100, d = p.res - rv, hold = d * p.ratio / 100;
        return { given: [['Sukuk issued (Rs m)', f(p.size)], ['Project profit (Rs m)', f(p.res)], ['Profit ratio (holders : Mudarib)', p.ratio + ' : ' + (100 - p.ratio)], ['Reserve rate', p.rsv + ' % of profit']],
          asks: [{ label: 'Holders’ profit (Rs m)', v: hold, dp: 2 }, { label: 'Mudarib’s profit (Rs m)', v: d - hold, dp: 2 }],
          steps: ['Reserve = ' + f(p.res) + ' × ' + p.rsv + ' % = ' + f(rv, 2) + '; distributable = ' + f(d, 2) + '.', 'Holders = ' + f(d, 2) + ' × ' + p.ratio + ' % = ' + f(hold, 2) + ' (' + (100 * hold / p.size).toFixed(2) + ' % on the issue).', 'Mudarib = ' + f(d - hold, 2) + '.'] };
      } },
    { id: 'salam-sukuk', cat: 'Sukuk', title: 'Salam Sukuk: return on a short-term issue', product: 'salam-sukuk', topic: 't15.3.5.c', source: 'Section 15.3.5 (Bahrain structure; practice figures)',
      book: null,
      rand: function (r) { var s = rnd(r, 10, 100); return { price: s, sale: r2(s * (1 + rnd(r, 5, 30) / 1000)), months: [3, 6][rnd(r, 0, 1)] }; },
      solve: function (p) {
        var g = p.sale - p.price, ann = 100 * g / p.price * 12 / p.months;
        return { given: [['Salam price paid in advance (US$ m)', f(p.price)], ['Months to delivery', p.months], ['Agent’s sale price on delivery (US$ m)', f(p.sale, 2)]],
          asks: [{ label: 'Gross gain (US$ m)', v: g, dp: 2 }, { label: 'Annualised return (%)', v: ann, dp: 2 }],
          steps: ['Gain = ' + f(p.sale, 2) + ' − ' + f(p.price) + ' = ' + f(g, 2) + '.', 'Annualised = ' + f(g, 2) + ' ÷ ' + f(p.price) + ' × 12/' + p.months + ' = ' + ann.toFixed(2) + ' %.', 'The certificates represent a Salam debt, so they are not traded before delivery.'] };
      } },
    { id: 'murabaha-sukuk', cat: 'Sukuk', title: 'Murabaha Sukuk: instalment certificates', product: 'murabaha-sukuk', topic: 't15.3.5.c', source: 'Section 15.3.5 (practice figures)',
      book: null,
      rand: function (r) { return { cost: rnd(r, 10, 80) * 100, pct: rnd(r, 5, 25), n: rnd(r, 2, 8) }; },
      solve: function (p) {
        var price = p.cost * (1 + p.pct / 100), each = price / p.n;
        return { given: [['Goods cost (Rs m)', f(p.cost)], ['Murabaha profit for the whole period', p.pct + ' %'], ['Equal instalments (one certificate each)', p.n]],
          asks: [{ label: 'Murabaha price (Rs m)', v: price, dp: 2 }, { label: 'Face value of each certificate (Rs m)', v: each, dp: 2 }],
          steps: ['Price = ' + f(p.cost) + ' × ' + (1 + p.pct / 100).toFixed(2) + ' = ' + f(price, 2) + '.', 'Each certificate = ' + f(price, 2) + ' ÷ ' + p.n + ' = ' + f(each, 2) + '.', 'Being debt, a certificate can be transferred only at face value (less collection cost), never at a discount.'] };
      } },
    { id: 'underwriting', cat: 'Funds & investment banking', title: 'Underwriting: take-up and service fee', product: 'underwriting', topic: 't14.6', source: 'Section 14.6.1 (practice figures)',
      book: null,
      rand: function (r) { var iss = rnd(r, 10, 100) * 10; return { iss: iss, uw: Math.round(iss * rnd(r, 20, 60) / 100), sub: Math.round(iss * rnd(r, 60, 100) / 100), fee: rnd(r, 2, 10) / 10, px: 10 }; },
      solve: function (p) {
        var gap = Math.max(0, p.iss - p.sub), take = Math.min(gap, p.uw), fee = p.uw * p.fee / 100;
        return { given: [['Issue size (Rs m)', f(p.iss)], ['Amount underwritten (Rs m)', f(p.uw)], ['Public subscription (Rs m)', f(p.sub)], ['Service fee', p.fee + ' % of the amount underwritten'], ['Offer price', 'Rs.' + p.px + ' per share']],
          asks: [{ label: 'Underwriter’s take-up (Rs m)', v: take }, { label: 'Permissible fee (Rs m)', v: fee, dp: 2 }, { label: 'Take-up commission allowed (Rs m)', v: 0 }],
          steps: ['Unsubscribed = max(0, ' + f(p.iss) + ' − ' + f(p.sub) + ') = ' + f(gap) + '; the underwriter takes up ' + f(take) + ' at the offer price.', 'Fee = ' + f(p.uw) + ' × ' + p.fee + ' % = ' + f(fee, 2) + ', for arranging and marketing only.', 'No commission for the commitment itself, and no discount on the shares taken up (OIC Fiqh Council, 1992).'] };
      } },
    { id: 'shipping-guarantee', cat: 'Trade & working capital', title: 'Delivery-order Murabaha: settling the cost difference', product: 'shipping-guarantee-murabaha', topic: 't14.4.2', source: 'Section 14.4.2 (practice figures)',
      book: null,
      rand: function (r) { var c = rnd(r, 20, 200) * 50000; return { est: c, prof: Math.round(c * rnd(r, 2, 6) / 100), fin: c + rnd(r, -8, 8) * 25000 }; },
      solve: function (p) {
        var diff = p.fin - p.est;
        return { given: [['Estimated cost at the sub-Murabaha', f(p.est)], ['Profit agreed', f(p.prof)], ['Final cost when documents arrive', f(p.fin)]],
          asks: [{ label: 'Final Murabaha price', v: p.fin + p.prof }, { label: 'Amount the customer pays (+) or receives (−) to settle', v: diff }, { label: 'Profit after adjustment', v: p.prof }],
          steps: ['Booked price = ' + f(p.est) + ' + ' + f(p.prof) + ' = ' + f(p.est + p.prof) + '.', 'Cost difference = ' + f(p.fin) + ' − ' + f(p.est) + ' = ' + f(diff) + (diff >= 0 ? ', paid by the customer.' : ', refunded to the customer.'), 'Only the cost portion changes; profit stays ' + f(p.prof) + '.'] };
      } },
    { id: 'post-shipment', cat: 'Trade & working capital', title: 'Bill discounting vs Qard with a collection fee', product: 'post-shipment-qard', topic: 't14.4.2', source: 'Section 14.4.2 (practice figures)',
      book: null,
      rand: function (r) { return { bill: rnd(r, 10, 100) * 100000, days: [30, 45, 60, 90, 120][rnd(r, 0, 4)], disc: rnd(r, 8, 16), fee: rnd(r, 1, 5) / 10 }; },
      solve: function (p) {
        var d = p.bill * p.disc / 100 * p.days / 365, fee = p.bill * p.fee / 100;
        return { given: [['Export bill (local currency at spot)', f(p.bill)], ['Days to maturity', p.days], ['Conventional discount rate', p.disc + ' % p.a.'], ['Islamic collection fee (flat)', p.fee + ' %']],
          asks: [{ label: 'Conventional discount deducted', v: d }, { label: 'Qard received by the exporter', v: p.bill }, { label: 'Collection fee', v: fee }],
          steps: ['Discount = ' + f(p.bill) + ' × ' + p.disc + ' % × ' + p.days + '/365 = ' + f(d) + ': it grows with time, so it is Riba.', 'Qard at face value = ' + f(p.bill) + '.', 'Fee = ' + f(p.bill) + ' × ' + p.fee + ' % = ' + f(fee) + ', the same for 30 or 120 days.'] };
      } },
    { id: 'dm-business', cat: 'Corporate & project', title: 'Diminishing Musharakah in business: buy-out at valuation', product: 'dm-business', topic: 't12.9.1', source: 'Section 12.9.1 (practice figures)',
      book: null,
      rand: function (r) { return { share: rnd(r, 40, 80, 5), sell: rnd(r, 5, 20, 5), v1: rnd(r, 10, 40), g: rnd(r, -15, 25) }; },
      solve: function (p) {
        var v1 = p.v1 * 1000000, v2 = Math.round(v1 * (1 + p.g / 100)), a = v1 * p.sell / 100, b = v2 * p.sell / 100;
        return { given: [['Bank’s share of the business', p.share + ' %'], ['Bank sells each year', p.sell + ' % of the business'], ['Valuation at end of year 1', f(v1)], ['Valuation at end of year 2', f(v2)]],
          asks: [{ label: 'Year-1 purchase price', v: a }, { label: 'Year-2 purchase price', v: b }, { label: 'Bank’s share after two sales (%)', v: p.share - 2 * p.sell }],
          steps: ['Year 1 = ' + p.sell + ' % × ' + f(v1) + ' = ' + f(a) + '.', 'Year 2 = ' + p.sell + ' % × ' + f(v2) + ' = ' + f(b) + ' (valuation ' + (p.g >= 0 ? 'up' : 'down') + ' ' + Math.abs(p.g) + ' %).', 'Bank’s share = ' + p.share + ' − 2 × ' + p.sell + ' = ' + (p.share - 2 * p.sell) + ' %. The price cannot be fixed in the promise for a trading business.'] };
      } },
    { id: 'takaful-models', cat: 'Services & Takaful', title: 'Takaful models compared: who gets what', product: 'takaful', topic: 't16.4.1', source: 'Section 16.4.1 and Box 16.1 (practice figures)',
      book: null,
      rand: function (r) { return { con: rnd(r, 50, 200), claims: rnd(r, 20, 120), fee: rnd(r, 20, 35, 5), inv: rnd(r, 2, 15), mud: rnd(r, 30, 50, 10) }; },
      solve: function (p) {
        var uw = p.con - p.claims, wak = p.con * p.fee / 100, uwW = p.con - wak - p.claims, mudOp = Math.max(0, uw + p.inv) * p.mud / 100, waqfOp = wak + p.inv * p.mud / 100;
        return { given: [['Contributions (m)', f(p.con)], ['Claims and re-Takaful (m)', f(p.claims)], ['Wakalah fee', p.fee + ' %'], ['Investment profit (m)', f(p.inv)], ['Mudarabah ratio (operator : participants)', p.mud + ' : ' + (100 - p.mud)]],
          asks: [{ label: 'Operator’s income, pure Wakalah model (fee only)', v: wak, dp: 2 }, { label: 'Operator’s income, pure Mudarabah model', v: mudOp, dp: 2 }, { label: 'Operator’s income, Wakalah–Waqf model (fee + Mudarib share)', v: waqfOp, dp: 2 }, { label: 'Underwriting result left to participants under Wakalah–Waqf', v: uwW, dp: 2 }],
          steps: ['Pure Wakalah: fee = ' + f(p.con) + ' × ' + p.fee + ' % = ' + f(wak, 2) + '; the surplus and investment profit belong to participants. Any deficit is theirs, with only a Qard from the operator — scholars see this as not equitable.', 'Pure Mudarabah: “profit” = underwriting surplus ' + f(uw) + ' + investment profit ' + f(p.inv) + ', shared ' + p.mud + ' %: operator ' + f(mudOp, 2) + '. The operator takes surplus but not losses, which scholars object to.', 'Wakalah–Waqf (Box 16.1): fee ' + f(wak, 2) + ' + ' + p.mud + ' % of investment profit (' + f(p.inv * p.mud / 100, 2) + ') = ' + f(waqfOp, 2) + '.', 'Underwriting result for the Waqf fund = ' + f(p.con) + ' − ' + f(wak, 2) + ' − ' + f(p.claims) + ' = ' + f(uwW, 2) + (uwW < 0 ? ', a deficit met by Qard al Hasan from shareholders.' : ', belonging to the participants as a group.')] };
      } },
    { id: 'commodity-operations', cat: 'Trade & working capital', title: 'Government wheat procurement by Murabaha', product: 'commodity-operations', topic: 't14.4.2', source: 'Section 14.4.2 (practice figures)',
      book: null,
      rand: function (r) { return { tons: rnd(r, 2, 20) * 10000, price: rnd(r, 20, 40) * 1000, costs: rnd(r, 5, 60), pct: rnd(r, 4, 10) }; },
      solve: function (p) {
        var cost = p.tons * p.price + p.costs * 1000000, prof = cost * p.pct / 100;
        return { given: [['Wheat bought', f(p.tons) + ' tons at Rs.' + f(p.price) + ' per ton'], ['Agency and storage costs', 'Rs.' + p.costs + ' m'], ['Murabaha profit', p.pct + ' % on total cost']],
          asks: [{ label: 'Total cost', v: cost }, { label: 'Murabaha price to the province', v: cost + prof }],
          steps: ['Cost = ' + f(p.tons) + ' × ' + f(p.price) + ' + ' + f(p.costs * 1000000) + ' = ' + f(cost) + '.', 'Profit = ' + f(cost) + ' × ' + p.pct + ' % = ' + f(prof) + '.', 'Price = ' + f(cost + prof) + ', fixed once the syndicate, owning the wheat through its agents, sells it.'] };
      } }
  ];
  IFL.numericals = G;
  IFL.numericalDefs = {};
  G.forEach(function (g) {
    IFL.numericalDefs[g.id] = g;
    IFL.data.addRelation('numerical', g.id, 'topic', g.topic);
    if (g.product) IFL.data.addRelation('numerical', g.id, 'product', g.product);
    var pr = g.product && IFL.data.product(g.product); if (pr) (pr.modeIds || []).forEach(function (m) { IFL.data.addRelation('numerical', g.id, 'mode', m); });
  });

  function parse(s) { s = String(s).replace(/[,\s]/g, '').replace(/[−–]/g, '-'); return s === '' || isNaN(Number(s)) ? null : Number(s); }
  function close(x, v) { var tol = Math.max(0.5 * Math.pow(10, -2), Math.abs(v) * 0.005, 1e-9); if (Math.abs(v) >= 100) tol = Math.max(tol, 1); return Math.abs(x - v) <= tol; }

  function panel(g, mode, seed) {
    var p = mode === 'book' ? g.book : g.rand(rng(seed)), s = g.solve(p);
    var box = h('section.card#num-panel');
    var inputs = s.asks.map(function (a, i) {
      var id = 'num-a' + i, inp = h('input.input', { id: id, inputmode: 'decimal', autocomplete: 'off' }), res = h('span.res', { 'aria-live': 'polite' });
      return { a: a, inp: inp, res: res, row: h('div.num-answer', h('label', { for: id }, a.label), inp, res) };
    });
    var steps = h('ol.steps', { hidden: true }, s.steps.map(function (x) { return h('li', x); }));
    var checked = false;
    function check() {
      var ok = 0;
      inputs.forEach(function (x) {
        var v = parse(x.inp.value), good = v != null && close(v, x.a.v);
        if (good) ok++;
        x.res.className = 'res ' + (good ? 'ok' : 'bad');
        x.res.textContent = v == null ? 'Enter a number' : good ? '✓ Correct' : '✗ Not quite';
      });
      if (!checked) { checked = true; IFL.progress.recordAnswer({ id: 'num-' + g.id, topicId: g.topic }, ok === inputs.length); IFL.progress.recordNumerical(g.id, ok === inputs.length); }
      summary.textContent = ok + ' of ' + inputs.length + ' correct' + (ok === inputs.length ? ' — well done.' : '. Check the working below.');
      if (ok < inputs.length) steps.hidden = false;
    }
    function reveal() { steps.hidden = false; inputs.forEach(function (x) { x.res.className = 'res'; x.res.textContent = '= ' + f(x.a.v, x.a.dp || (Math.abs(x.a.v % 1) > 1e-9 ? 2 : 0)); }); }
    var summary = h('p.small', { 'aria-live': 'polite' });
    var prod = IFL.data.product(g.product) || null;
    u.append(box, [
      h('div.row.between', h('div', h('div.eyebrow', g.cat), h('h2', { style: H2 }, g.title)),
        mode === 'book' ? h('span.badge.accent', 'Textbook figures') : h('span.badge.gold', 'Practice problem — generated for learning')),
      mode === 'book' && g.bookNote ? h('p.small.muted', g.bookNote) : null,
      h('dl.num-given', s.given.map(function (x) { return [h('dt', x[0]), h('dd', String(x[1]))]; })),
      h('p.small.muted', 'Round money to the nearest unit unless two decimals are shown. Commas are fine.'),
      h('form', { onsubmit: function (e) { e.preventDefault(); check(); } }, inputs.map(function (x) { return x.row; }),
        h('div.row', { style: { marginTop: '8px' } }, h('button.btn.primary', { type: 'submit' }, 'Check answers'), h('button.btn', { type: 'button', onclick: reveal }, 'Show solution'),
          h('button.btn', { type: 'button', onclick: function () { IFL.go('/numericals?p=' + g.id + '&s=' + ((Math.random() * 1e9) >>> 0)); } }, u.svg('refresh'), 'New practice problem'),
          g.book && mode !== 'book' ? h('a.btn.ghost', { href: '#/numericals?p=' + g.id + '&s=book' }, 'Book’s figures') : null)),
      summary, h('h3', { style: { fontSize: 'var(--fs-md)' } }, 'Working'), steps,
      h('div.row.small', { style: { marginTop: '8px' } }, 'Source: ' + g.source, h('span.spacer'),
        prod ? h('a', { href: '#/product/' + prod.id }, 'Product: ' + prod.name) : null,
        h('a', { href: '#/topic/' + g.topic }, 'Lesson ' + IFL.course.sourceLabel(g.topic)))]);
    return box;
  }

  IFL.route('/numericals', function (ctx) {
    return Promise.resolve().then(function () {
      var q = ctx.query, cur = G.filter(function (g) { return g.id === q.p; })[0];
      var mode = cur && cur.book && (q.s === 'book' || !q.s) ? 'book' : 'practice';
      var seed = Number(q.s) || 1 + (u.dayKey ? String(u.dayKey()).split('').reduce(function (a, c) { return a + c.charCodeAt(0); }, 0) : 7);
      var cats = [];
      G.forEach(function (g) { if (cats.indexOf(g.cat) < 0) cats.push(g.cat); });
      var ans = IFL.store.state.answers || {};
      var list = h('div.stack', cats.map(function (c) {
        return h('section.card', h('h2', { style: H2 }, c), h('div.grid.grid-3', G.filter(function (g) { return g.cat === c; }).map(function (g) {
          var a = ans['num-' + g.id];
          return h('a.card.card-link' + (cur === g ? '.sel' : ''), { href: '#/numericals?p=' + g.id + (g.book ? '&s=book' : '') },
            h('div.row', g.book ? h('span.badge.accent', 'Book figures + practice') : h('span.badge.gold', 'Practice'), a ? h('span.badge.' + (a.lastCorrect ? 'ok' : 'warn'), a.correct + '/' + a.n + ' solved') : null),
            h('h3', { style: { fontSize: 'var(--fs-md)', margin: '8px 0 4px' } }, g.title), h('p.small.text-2', { style: { margin: 0 } }, g.source));
        })));
      }));
      var node = h('div', C.pageHead({ eyebrow: 'Islamic banking products', title: 'Numericals trainer', desc: G.length + ' problem types covering deposits, Murabaha, Salam, Istisna‘a, Ijarah, Musharakah, Sukuk and Takaful. Problems marked “Textbook figures” use the book’s own numbers; every other problem is generated for learning with the same rules. Your results stay in this browser.' }),
        cur ? panel(cur, mode, seed) : null, list);
      if (cur) setTimeout(function () { var el = document.getElementById('num-panel'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' }); }, 30);
      return node;
    });
  });
})();
