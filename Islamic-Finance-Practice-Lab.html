r":12,"discussedOnPages":[321]},{"id":"g-buyoo-al-amanat","term":"Buyoo‘ al Amanat","category":"Contracts","definition":"Trust-based (fiduciary) sales in which cost is disclosed: Murabaha, Tawliyah and Wadhi‘ah.","glossaryPage":487,"topicId":"t9.3","origin":["f1"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]}},{"id":"g-dayn","term":"Dayn","category":"Money & property","definition":"A debt — a liability arising from a credit transaction such as a credit sale or due rent.","glossaryPage":487,"topicId":"t7.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"Debt; goods of indeterminate category that can be used for payment of liabilities; a liability to pay which results from any credit transaction like purchase/sale on credit or due rentals in Ijarah (leasing). A Dayn comes into existence as a result of any other contract or credit transaction.","relatedTerms":["Bai‘ al Dayn","Qard","‘Ain"],"chapter":3,"discussedOnPages":[47]},{"id":"g-dhaman","term":"Dhaman","category":"Contracts","definition":"Liability or responsibility; a guarantee; the entrepreneur's responsibility for the business.","glossaryPage":487,"topicId":"t7.15","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"Taking liability, responsibility – contract of guarantee; responsibility of entrepreneur/manager of a business.","relatedTerms":["Kafalah","Kharaj bi-al-Daman"],"chapter":2,"discussedOnPages":[34]},{"id":"g-dhaman-khatr-al-tariq","term":"Dhaman Khatr al-Tariq","category":"Takaful & social","definition":"Mutual pool from which traders' losses from road hazards were compensated.","glossaryPage":487,"topicId":"t16.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"An arrangement of mutual assistance in which losses suffered by traders during journeys due to hazards on trade routes were indemnified from jointly pooled funds.","relatedTerms":["‘ Aqilah","Takaful"],"chapter":3,"discussedOnPages":[68]},{"id":"g-dinar","term":"Dinar","category":"Money & exchange","definition":"Historical gold coin currency.","glossaryPage":487,"topicId":"t4.7.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"Currency in the form of gold coins that was prevalent in the past.","relatedTerms":["Dirham","Fulus"],"chapter":2,"discussedOnPages":[28]},{"id":"g-dirham","term":"Dirham","category":"Money & exchange","definition":"Historical silver coin currency.","glossaryPage":487,"topicId":"t4.7.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"Currency in the form of silver coins prevalent in the past.","relatedTerms":["Dinar","Fulus","Qirsh"],"chapter":3,"discussedOnPages":[46,47]},{"id":"g-falah","term":"Falah","category":"Principles","definition":"Success and welfare in this world and the Hereafter, presupposing faith and Shari’ah-conforming conduct.","glossaryPage":487,"topicId":"t2.2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[487]},"extendedDefinition":"Welfare in this world and the Hereafter; Falah means to thrive, to become happy or to have luck and success. Technically, it implies success both in this world and in the Akhirah (Hereafter). The Falah presumes belief in one God, the apostlehood of Prophet Muhammad (pbuh), Akhirah and conformity to the Shari'ah in behaviour.","relatedTerms":["Taqwa","Akhlaq"],"chapter":1,"discussedOnPages":[18]},{"id":"g-fasid","term":"Fasid","category":"Contracts","definition":"A defective (voidable) contract under Hanafi law because a condition of validity is missing.","glossaryPage":488,"topicId":"t5.7.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"A voidable or defective contract (according to division of contracts with respect to legality as per Hanafi Fiqh) due to nonfulfilment of any condition required for valid contracts.","relatedTerms":["‘Aqd","Bai‘ Batil"],"chapter":4,"discussedOnPages":[80]},{"id":"g-fatwah","term":"Fatwah","category":"Sources & jurisprudence","definition":"A religious ruling or edict (plural Fatawa).","glossaryPage":488,"topicId":"t2.2.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"A religious decree or edict; plural Fat awa.","relatedTerms":["Ijtihad","Shari´ah"],"chapter":7,"discussedOnPages":[166]},{"id":"g-fiqh","term":"Fiqh","category":"Sources & jurisprudence","definition":"Islamic jurisprudence — the science of deriving Shari’ah rulings.","glossaryPage":488,"topicId":"t2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Islamic jurisprudence; the science of the Shar i´ah. It is an important source of Islamic tenets.","relatedTerms":["Shari´ah","Ijtihad","Qiyas"],"chapter":1,"discussedOnPages":[13]},{"id":"g-fraidh","term":"Fraidh","category":"Sources & jurisprudence","definition":"Obligatory acts for Muslims.","glossaryPage":488,"topicId":"t2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Obligations – acts that are obligatory for Muslims.","relatedTerms":["Nawahi"],"chapter":2,"discussedOnPages":[21,22]},{"id":"g-fuduli","term":"Fuduli","category":"Contracts","definition":"Someone who contracts for another without being guardian or agent, or who exceeds his agency limits.","glossaryPage":488,"topicId":"t13.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"A person who is neither guardian nor agent, or if he is agent, he transgresses the limits prescribed by the principal in respect of a contract.","relatedTerms":["Ghasib"],"chapter":5,"discussedOnPages":[119]},{"id":"g-fulus","term":"Fulus","category":"Money & exchange","definition":"Coins of base metals.","glossaryPage":488,"topicId":"t4.7.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Coins of inferior metals.","relatedTerms":["Dirham","Dinar","Qirsh"],"chapter":4,"discussedOnPages":[89]},{"id":"g-ghaban","term":"Ghaban","category":"Prohibitions","definition":"Defrauding others about goods' specifications or prices.","glossaryPage":488,"topicId":"t3.3.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Misappropriation or defrauding others in respect of specifications of the goods and their prices.","relatedTerms":["Ghaban-e-Fahish","Khiyar-e-Ghaban"],"chapter":3,"discussedOnPages":[65]},{"id":"g-ghaban-e-fahish","term":"Ghaban-e-Fahish","category":"Prohibitions","definition":"Gross overcharging by deception, implying the market price is charged; gives the buyer an option to revoke.","glossaryPage":488,"topicId":"t6.12","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Excessive profiteering with deception – a person sells a commodity stating explicitly or giving the impression that he is charging the market price, but actually he is charging an exorbitant price taking benefit of the ignorance of the purchaser – in such cases the purchaser has the option to revoke the sale and get back the price paid (see Khiyar-e-Ghaban).","relatedTerms":["Khiyar-e-Ghaban","Ghaban"],"chapter":3,"discussedOnPages":[68]},{"id":"g-gharar","term":"Gharar","category":"Prohibitions","definition":"Excessive uncertainty or hazard about a contract's essential elements (subject matter, price, delivery), causing undue loss to one party — e.g. selling what cannot be delivered or unknown contents.","glossaryPage":488,"topicId":"t3.2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Literally, uncertainty, hazard, risk relating to major elements of a contract; technically, sale of a thing which is not present at hand, or the sale of a thing whose consequence or outcome is not known, or a sale in which one does not know whether it will come to be or not, such as fish in water or a bird in the air. It refers to an element of absolute or excessive uncertainty in any business or a contract about the subject of contract or its price, or mere speculative risk. It leads to undue loss to a party and unjustified enrichment of another, which is prohibited. Gambling is a form of Gharar because the gambler is ignorant of the result of the gamble. Selling goods without allowing the buyer to properly examine the goods is also a kind of Gharar. Some examples of Gharar are: selling goods that the seller is unable to deliver; selling known or unknown goods against an unknown price, such as selling the contents of a sealed box without exact information about its contents; selling goods without proper description; selling goods without specifying the price, such as selling at the “going price”.","relatedTerms":["Maisir","Qimar","Khatar"],"chapter":3,"discussedOnPages":[43]},{"id":"g-gharmeen","term":"Gharmeen","category":"Takaful & social","definition":"A Zakat category: those burdened by debts, including sureties who paid others' debts.","glossaryPage":488,"topicId":"t2.5.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"One head of the Zakat beneficiaries – broadly, those who are obliged to pay others’ debts as sureties. An Islamic State can make up their loss by paying from Zakat proceeds.","relatedTerms":["Zakah/Zakat"],"chapter":7,"discussedOnPages":[169]},{"id":"g-ghasib","term":"Ghasib","category":"Contracts","definition":"A usurper of another's property.","glossaryPage":488,"topicId":"t12.4.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Usurper of property of others.","relatedTerms":["Fuduli"],"chapter":7,"discussedOnPages":[165]},{"id":"g-habal-al-hablah","term":"Habal-al-Hablah","category":"Prohibitions","definition":"Sale of the unborn offspring of an animal — prohibited for Gharar.","glossaryPage":488,"topicId":"t6.7","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Sale of what is in the womb of an animal; a sale where its subject matter is not clearly known – prohibited due to Gharar.","relatedTerms":["Gharar"],"chapter":3,"discussedOnPages":[59]},{"id":"g-halal","term":"Halal","category":"Principles","definition":"Whatever the Shari’ah permits.","glossaryPage":488,"topicId":"t2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Anything permitted by the Shar i´ah; permissible goods, valid earnings, etc.","relatedTerms":["Haram","Mubah"],"chapter":2,"discussedOnPages":[23]},{"id":"g-hamish-jiddiyah","term":"Hamish Jiddiyah","category":"Financing modes","definition":"Security deposit showing a promisor's serious intent; on breach the promisee recovers only actual loss from it.","glossaryPage":488,"topicId":"t5.6.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"The margin reflecting firm intention of the promisee – earnest money taken from a person who intends to purchase a commodity from or enters into a contract with anyone to confirm his sincerity to actually purchase the commodity when offered. In the case of breach of promise, the promisee has the right to recover his actual loss incurred due to the breach.","relatedTerms":["‘Arb un"],"chapter":5,"discussedOnPages":[114]},{"id":"g-haram","term":"Haram","category":"Principles","definition":"Whatever the Shari’ah prohibits.","glossaryPage":488,"topicId":"t2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Anything prohibited by the Shar i´ah.","relatedTerms":["Halal"],"chapter":3,"discussedOnPages":[58]},{"id":"g-hawalah","term":"Hawalah","category":"Contracts","definition":"Assignment of debt: responsibility for a debt is transferred to another; also the instrument (bill, cheque, draft) used.","glossaryPage":488,"topicId":"t7.14","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Literally, transfer; legally, an agreement by which a debtor is freed from a debt by another becoming responsible for it, or the transfer of a claim of a debt by shifting the responsibility from one person to another – contract of assignment of debt. It also refers to the document by which the transfer takes place, like a bill of exchange, promissory note, cheque or draft.","relatedTerms":["Bai‘ al Dayn","Kafalah"],"chapter":1,"discussedOnPages":[18]},{"id":"g-hibah","term":"Hibah","category":"Contracts","definition":"Gift: transfer of ownership without consideration.","glossaryPage":488,"topicId":"t5.8","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Gift – to give something in permanent ownership to another without any consideration in exchange.","relatedTerms":["Tabarru‘"],"chapter":3,"discussedOnPages":[48]},{"id":"g-hilah-hiyal","term":"Hilah (Hiyal)","category":"Prohibitions","definition":"Legal devices or ruses used to circumvent a prohibition.","glossaryPage":488,"topicId":"t6.11","origin":["f1","f2"],"aliases":["Hilah, Hiyal (plural)"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Ruses, tricks used in transactions to circumvent the basic prohibitions.","relatedTerms":["Sadd al-Zar ai‘","Bai‘ al ‘Inah"],"chapter":6,"discussedOnPages":[147,148]},{"id":"g-hukmi-qabza","term":"Hukmi Qabza","category":"Contracts","definition":"Constructive possession: the goods are under the buyer's risk and control without physical delivery.","glossaryPage":489,"topicId":"t5.4.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]},"extendedDefinition":"Constructive possession; a situation in which the buyer has not taken the physical delivery of the commodity, yet the commodity has come into his risk and control and all the rights and liabilities are passed on to him, including the risk of its destruction.","relatedTerms":["Mabi‘"],"chapter":5,"discussedOnPages":[110]},{"id":"g-husnal-qadha","term":"Husnal Qadha","category":"Contracts","definition":"Gracious repayment of a loan with a voluntary extra not stipulated in advance — individual discretion, not a system.","glossaryPage":489,"topicId":"t7.11","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]},"extendedDefinition":"Gracious payment of loan/debt: repaying a loan in excess of the principal without a precondition; individuals’ discretion; not to be adopted as a system in which a creditor, lender or an investor has expectation of getting some reward on the debt. Ibadat: Plural of Ib adah, meaning worship or a ritual act.","relatedTerms":["Tabarru‘","Qard al Hasan"],"chapter":7,"discussedOnPages":[162]},{"id":"g-ibadat","term":"Ibadat","category":"Sources & jurisprudence","definition":"Acts of worship.","glossaryPage":489,"topicId":"t2.2","origin":["f1"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]}},{"id":"g-ibahatul-asliyah","term":"Ibahatul Asliyah","category":"Principles","definition":"Presumption of permissibility: economic activities not prohibited by the Qur’an and Sunnah are allowed.","glossaryPage":489,"topicId":"t5.5","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]},"extendedDefinition":"General permissibility, which means that all economic activities that are not prohibited by the original sources of Shar i´ah, i.e. the Qur an and Sunnah, are valid/permissible.","relatedTerms":["Mubah","Halal"],"chapter":2,"discussedOnPages":[22]},{"id":"g-ijab","term":"Ijab","category":"Contracts","definition":"Offer in a contract (paired with Qabul, acceptance).","glossaryPage":489,"topicId":"t5.4.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]},"extendedDefinition":"Offer, in a contract (see also Qabul).","relatedTerms":["Qabul","‘Aqd"],"chapter":5,"discussedOnPages":[104]},{"id":"g-ijarah","term":"Ijarah","category":"Financing modes","definition":"Lease: sale of a defined usufruct for a defined period against known rent; only non-consumable assets can be leased because the lessor must bear ownership risk.","glossaryPage":489,"topicId":"t11.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]},"extendedDefinition":"Letting on lease. Sale of defined usufruct of any asset for a defined period in exchange of definite rent; only those assets can be leased the corpus of which is not consumed with use or the form/shape of which is not entirely changed with use. For example, cotton, yarn, fuel, milk, money can be sold/bought, but not leased against rentals. This is because the lessor has to bear the risk related to the ownership of the asset, and this is possible only if the leased asset remains intact and the lessor gets reward in the form of rental against taking risk.","relatedTerms":["Ijarah Muntahia-bi-Tamleek","Ijarah-wal-Iqtina‘","Ijarah Mosufah bil Zimmah","Istijar"],"chapter":1,"discussedOnPages":[18]},{"id":"g-ijarah-mosufah-bil-zimmah","term":"Ijarah Mosufah bil Zimmah","category":"Financing modes","definition":"Lease of a described service or benefit without identifying specific units; a destroyed unit is replaced and the lease continues.","glossaryPage":489,"topicId":"t11.3.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]},"extendedDefinition":"A lease contract where the lessor undertakes to provide a well-defined service or benefit without identifying any particular units of asset rendering the related service. If a unit of the asset is destroyed, the contract is not terminated and the lessor provides another such unit.","relatedTerms":["Ijarah","Istisna‘a"],"chapter":5,"discussedOnPages":[121]},{"id":"g-ijarah-muntahia-bi-tamleek","term":"Ijarah Muntahia-bi-Tamleek","category":"Financing modes","definition":"Lease ending in ownership transfer to the lessee, with lease and sale/gift kept as separate transactions.","glossaryPage":489,"topicId":"t11.5","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]},"extendedDefinition":"Lease culminating in the transfer of ownership to the lessee in such a way that lease and sale are kept separate and independent transactions. Use of this term for Islamic leasing is better than Ijarah-wal-Iqtina‘, as the latter tends to give the impression that Ijarah and sale are working side by side, while actually they have to be two separate deals.","relatedTerms":["Ijarah-wal-Iqtina‘","Ijarah"],"chapter":5,"discussedOnPages":[104]},{"id":"g-ijarah-wal-iqtina","term":"Ijarah-wal-Iqtina‘","category":"Financing modes","definition":"Islamic hire-purchase style lease with a separate unilateral undertaking to transfer ownership; Ijarah rules fully apply.","glossaryPage":489,"topicId":"t11.5","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]},"extendedDefinition":"A mode of financing by way of hire–purchase, adopted by Islamic banks but different from conventional hire–purchase. It is a contract under which an Islamic bank purchases equipment, buildings, etc., giving them on lease against agreed rentals together with a unilateral undertaking that at the end of the lease period, the ownership in the asset will be transferred to the lessee. The underlying contract is Ijarah and all rules applicable to Ijarah have to be observed to make the deal Shar i´ah-compliant. The undertaking or the promise does not become an integral part of the lease contract to make it conditional. Ownership is transferred through a separate contract of sale or gift. Another term used for this is Ijarah Muntahia-bi-Tamleek.","relatedTerms":["Ijarah Muntahia-bi-Tamleek","Ijarah"],"chapter":5,"discussedOnPages":[116]},{"id":"g-ijmaa","term":"Ijma‘a","category":"Sources & jurisprudence","definition":"Consensus of qualified scholars on a Shari’ah matter; consensus of the Companions carries special weight.","glossaryPage":489,"topicId":"t2.2.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]},"extendedDefinition":"Consensus – decision or resolution of generality of the Shar i´ah scholars of any time pertaining to any matters relating to Shar i´ah. Ijma‘a of the Companions of the holy Prophet is considered by the overwhelming majority of Muslims as part of the Sunnah and an important source for the derivation of laws in the subsequent periods.","relatedTerms":["Ijtihad","Sunnah"],"chapter":2,"discussedOnPages":[22]},{"id":"g-ijtihad","term":"Ijtihad","category":"Sources & jurisprudence","definition":"A qualified jurist's effort to derive rulings where texts are not explicit; no Ijtihad against express injunctions.","glossaryPage":489,"topicId":"t2.2.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]},"extendedDefinition":"An endeavor of a qualified jurist to derive or formulate a rule of law to determine the true ruling of the divine law in a matter on which the revelation is not explicit or certain, on the basis of Nass or evidence found in the Holy Qur’ an and the Sunnah. Express injunctions have no room for Ijtihad. Implied injunctions can be interpreted in different ways by way of inference from the accepted principles of the Shar i´ah.","relatedTerms":["Qiyas","Ijma‘a","Nass"],"chapter":2,"discussedOnPages":[22]},{"id":"g-illah","term":"‘Illah","category":"Sources & jurisprudence","definition":"The effective cause of a ruling, used for analogy — e.g. the cause of Riba rules in exchanges.","glossaryPage":489,"topicId":"t3.2.1.d","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]},"extendedDefinition":"The attribute of an exchange or event that entails a particular Divine ruling for cases possessing that attribute – cause of prohibition of specific exchange contracts. ‘Illah is the basis for applying analogy for determining permissibility or otherwise of any transaction.","relatedTerms":["Qiyas"],"chapter":3,"discussedOnPages":[52]},{"id":"g-imam","term":"Imam","category":"Sources & jurisprudence","definition":"Leader, guide or ruler.","glossaryPage":489,"topicId":"t2.5.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]},"chapter":2,"discussedOnPages":[35]},{"id":"g-iman","term":"Iman","category":"Principles","definition":"Faith.","glossaryPage":489,"topicId":"t2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[489]},"extendedDefinition":"Faith, belief."},{"id":"g-inan","term":"‘Inan","category":"Partnership","definition":"General partnership in which each partner contributes capital and may work, not necessarily equally.","glossaryPage":490,"topicId":"t12.2.2","origin":["f1","f2"],"aliases":["‘Inan (a type of Shirkah)"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"A form of partnership in which each partner contributes capital and has a right to work for the business, not necessarily equally.","chapter":12,"discussedOnPages":[309]},{"id":"g-israf","term":"Israf","category":"Ethics","definition":"Extravagance — excessive or unnecessary spending even on permissible things.","glossaryPage":490,"topicId":"t2.5.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"Immoderateness, exaggeration in spending wealth and waste, covers spending on objects which are permissible otherwise, spending on superfluous objects, spending on objects which are not needed and are incompatible with the economic standard of the majority of the population (see also Tabzir).","relatedTerms":["Tabzir"],"chapter":2,"discussedOnPages":[33]},{"id":"g-istihsan","term":"Istihsan","category":"Sources & jurisprudence","definition":"Juristic preference allowing an exception to strict analogy when human welfare demands.","glossaryPage":490,"topicId":"t2.2.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"A doctrine of Islamic law that allows exception to strict legal reasoning in special circumstances when considerations of human welfare so demand.","relatedTerms":["Ijtihad","Maslaha-e-Mursalah"],"chapter":10,"discussedOnPages":[263]},{"id":"g-istijar","term":"Istijar","category":"Leasing & services","definition":"Hiring or renting — another term for Ijarah.","glossaryPage":490,"topicId":"t11.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"Hiring, renting – another term less frequently used for Ijarah.","relatedTerms":["Ijarah"],"chapter":11,"discussedOnPages":[279]},{"id":"g-istijrar","term":"Istijrar","category":"Contracts","definition":"Repeat or continuous supply sale at agreed prices and payment terms.","glossaryPage":490,"topicId":"t13.5","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"Repeat sale/a continuous purchase or supply contract – an agreement between a buyer and a supplier whereby the latter agrees to supply a particular product on an ongoing basis, for example monthly, at an agreed price and on the basis of an agreed mode of payment.","chapter":1,"discussedOnPages":[18]},{"id":"g-istisnaa","term":"Istisna‘a","category":"Financing modes","definition":"Order to manufacture or construct, with advance, deferred or instalment payment and future delivery.","glossaryPage":490,"topicId":"t10.11","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"Order to manufacture (for purchase). It is a contractual agreement for manufacturing goods and commodities, allowing cash payment in advance and future delivery or future payment and future delivery. Istisna‘a can be used for providing the facility of financing the manufacture/construction of houses, plant, projects, bridges, roads and highways.","chapter":1,"discussedOnPages":[18]},{"id":"g-iwad","term":"‘Iwad","category":"Principles","definition":"Equivalent counter-value in an exchange; its absence makes an increase Riba.","glossaryPage":490,"topicId":"t3.2.1.e","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"Recompense or equivalent counter value in an exchange. Jahl or Jahala: Ignorance, lack of knowledge; indefiniteness in a contract, non-clarity about the parties or their rights and obligations, the goods/subject matter or the price/consideration – leading to Gharar. Ju‘alah or Ji‘alah : Rendering a service against reward; literally, wages, pay, stipend or reward for a job. Legally, it refers to doing any job or providing any service for achieving an objective which is not sure to be achieved for someone against a prize, fee or commission. Achievement of the end result is necessary for entitlement to the fee or prize. The determination of the required end result of the transaction is considered to be sufficient to make it permissible. Ju‘alah is a relevant and useful transaction in events that cannot be accomplished through Ijarah, such as bringing back lost property from an uncertain location, because an Ijarah contract requires that the work and the wage must be known and specified without any hazard.","chapter":3,"discussedOnPages":[62]},{"id":"g-jahl-jahala","term":"Jahl / Jahala","category":"Prohibitions","definition":"Ignorance or indefiniteness about the parties, their obligations, the subject matter or price — a source of Gharar.","glossaryPage":490,"topicId":"t3.2.2","origin":["f1"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]}},{"id":"g-jualah","term":"Ju‘alah","category":"Contracts","definition":"Reward for achieving a specified result that is not certain to be achieved; the reward is earned only on the result.","glossaryPage":490,"topicId":"t13.4","origin":["f1"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]}},{"id":"g-kafalah","term":"Kafalah","category":"Contracts","definition":"Suretyship/guarantee: a third party undertakes to the creditor that the debtor's obligation will be paid.","glossaryPage":490,"topicId":"t7.15","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"Guarantee; literally, Kafalah means responsibility, amenability or suretyship, legally, in Kafalah, a third party becomes surety for the payment of debt. It is a covenant/pledge given to a creditor that the debtor will pay the debt or any other liability.","relatedTerms":["Hawalah","Dhaman"],"chapter":1,"discussedOnPages":[18]},{"id":"g-khalabah","term":"Khalabah","category":"Prohibitions","definition":"Misleading marketing that exaggerates a product's quality to naive buyers.","glossaryPage":490,"topicId":"t3.3.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"Misleading marketing – pursuing unaware and simple clients by overprojecting the quality of a commodity.","relatedTerms":["Najash","Ghaban","Mustarsal"],"chapter":3,"discussedOnPages":[66]},{"id":"g-kharaj-bil-daman","term":"Kharaj bil Daman","category":"Principles","definition":"Maxim: entitlement to gain goes with liability for loss.","glossaryPage":490,"topicId":"t4.2.6","origin":["f1","f2"],"aliases":["Kharaj bi-al-Daman"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"Gain accompanies liability for loss; a Hadith forming a legal maxim and a basic principle of Islamic finance (see also Al-Ghunm bil Ghurm).","relatedTerms":["Al Ghunm bil Ghurm","Dhaman"],"chapter":4,"discussedOnPages":[73]},{"id":"g-khatar","term":"Khatar","category":"Prohibitions","definition":"A form of Gharar where a party's liability is contingent, delivery is beyond control, or payment is uncertain.","glossaryPage":490,"topicId":"t16.2.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"A kind of Gharar – Khatar will be involved if liability of any of the parties to a contract is uncertain or contingent, delivery of one of the exchange items is not in the control of any party or the payment from one side is uncertain.","relatedTerms":["Gharar"],"chapter":3,"discussedOnPages":[58]},{"id":"g-khiyar","term":"Khiyar","category":"Options (Khiyar)","definition":"An option or right to annul a contract.","glossaryPage":490,"topicId":"t6.12","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"Option or a power to annul or cancel a contract.","relatedTerms":["Khiyar al ‘Aib","Khiyar al-Majlis","Khiyar al Ro’yat","Khiyar al-Shart"],"chapter":3,"discussedOnPages":[60]},{"id":"g-khiyar-al-aib","term":"Khiyar al ‘Aib","category":"Options (Khiyar)","definition":"Option of defect: the buyer may return defective goods.","glossaryPage":490,"topicId":"t6.12","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"Option of defect – goods can be returned if found defective – option automatically available to the buyer.","relatedTerms":["Khiyar al Wasf","Khiyar"],"chapter":6,"discussedOnPages":[151]},{"id":"g-khiyar-al-majlis","term":"Khiyar al-Majlis","category":"Options (Khiyar)","definition":"Option of the session: either party may annul before they separate.","glossaryPage":490,"topicId":"t6.12","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"Option for the contracting session; the power to annul a contract possessed by both contracting parties as long as they do not separate.","relatedTerms":["Khiyar al-Shart","Khiyar"],"chapter":6,"discussedOnPages":[150]},{"id":"g-khiyar-al-royat","term":"Khiyar al Ro’yat","category":"Options (Khiyar)","definition":"Option of inspection: the buyer may revoke on seeing goods bought unseen.","glossaryPage":490,"topicId":"t6.12","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"Option to revoke a sale contract to be exercised on seeing the goods.","relatedTerms":["Khiyar al ‘Aib","Khiyar"],"chapter":6,"discussedOnPages":[151,152]},{"id":"g-khiyar-al-shart","term":"Khiyar al-Shart","category":"Options (Khiyar)","definition":"Stipulated option allowing a party to cancel within an agreed period.","glossaryPage":491,"topicId":"t6.12","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"A right, stipulated by one or both of the parties to a contract, to cancel the contract for any reason within a fixed period of time.","relatedTerms":["Khiyar al-Majlis","Khiyar","Bai‘ al Khiyar"],"chapter":5,"discussedOnPages":[107]},{"id":"g-khiyar-al-wasf","term":"Khiyar al Wasf","category":"Options (Khiyar)","definition":"Option of description: the buyer may return goods not matching the described attributes.","glossaryPage":491,"topicId":"t6.12","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"Option of quality – where goods are sold by specified quality, if that quality is absent, the goods can be returned.","relatedTerms":["Khiyar al ‘Aib","Khiyar"],"chapter":6,"discussedOnPages":[151]},{"id":"g-khiyar-e-ghaban","term":"Khiyar-e-Ghaban","category":"Options (Khiyar)","definition":"Option for gross overpricing where the buyer was led to believe he paid the market price.","glossaryPage":488,"topicId":"t6.12","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[488]},"extendedDefinition":"Option relating to price – where goods are sold at a price far higher than the market price, and the client is told or given the impression that he has been charged the market price.","relatedTerms":["Ghaban-e-Fahish","Ghaban","Khiyar"],"chapter":6,"discussedOnPages":[151]},{"id":"g-khiyar-e-naqad","term":"Khiyar-e-Naqad","category":"Options (Khiyar)","definition":"Option of payment: the sale is annulled if payment is not made within an agreed short period.","glossaryPage":491,"topicId":"t6.12","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"Option of payment – to agree that if payment is not made within (three) days, the contract will be annulled.","relatedTerms":["Khiyar","Khiyar al-Shart"],"chapter":6,"discussedOnPages":[151]},{"id":"g-malum","term":"Ma‘lum","category":"Contracts","definition":"Known to the parties.","glossaryPage":491,"topicId":"t5.4.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"Known – in the knowledge of the parties.","relatedTerms":["Bai‘ al-Majh ul"],"chapter":3,"discussedOnPages":[59]},{"id":"g-mabi","term":"Mabi‘","category":"Contracts","definition":"The subject matter of a sale.","glossaryPage":491,"topicId":"t5.4.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"Subject of sale – the commodity that is being traded in a transaction.","relatedTerms":["Hukmi (Qabza)","Thaman"],"chapter":5,"discussedOnPages":[102]},{"id":"g-maisir","term":"Maisir","category":"Prohibitions","definition":"Gambling — acquiring wealth by chance without counter-value, work or liability; named after an ancient Arabian arrow game.","glossaryPage":491,"topicId":"t3.2.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"An ancient Arabian game of chance played with arrows without heads and feathering, for stakes of slaughtered and quartered camels. It refers to all types of hazard and gambling – acquisition of wealth by chance/easily (without paying an equivalent compensation (‘Iwad) for it or without working for it, or without undertaking any liability against it).","relatedTerms":["Qimar","Gharar"],"chapter":3,"discussedOnPages":[43]},{"id":"g-mal","term":"Mal","category":"Money & property","definition":"Anything capable of possession — money, commodities, real estate.","glossaryPage":491,"topicId":"t5.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"Anything that can be possessed; includes money such as gold, silver and monetary units, commodities such as clothes and foodstuffs and immovable properties such as houses and factories.","relatedTerms":["Mal-e-Mutaqawam","Mithli"],"chapter":12,"discussedOnPages":[309,310]},{"id":"g-mal-e-mutaqawam","term":"Mal-e-Mutaqawam","category":"Money & property","definition":"Wealth lawful to use and of commercial value under Shari’ah (legal tender included; wine and pork excluded for Muslims).","glossaryPage":491,"topicId":"t5.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"Things the use of which is lawful under the Shar i´ah, or wealth that has a commercial value. Legal tenders of the modern age that carry monetary value are included in M al-e- Mutaqawam. It is possible that certain wealth has no commercial value for Muslims (non-Mutaqawam) but is valuable for non-Muslims. Examples are wine and pork.","relatedTerms":["Mal"],"chapter":6,"discussedOnPages":[135]},{"id":"g-maslaha-e-mursalah","term":"Maslaha-e-Mursalah","category":"Sources & jurisprudence","definition":"Public welfare considered by jurists in Ijtihad when resolving new issues.","glossaryPage":491,"topicId":"t2.2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"The aspect of general welfare/benefit of mankind/society that is kept in mind by the scholars competent to undertake Ijtihad while resolving issues confronted from time to time. Catering to the well-being of people in the worldly life and also in the Hereafter or relieving them of hardships is the basic objective of the Shar i´ah. Mawalat: A contract in ancient Arabia in which one party agreed to bequeath his property to the other on the understanding that the benefactor would pay any blood money that may eventually be due by the former.","relatedTerms":["Istihsan","Ijtihad"],"chapter":2,"discussedOnPages":[22]},{"id":"g-mawalat","term":"Mawalat","category":"Takaful & social","definition":"Pre-Islamic contract where one party bequeathed property to another who undertook to pay his blood money.","glossaryPage":491,"topicId":"t16.3","origin":["f1"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]}},{"id":"g-mawquf","term":"Mawquf","category":"Contracts","definition":"A contract whose effect is suspended pending an event or ratification.","glossaryPage":491,"topicId":"t5.7","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"A contract, the effectiveness of which is suspended until any happening.","relatedTerms":["T‘aliq","Bai‘ al Mu‘allaq"],"chapter":5,"discussedOnPages":[118,119]},{"id":"g-mithaq","term":"Mithaq","category":"Contracts","definition":"A solemn covenant with greater sanctity than an ordinary contract.","glossaryPage":491,"topicId":"t5.2.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"A covenant; refers to an earnest and firm determination on the part of the concerned parties to fulfil the contractual obligations; has more sanctity than the ordinary contracts.","relatedTerms":["‘Ahd","W‘adah"],"chapter":5,"discussedOnPages":[103]},{"id":"g-mithlan-bi-mithlin","term":"Mithlan bi-mithlin","category":"Money & exchange","definition":"‘Like for like’ — equality required when exchanging Ribawi goods of one kind.","glossaryPage":491,"topicId":"t3.2.1.d","origin":["f1","f2"],"aliases":["Mithlam-bi-mithlin"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"Like for like (in exchange transactions).","relatedTerms":["Mithli","Saw´am-bi-sawaa´"],"chapter":3,"discussedOnPages":[53]},{"id":"g-mithli","term":"Mithli","category":"Money & property","definition":"Fungible goods whose units are identical and returnable in kind (gold, wheat, currencies).","glossaryPage":491,"topicId":"t3.2.1.d","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"Fungible goods; goods all units of which are the same and that can be returned in kind, i.e. gold, silver, wheat, all currencies, etc. Mu‘amalat: All kinds of economic activities related to exchange of goods and services.","relatedTerms":["Mithlam-bi-mithlin","Mal"],"chapter":3,"discussedOnPages":[53]},{"id":"g-muamalat","term":"Mu‘amalat","category":"Sources & jurisprudence","definition":"Economic and transactional dealings between people.","glossaryPage":491,"topicId":"t5.5","origin":["f1"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]}},{"id":"g-muaawamah","term":"Mua‘awamah","category":"Prohibitions","definition":"Sale of a tree's fruit for years ahead without specifying quantity, price or delivery — prohibited.","glossaryPage":491,"topicId":"t6.7","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"Sale for years – e.g. fruit of a tree or an orchard sold for more than one year to come without stipulating the amount, price or time of delivery – prohibited.","chapter":6,"discussedOnPages":[137]},{"id":"g-mubah","term":"Mubah","category":"Principles","definition":"Lawful — permissible to use or trade.","glossaryPage":491,"topicId":"t2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"Object that is lawful (i.e. something which is permissible to use or trade in).","relatedTerms":["Halal","Ibahatul Asliyah"],"chapter":6,"discussedOnPages":[135]},{"id":"g-mudarabah","term":"Mudarabah","category":"Partnership","definition":"Partnership where one party provides capital and the other management; profit shared as agreed, loss borne by the capital provider.","glossaryPage":491,"topicId":"t12.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"A form of partnership where one party provides the funds while the other provides expertise and management. The latter is referred to as the Mudarib. Any profits accrued are shared between the two parties on a pre-agreed basis, while any loss is borne by the provider of the capital.","relatedTerms":["Musharakah","Mudarib","Rabbul-mal","Qirad"],"chapter":1,"discussedOnPages":[18]},{"id":"g-mudarib","term":"Mudarib","category":"Partnership","definition":"The managing/entrepreneur partner in a Mudarabah.","glossaryPage":491,"topicId":"t12.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[491]},"extendedDefinition":"In a Mudarabah contract, the person or party who acts as entrepreneur.","relatedTerms":["Mudarabah","Rabbul-mal"],"chapter":4,"discussedOnPages":[85]},{"id":"g-muflis","term":"Muflis","category":"Contracts","definition":"An insolvent or bankrupt debtor.","glossaryPage":492,"topicId":"t7.13","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"Destitute; insolvent/bankrupt debtors.","relatedTerms":["Qard","Dayn"],"chapter":7,"discussedOnPages":[167]},{"id":"g-mugharasah","term":"Mugharasah","category":"Partnership","definition":"Joint plantation project sharing the produce.","glossaryPage":492,"topicId":"t15.3.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"Joint venture projects involving plantation of gardens and sharing the produce.","relatedTerms":["Muzara‘a","Musaqah"],"chapter":15,"discussedOnPages":[396]},{"id":"g-mulamasah","term":"Mulamasah","category":"Prohibitions","definition":"Sale concluded by touching the item or its package without knowing its details — prohibited.","glossaryPage":492,"topicId":"t6.7","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"Sale by touching the subject matter or its carton without knowing its detail.","relatedTerms":["Munabadhah","Bai‘ al Hasat"],"chapter":3,"discussedOnPages":[59]},{"id":"g-munabadhah","term":"Munabadhah","category":"Prohibitions","definition":"Sale by throwing garments to each other without examining them — prohibited.","glossaryPage":492,"topicId":"t6.7","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"If a man throws to another a garment in exchange for a garment that the other throws to him without both of them examining them.","relatedTerms":["Mulamasah","Bai‘ al Hasat"],"chapter":3,"discussedOnPages":[59]},{"id":"g-murabaha","term":"Murabaha","category":"Financing modes","definition":"Sale in which the seller discloses cost and adds an agreed profit; used by banks on a client's purchase request (Murabaha to Purchase Orderer).","glossaryPage":492,"topicId":"t9.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"Literally it means a sale on mutually agreed profit. Technically, it is a contract of sale in which the seller declares his cost and the profit. This has been adopted by Islamic banks as a mode of financing. As a financing technique, it can involve a request by the client to the bank to purchase a certain item for him. The bank does that for a definite profit over the cost. Murabaha lil ’amri bil Shira or Murabaha li Wa´da bi Shira : Murabaha to Purchase Orderer.","relatedTerms":["Musawamah","Bai‘ Mu´ajjal","Bai‘ Tawliyah","Bai‘ Wadhi‘ah"],"chapter":1,"discussedOnPages":[18]},{"id":"g-musaqah","term":"Musaqah","category":"Partnership","definition":"Contract sharing a garden's produce with someone who irrigates and tends it.","glossaryPage":492,"topicId":"t15.3.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"A contract in which the owner of a garden shares its produce with another person in return for his services in irrigating the garden.","relatedTerms":["Muzara‘a","Mugharasah"],"chapter":15,"discussedOnPages":[396]},{"id":"g-musawamah","term":"Musawamah","category":"Financing modes","definition":"Ordinary bargained sale without reference to the seller's cost.","glossaryPage":492,"topicId":"t9.11","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"A general kind of sale in which the price of the commodity to be traded is bargained between the seller and the purchaser without any reference to the price paid or cost incurred by the former.","relatedTerms":["Murabaha","Bai‘ Musawamah"],"chapter":4,"discussedOnPages":[77]},{"id":"g-musharakah","term":"Musharakah","category":"Partnership","definition":"Partnership in which all partners contribute capital; profit by agreed ratio, loss by capital; may be permanent or diminishing.","glossaryPage":492,"topicId":"t12.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"Partnership between two parties, who both provide capital towards the financing of a project. Both parties share profits on a pre-agreed ratio, but losses are shared on the basis of equity participation. Management of the project is carried out by both parties. However, the partners also have a right to forego the right of management/work in favour of any specific partner or person. There are two main forms of Musharakah: Permanent Musharakah and Diminishing Musharakah.","relatedTerms":["Shirkah","Mudarabah","Shirkatulmilk"],"chapter":1,"discussedOnPages":[18]},{"id":"g-mustarsal","term":"Mustarsal","category":"Prohibitions","definition":"An inexperienced market entrant unaware of prices, who must not be exploited.","glossaryPage":492,"topicId":"t3.3.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"An unknowing entrant into the market – not aware of the market.","relatedTerms":["Khalabah","Ghaban"],"chapter":3,"discussedOnPages":[67]},{"id":"g-muzaraah","term":"Muzara‘ah","category":"Partnership","definition":"Share-cropping: one party tills another's land for a share of the produce.","glossaryPage":492,"topicId":"t15.3.4","origin":["f1","f2"],"aliases":["Muzara‘a"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"Share cropping; a contract in which one person agrees to till the land of another person in return for a part of the produce of the land.","relatedTerms":["Musaqah","Mugharasah"],"chapter":5,"discussedOnPages":[122]},{"id":"g-najash","term":"Najash","category":"Prohibitions","definition":"Bidding up a price without intending to buy.","glossaryPage":492,"topicId":"t3.3.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"Bidding up the price without an intention to purchase and take delivery of the commodity.","relatedTerms":["Ghaban","Khalabah"],"chapter":3,"discussedOnPages":[66,67]},{"id":"g-nass","term":"Nass","category":"Sources & jurisprudence","definition":"The clear texts of the Qur’an and Sunnah.","glossaryPage":492,"topicId":"t2.2.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"Clear texts of the Shar i´ah, i.e. the Qur´ an and Sunnah.","relatedTerms":["Shari´ah","Ijtihad"],"chapter":4,"discussedOnPages":[89]},{"id":"g-nawahi","term":"Nawahi","category":"Sources & jurisprudence","definition":"Acts prohibited by Islam.","glossaryPage":492,"topicId":"t2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"Prohibitions – acts prohibited by Islam.","relatedTerms":["Fraidh"],"chapter":2,"discussedOnPages":[21]},{"id":"g-niyyah","term":"Niyyah","category":"Principles","definition":"Intention behind an act.","glossaryPage":492,"topicId":"t15.3.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"Intent or intention while doing a job or action.","chapter":3,"discussedOnPages":[52]},{"id":"g-qabul","term":"Qabul","category":"Contracts","definition":"Acceptance in a contract (paired with Ijab, offer).","glossaryPage":492,"topicId":"t5.4.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"Acceptance, in a contract (see also Ijab).","relatedTerms":["Ijab","‘Aqd"],"chapter":5,"discussedOnPages":[104]},{"id":"g-qard","term":"Qard","category":"Contracts","definition":"Loan of something of value to be repaid in the same or similar amount; repayment is obligatory and no benefit may be stipulated.","glossaryPage":492,"topicId":"t7.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"Literally “to cut”. It is so called because the property is cut off – transferred to the borrower. Legally, Qard means to give anything having value in the ownership of the other by way of virtue so that the latter may avail himself of the same for his benefit with the condition that the same or similar amount of that thing will be paid back on demand or at the settled time. The repayment of loan is obligatory. Loans under Islamic law can be classified into Salaf and Qard, the former being a loan for a fixed time and the latter payable on demand. Qard is, in fact, a particular kind of Salaf (see Salaf).","relatedTerms":["Qard al Hasan","Salaf","Dayn"],"chapter":3,"discussedOnPages":[47]},{"id":"g-qard-al-hasan","term":"Qard al Hasan","category":"Contracts","definition":"A benevolent loan repaid without any increase; in Islamic law every loan must be of this kind.","glossaryPage":492,"topicId":"t7.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"A virtuous loan. A loan with the stipulation to return the principal sum in the future without any increase; in Islamic law, all loans have to be virtuous, as seeking any benefit from loaning amounts to Riba.","relatedTerms":["Qard","Tabarru‘"],"chapter":4,"discussedOnPages":[77]},{"id":"g-qimar","term":"Qimar","category":"Prohibitions","definition":"Gambling: ownership depends on an uncertain event so one party gains at the other's loss.","glossaryPage":492,"topicId":"t3.2.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[492]},"extendedDefinition":"Games of chance – gambling. Technically, it is an arrangement in which possession of a property is contingent upon the happening of an uncertain event. By implication, this applies to a situation in which there is a loss for one party and a gain for the other without specifying which party will lose and which will gain.","relatedTerms":["Maisir","Gharar"],"chapter":3,"discussedOnPages":[43]},{"id":"g-qirad","term":"Qirad","category":"Partnership","definition":"Another name for Mudarabah (also Muqaradah).","glossaryPage":493,"topicId":"t12.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"Another name for Mudarabah – partnership in which a person or a group of people provides funds while another provides entrepreneurship for conducting the business.","relatedTerms":["Mudarabah","Qirad mithl"],"chapter":4,"discussedOnPages":[80]},{"id":"g-qirad-mithl","term":"Qirad mithl","category":"Partnership","definition":"Market-rate compensation paid to a Mudarib if the Mudarabah becomes defective.","glossaryPage":493,"topicId":"t12.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"Matching rate in Qirad/Mudarabah, which has to be paid to the Mudarib if the Mudarabah/Muqaradah contract becomes voidable due to any technical reason.","relatedTerms":["Qirad","Ribh-al-mithl"],"chapter":4,"discussedOnPages":[80]},{"id":"g-qirsh","term":"Qirsh","category":"Money & exchange","definition":"A base-metal coin once used in Iraq.","glossaryPage":493,"topicId":"t7.17","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"A coin of inferior metals used in ancient Iraq for making payment.","relatedTerms":["Dirham","Fulus"],"chapter":7,"discussedOnPages":[174]},{"id":"g-qisas","term":"Qisas","category":"Sources & jurisprudence","definition":"Legal retribution for harm to human life.","glossaryPage":493,"topicId":"t2.2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"A provision of Islamic law to punish those who cause any harm to human lif e – a murderer is executed to death in exchange. Qiyami or Qimi : Nonfungible goods; the value of each unit of which is different.","relatedTerms":["Zulm"],"chapter":2,"discussedOnPages":[23]},{"id":"g-qiyami-qimi","term":"Qiyami / Qimi","category":"Money & property","definition":"Non-fungible goods whose units differ in value.","glossaryPage":493,"topicId":"t3.2.1.d","origin":["f1"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]}},{"id":"g-qiyas","term":"Qiyas","category":"Sources & jurisprudence","definition":"Analogy: extending a ruling to a new case sharing the same ‘Illah.","glossaryPage":493,"topicId":"t2.2.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"Analogy – literally it means to measure or compare for analogy. Technically, it means a derivation of the law on the analogy of an existing law if the basis (‘Illah) of the two is the same. It is one of the sources of Islamic law.","relatedTerms":["Ijtihad","‘Illah"],"chapter":2,"discussedOnPages":[22]},{"id":"g-raasul-mal","term":"Ra’asul-mal","category":"Money & property","definition":"Principal of a loan or debt, or capital invested in a business.","glossaryPage":493,"topicId":"t7.7","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"Principal amount of a loan or a debt or money invested in a business.","relatedTerms":["Rabbul-mal","Mudarabah"],"chapter":3,"discussedOnPages":[47]},{"id":"g-raiee","term":"Ra‘iee","category":"Ethics","definition":"A person in charge who is responsible for those under him.","glossaryPage":493,"topicId":"t2.5.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"In charge – one who is responsible for his subordinates.","chapter":2,"discussedOnPages":[35]},{"id":"g-rabbul-mal","term":"Rabbul-mal","category":"Partnership","definition":"The capital provider in Shirkah/Mudarabah.","glossaryPage":493,"topicId":"t12.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"The person who invests the capital in a Shirkah/Mudarabah contract.","relatedTerms":["Mudarib","Mudarabah"],"chapter":8,"discussedOnPages":[189,190]},{"id":"g-riba","term":"Riba","category":"Prohibitions","definition":"Any increase over the principal of a loan or debt, or excess in exchange of like goods, gained without an equivalent counter-value.","glossaryPage":493,"topicId":"t3.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"Literally, an excess or increase. Technically, it means an increase over the principal in a loan transaction, over a debt or in exchange transactions, accrued to the lender/creditor or a party to exchange without giving an equivalent counter value or recompense (‘iwad) in return to the other party.","relatedTerms":["Riba Al-Fadl","Riba Al-Nasiah","Ribawi","Gharar"],"chapter":1,"discussedOnPages":[12,13]},{"id":"g-riba-al-fadl","term":"Riba al-Fadl","category":"Prohibitions","definition":"Excess in a hand-to-hand exchange of the same Ribawi genus (e.g. more dates for fewer better dates).","glossaryPage":493,"topicId":"t3.2.1.d","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"The quality premium in exchange of low quality with better quality goods, e.g. dates for dates, wheat for wheat, etc. – an excess in the exchange of Ribawi goods in the case of a single genus on both sides. The concept of Riba Al-Fadl refers to exchange/sale transactions.","relatedTerms":["Riba Al-Nasiah","Ribawi","Mithlam-bi-mithlin"],"chapter":3,"discussedOnPages":[52,53]},{"id":"g-riba-al-nasiah","term":"Riba al-Nasiah","category":"Prohibitions","definition":"Riba of delay: increase on a loan or debt for time, or deferment in exchanging Ribawi goods; modern bank interest falls here.","glossaryPage":493,"topicId":"t3.2.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"Riba of delay, due to exchange not being immediate with or without excess in one of the counter values. It is an increment on the principal of a loan or debt payable. It refers to loan/credit transactions or lending money on the understanding that the borrower will return to the lender at the end of the period the amount originally lent together with an increase on it, in consideration of the lender having granted him time to pay. Interest, in all modern banking transactions, falls under the purview of Riba Al-Nasiah.","relatedTerms":["Riba Al-Fadl","Riba","Qard"],"chapter":3,"discussedOnPages":[50]},{"id":"g-ribawi","term":"Ribawi","category":"Money & exchange","definition":"Goods subject to Riba rules in exchange: monetary units and items sold by weight or measure (gold, silver, currencies, wheat, dates, salt).","glossaryPage":493,"topicId":"t3.2.1.d","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"Goods subject to Fiqh rules on Riba in sales – monetary units and items sold by weight and/or by measure, including gold, silver, paper currencies, edible goods like wheat, rice, barley, dates, salt, etc.","relatedTerms":["Riba Al-Fadl","Riba Al-Nasiah","Sarf"],"chapter":7,"discussedOnPages":[164]},{"id":"g-ribh-al-mithl","term":"Ribh al-mithl","category":"Financing modes","definition":"A comparable (matching) rate of profit.","glossaryPage":493,"topicId":"t4.2.5","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"Matching rate of profit. Rihn or Rahn : Pledge, collateral; legally, Rihn means to pledge or lodge a real or corporeal property of material value as security for a debt or pecuniary obligation, so as to make it possible for the creditor to recover the debt, in the case of nonpayment, by selling the pledged property.","relatedTerms":["Qirad mithl","Thaman-e-mithl"],"chapter":4,"discussedOnPages":[80]},{"id":"g-rahn","term":"Rahn","category":"Contracts","definition":"Pledge or collateral that the creditor may sell to recover an unpaid debt.","glossaryPage":493,"topicId":"t7.15","origin":["f1"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]}},{"id":"g-rukban","term":"Rukban","category":"Ethics","definition":"Rural traders bringing goods to town, whom middlemen were forbidden to intercept.","glossaryPage":493,"topicId":"t3.3.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"Grain dealers coming from the tribal/rural areas to the town to sell goods.","relatedTerms":["Najash"],"chapter":3,"discussedOnPages":[67]},{"id":"g-saa","term":"Sa‘a","category":"Money & exchange","definition":"A historical volume measure for grain.","glossaryPage":493,"topicId":"t3.2.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"A measure that was used for exchanging/trading grains.","relatedTerms":["Mithli"],"chapter":3,"discussedOnPages":[46]},{"id":"g-sadd-al-zarai","term":"Sadd al-Zarai‘","category":"Sources & jurisprudence","definition":"Blocking the means: prohibiting a transaction that leads to an illicit end.","glossaryPage":493,"topicId":"t2.2.1","origin":["f1","f2"],"aliases":["Sadd al-Zar ai‘"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"To prohibit a transaction on the grounds of blocking the means to an illicit end.","relatedTerms":["Hilah, Hiyal (plural)"],"chapter":6,"discussedOnPages":[149]},{"id":"g-sahabah","term":"Sahabah","category":"Sources & jurisprudence","definition":"The Companions of the Prophet (pbuh).","glossaryPage":493,"topicId":"t3.2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"Companions of the holy Prophet of Islam – the people who saw the holy Prophet while being firm believers (Muslims).","chapter":3,"discussedOnPages":[58]},{"id":"g-salaf","term":"Salaf","category":"Contracts","definition":"(i) A loan for a fixed term yielding no profit, or another name for Salam; (ii) early generations of scholars.","glossaryPage":493,"topicId":"t7.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"Used in two senses: (i) literally, payment in advance; a loan which draws forth no profit for the creditor; it includes loans for specified periods, i.e. short, intermediate and long-term loans; slightly different from Qard – an amount given as Salaf cannot be called back, unlike Qard, before it is due. Also, another name of Salam – forward sale; (ii) Forebears – jurists and scholars of early periods of Islam.","relatedTerms":["Bai‘ Salam","Qard"],"chapter":5,"discussedOnPages":[111]},{"id":"g-sanadat","term":"Sanadat","category":"Capital markets","definition":"Investment certificates — another name for Sukuk.","glossaryPage":494,"topicId":"t15.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"relatedTerms":["Sukuk"],"chapter":15,"discussedOnPages":[392]},{"id":"g-sarf","term":"Sarf","category":"Money & exchange","definition":"Contract exchanging gold, silver or monetary units.","glossaryPage":494,"topicId":"t3.2.1.d","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"Contract in which both exchange items are gold, silver or any monetary units.","relatedTerms":["Bai‘ al Sarf","Al-Sarf"],"chapter":3,"discussedOnPages":[52]},{"id":"g-sawaan-bi-sawain","term":"Sawa’an bi-sawa’in","category":"Money & exchange","definition":"‘Equal for equal’ in exchanges of like Ribawi goods.","glossaryPage":493,"topicId":"t3.2.1.d","origin":["f1","f2"],"aliases":["Saw´am-bi-sawaa´"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[493]},"extendedDefinition":"Equal for equal (in exchange transactions).","relatedTerms":["Mithlam-bi-mithlin","Yadam-bi-yadin"],"chapter":3,"discussedOnPages":[53]},{"id":"g-shariah","term":"Shari’ah","category":"Sources & jurisprudence","definition":"Divine guidance in the Qur’an and Sunnah covering belief and practice.","glossaryPage":494,"topicId":"t2.2","origin":["f1","f2"],"aliases":["Shari´ah"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"Divine guidance as given by the Holy Qur’ an and the Sunnah of the Prophet Muhammad (pbuh); embodies all aspects of the Islamic faith, including beliefs and practice.","relatedTerms":["Fiqh","Sunnah","Nass"],"chapter":2,"discussedOnPages":[21]},{"id":"g-shart-e-jazai","term":"Shart-e-Jazai","category":"Financing modes","definition":"Clause in Istisna‘a reducing the price for late delivery — the reduction benefits the buyer, unlike payment-default penalties that go to charity.","glossaryPage":494,"topicId":"t10.11.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"A clause that a purchaser can put into an Istisna‘a agreement whereby the price of the item being manufactured would decrease in the case of a delay in delivery by the seller/manufacturer whereby the delay benefits the purchaser – unlike all other modes in which any penalty imposed due to default or delay in payment of liabilities goes to the charity account and not to the banks’P&L accounts.","relatedTerms":["Istisna‘a"],"chapter":4,"discussedOnPages":[85]},{"id":"g-shirkah","term":"Shirkah","category":"Partnership","definition":"Commingling of money, work or obligations to earn profit or appreciation and share loss by ownership; includes Musharakah and Mudarabah.","glossaryPage":494,"topicId":"t12.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"Commingling by two or more people of their money or work or obligations to earn a profit or a yield or appreciation in value and to share the loss, if any, according to their proportionate ownership. In the present Islamic banking terminology, it may include both Musharakah and Mudarabah and various kinds of Musharakah like business/commercial partnership, partnership by ownership and permanent or redeemable partnership.","relatedTerms":["Musharakah","Mudarabah","Shirkatul‘aqd","Shirkatulmilk"],"chapter":1,"discussedOnPages":[14]},{"id":"g-shirkatulaqd","term":"Shirkatul‘aqd","category":"Partnership","definition":"Contractual business partnership formed to earn profit.","glossaryPage":494,"topicId":"t12.2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"Commercial/business partnershi p – a contract between two or more people who launch a business or an enterprise to make profits.","relatedTerms":["Shirkatulmilk","Musharakah"],"chapter":12,"discussedOnPages":[307,308]},{"id":"g-shirkatulmilk","term":"Shirkatulmilk","category":"Partnership","definition":"Partnership in ownership (joint ownership), not formed for business.","glossaryPage":494,"topicId":"t12.2.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"Partnership by ownership or in the right of ownership; not for business.","relatedTerms":["Shirkatul‘aqd","Musharakah"],"chapter":4,"discussedOnPages":[80]},{"id":"g-shufah","term":"Shuf‘ah","category":"Contracts","definition":"Pre-emption right of a co-owner or neighbour when landed property is sold.","glossaryPage":494,"topicId":"t3.3.5","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"Pre-emptive right of a partner in a joint ownership or a neighbour in sale of landed properties.","chapter":3,"discussedOnPages":[70]},{"id":"g-suftajah","term":"Suftajah","category":"Banking","definition":"Historical instrument for transferring money: funds deposited in one place for payment elsewhere.","glossaryPage":494,"topicId":"t14.6","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"An instrument in traditional Islamic finance used for cash transfer/payment which involved the act of depositing a certain amount of money with someone for settlement or to the benefit of the depositor or his representative at another place or in another country. A type of instrument used for the delegation of credit during the Muslim period, especially the Abbasides period. It was used to collect taxes, disburse government dues and transfer funds by merchants.","relatedTerms":["Hawalah"],"chapter":7,"discussedOnPages":[168]},{"id":"g-sukuk","term":"Sukuk","category":"Capital markets","definition":"Certificates of equal value representing undivided ownership in tangible assets, usufruct, services, or specific projects or investment activities.","glossaryPage":494,"topicId":"t15.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"Certificates of equal value representing undivided share in ownership of tangible assets of particular projects or specific investment activity, usufruct and services.","relatedTerms":["Sanadat","Ijarah Muntahia-bi-Tamleek"],"chapter":1,"discussedOnPages":[18,19]},{"id":"g-sunnah","term":"Sunnah","category":"Sources & jurisprudence","definition":"The Prophet's (pbuh) sayings, actions and tacit approvals as reported in Hadith.","glossaryPage":494,"topicId":"t2.2.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"Literally, custom, habit or way of life. Technically, it refers to actions, sayings and utterances of the holy Prophet Muhammad (pbuh), or actions of others tacitly approved by him, as reported in the books of Hadith.","relatedTerms":["Ahadith","Shari´ah"],"chapter":1,"discussedOnPages":[11]},{"id":"g-tazir","term":"Ta‘zir","category":"Sources & jurisprudence","definition":"Discretionary punishments not fixed by the texts, set by a judge.","glossaryPage":494,"topicId":"t7.12","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"Punishments not expressly provided in the Holy Qur’ an and Sunnah; awarded by a judge at his own discretion, keeping in mind the severity of the crime.","chapter":7,"discussedOnPages":[165]},{"id":"g-taliq","term":"Ta‘liq","category":"Contracts","definition":"A condition suspending a contract on a future event.","glossaryPage":494,"topicId":"t5.9","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"Conditions which suspend a contract to any future event.","relatedTerms":["Mawquf","Bai‘ al Mu‘allaq"],"chapter":5,"discussedOnPages":[126]},{"id":"g-tamein","term":"Ta’mein","category":"Takaful & social","definition":"Arabic term for insurance (reassurance, guarantee).","glossaryPage":494,"topicId":"t16.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"Arabic word used for insurance.","relatedTerms":["Takaful"],"chapter":16,"discussedOnPages":[420]},{"id":"g-tabarru","term":"Tabarru‘","category":"Takaful & social","definition":"A gratuitous benefit given without return — basis of Takaful contributions; voluntary extra repayment of a loan is Tabarru‘ only if never stipulated or systematised.","glossaryPage":494,"topicId":"t16.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[494]},"extendedDefinition":"Benefits given by a person to another without getting anything in exchange. For example, gracious repayment of debt, absolutely at the lender’s own discretion and without any prior condition or inducement for reward is covered under Tabarru‘. Repaying a loan in excess of the principal and without a precondition is commendable and compatible with the Sunnah of the holy Prophet (pbuh). But it is matter of individual discretion and cannot be adopted as a system, because this would mean that a loan would necessarily yield a profit, making it usurious.","relatedTerms":["Husnal Qadha","Hibah","Qard al Hasan"],"chapter":4,"discussedOnPages":[79]},{"id":"g-tabzir","term":"Tabzir","category":"Ethics","definition":"Spending on explicitly prohibited things, whatever the amount.","glossaryPage":490,"topicId":"t2.5.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[490]},"extendedDefinition":"Spending wastefully on objects which have been explicitly prohibited by the Shar i´ah, irrespective of the amount of expenditure (see also Isr af).","relatedTerms":["Israf"]},{"id":"g-takaful","term":"Takaful","category":"Takaful & social","definition":"Islamic cooperative insurance based on mutual help (Ta‘awun) and joint risk-sharing among participants.","glossaryPage":495,"topicId":"t16.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"A form of Islamic insurance based on the principle of Ta’awon or mutual assistance. It provides for mutual assistance in cases of loss to life, assets and property and offers joint risk-sharing in the event of a loss incurred by one of the pool members.","relatedTerms":["Ta’mein","‘ Aqilah"],"chapter":1,"discussedOnPages":[19]},{"id":"g-taqwa","term":"Taqwa","category":"Ethics","definition":"God-consciousness and righteousness, including care for fellow humans.","glossaryPage":495,"topicId":"t2.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"Piety, virtue a
