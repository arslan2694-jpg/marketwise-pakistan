nd righteousness with a sense of accountability to Allah (SWT). It encompasses not only obedience to Allah, but also the love of fellow human beings, who should be treated as part of an extended human family.","relatedTerms":["Akhlaq","Falah"],"chapter":2,"discussedOnPages":[26]},{"id":"g-tawarruq","term":"Tawarruq","category":"Financing modes","definition":"Buying on credit and selling at spot to a third party to obtain cash.","glossaryPage":495,"topicId":"t13.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"Acquiring cash through trade activities – to buy on credit and sell at spot value with the objective of getting cash, meaning that the trade transaction was not needed by the buyer; he simply wanted liquidity, which he got by purchasing a commodity on credit and selling the same to a third party on cash.","relatedTerms":["Bai‘ al ‘Inah","Murabaha"],"chapter":1,"discussedOnPages":[18]},{"id":"g-thaman","term":"Thaman","category":"Money & exchange","definition":"Price; the monetary counter-value in an exchange.","glossaryPage":495,"topicId":"t6.5.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"Price, monetary value of a commodity in an exchange.","relatedTerms":["Athman","Thaman-e-mithl"],"chapter":2,"discussedOnPages":[28]},{"id":"g-thaman-e-mithl","term":"Thaman-e-mithl","category":"Money & exchange","definition":"Normal market price used when the actual price is in dispute.","glossaryPage":495,"topicId":"t2.3.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"Normal/market price that has to be paid in case any issue arises in deciding the actual price in any transaction.","relatedTerms":["Thaman","Ribh-al-mithl"],"chapter":2,"discussedOnPages":[28]},{"id":"g-ujrah","term":"Ujrah","category":"Leasing & services","definition":"Wage or fee for services (Ijarah of services); requires acceptance by a specified worker, unlike Ju‘alah.","glossaryPage":495,"topicId":"t13.4.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"Wages/service fees against work done for others; Ijarah of services; different from Ju‘alah which means giving a reward for accomplishment of a defined task. While in Ujrah, acceptance of “offer” by a specified person is necessary, in Ju‘alah, anyone who hears the offer can undertake the work and becomes entitled to reward only upon completion of the job.","relatedTerms":["Ijarah","Ajr al-Musammah","Ajr al-Mithl"],"chapter":3,"discussedOnPages":[52,53]},{"id":"g-ujratul-mithl","term":"Ujratul-mithl","category":"Leasing & services","definition":"Market-rate remuneration payable when the underlying contract becomes defective.","glossaryPage":495,"topicId":"t12.4","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"A remuneration or compensation which has to be given as per normal market rate if the underlying contract(s) become voidable.","relatedTerms":["Ujrah","Ribh-al-mithl"],"chapter":4,"discussedOnPages":[80]},{"id":"g-uqood-e-muawadha","term":"Uqood-e-Mu‘awadha","category":"Contracts","definition":"Commutative (exchange) contracts in which a return may be earned: sale, Ijarah, paid Wakalah.","glossaryPage":495,"topicId":"t5.8","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"Commutative contracts in which one can genuinely take any return, like contracts of Bai‘, Ijarah and Wakalah.","relatedTerms":["Uqood Ghair Mu‘awadha"],"chapter":1,"discussedOnPages":[12]},{"id":"g-uqood-ghair-muawadha","term":"Uqood Ghair Mu‘awadha","category":"Contracts","definition":"Non-commutative contracts earning no return: loan, gift, guarantee, assignment of debt.","glossaryPage":495,"topicId":"t5.8","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"Noncommutative contracts wherein one cannot get any return or compensation, like contracts of loan (Qard), gift (Tabarru‘/Hibah), Guarantee (Kafalah) and assignment of debt (Hawalah).","relatedTerms":["Uqood-e-Mu‘awadha"],"chapter":1,"discussedOnPages":[12]},{"id":"g-wad","term":"Wa‘d","category":"Contracts","definition":"A promise; it does not itself create contractual rights and may be binding or non-binding.","glossaryPage":495,"topicId":"t5.6","origin":["f1","f2"],"aliases":["W‘adah"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"Promise – does not create contractual rights and obligations; may be binding or unbinding.","relatedTerms":["‘Ahd","Mithaq"],"chapter":5,"discussedOnPages":[103,104]},{"id":"g-wadiah","term":"Wadi‘ah","category":"Banking","definition":"Deposit held in trust; the custodian is liable only for negligence, but if used with permission it becomes his liability.","glossaryPage":495,"topicId":"t8.5.1","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"A m anah or deposit; the trustee is not responsible for loss except in the case of negligence on his part. If, however, the Am anah amount is used in business, with the permission of the owner, the amount becomes the trustee’s liability.","relatedTerms":["Amanah","Al-Wadi‘ah"],"chapter":5,"discussedOnPages":[119]},{"id":"g-wakalah","term":"Wakalah","category":"Contracts","definition":"Agency contract, with or without fee.","glossaryPage":495,"topicId":"t13.2","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"Contract of agency, can be commutative or noncommutative.","relatedTerms":["Wakalatul Istism ar","Kafalah"],"chapter":1,"discussedOnPages":[18]},{"id":"g-wakalatul-istismar","term":"Wakalatul Istismar","category":"Banking","definition":"Investment agency: the manager earns a pre-agreed fee while investors take all profit or loss.","glossaryPage":495,"topicId":"t13.2.2","origin":["f1","f2"],"aliases":["Wakalatul Istism ar"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"Investment agency – fund management in which the investor gets all the profit or loss while the fund manager gets a pre-agreed service fee or commission that could be a lump sum amount or a certain percentage of the invested capital.","relatedTerms":["Wakalah","Mudarabah"],"chapter":4,"discussedOnPages":[83]},{"id":"g-waqf","term":"Waqf","category":"Takaful & social","definition":"Endowment: property dedicated to charitable or family beneficiaries that cannot be sold, inherited or gifted.","glossaryPage":495,"topicId":"t16.3","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"Retention of a property for the benefit of a charitable or humanitarian objective, or for a specified group of people such as members of the donor’s family. There are three kinds of Waqf in Islamic jurisprudence: religious Waqf, philanthropic Waqf and family Waqf. The Waqf property can neither be sold nor inherited or donated to anyone.","relatedTerms":["Bayt al M al","Zakah/Zakat"],"chapter":5,"discussedOnPages":[104]},{"id":"g-yadan-bi-yadin","term":"Yadan bi-yadin","category":"Money & exchange","definition":"‘Hand to hand’ — spot settlement required in exchanging Ribawi goods.","glossaryPage":495,"topicId":"t3.2.1.d","origin":["f1","f2"],"aliases":["Yadam-bi-yadin"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"Hand to hand or on the spot (in exchange transactions).","relatedTerms":["Saw´am-bi-sawaa´","Mithlam-bi-mithlin"],"chapter":3,"discussedOnPages":[53]},{"id":"g-zakah","term":"Zakah","category":"Takaful & social","definition":"Obligatory annual levy on wealth above Nisab, distributed to the eight Qur’anic categories (9:60) including the poor and needy.","glossaryPage":495,"topicId":"t2.5.2","origin":["f1","f2"],"aliases":["Zakah/Zakat"],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[495]},"extendedDefinition":"Zakah is the third out of five pillars of Islam. A religious tax on Muslims having wealth over and above an exemption limit (Nisab) at a rate fixed by the Shar i´ah. As such, it is not a tax on income, but on the assets held by a Muslim at a prescribed date (a Zakat day has to be determined for calculation of Zakat money to be paid annually) over and above the amount of Nisab after fulfilment of the normal needs of the owner. The objective is to take away a part of the wealth of the well-to-do and to distribute it among the poor and the needy. It is levied on cash, cattle, agricultural produce, minerals, capital invested in industry and business, etc. The rates are different for different natures of assets. The recipients of Zakah funds have been identified in the Holy Qur’ an (9: 60) and are the poor, the needy, Zakah collectors, new converts to Islam, travellers in difficulty, captives and debtors and for the cause of the Almighty.","relatedTerms":["Waqf","Gharmeen"],"chapter":1,"discussedOnPages":[12]},{"id":"g-zulm","term":"Zulm","category":"Ethics","definition":"Injustice — usurping others' rights or denying fair recompense.","glossaryPage":496,"topicId":"t3.3.5","origin":["f1","f2"],"aliases":[],"source":{"book":"Understanding Islamic Finance (Ayub)","section":"Glossary","pages":[496]},"extendedDefinition":"Injustice, usurping others’ rights, not giving proper recompense in an exchange by way of any illegal act or coercion.","relatedTerms":["Qisas"],"chapter":3,"discussedOnPages":[55]}]);

IFL_DATA.register("concepts", [{"id":"riba","name":"Riba","group":"Prohibitions","tags":["riba","riba-nasiah","riba-fadl"],"oneLine":"Any stipulated increase over the principal of a loan or debt, or excess/delay in exchanging like Ribawi goods, without counter-value.","points":["Riba al-Nasiah (loans/debts, delay) and Riba al-Fadl (excess in hand-to-hand exchange of the same genus).","Rate, purpose (consumption/production) and debtor's wealth are irrelevant.","Modern bank interest falls under Riba al-Nasiah."],"distinction":"Profit in sale is a return on goods with risk; Riba is a return on money/debt without risk.","trigger":"Any question on ‘Is bank interest Riba?’, loans with benefit, indexation or late-payment increases.","topicIds":["t3.2.1","t3.2.1.d","t3.2.1.e","t7.3","t17.3.1"],"origin":["f1","f2"],"aliases":[],"stage":"prohibitions","chapter":3,"altNames":["Riba (Interest)"]},{"id":"gharar","name":"Gharar","group":"Prohibitions","tags":["gharar","jahl","khatar"],"oneLine":"Excessive uncertainty about essential elements of a contract — subject matter, price, delivery — that exposes one party to undue loss.","points":["Examples: selling fish in water, a bird in the air, unborn animals, undeliverable goods.","Minor, unavoidable uncertainty is tolerated.","Invalidates commutative (exchange) contracts."],"distinction":"Gharar is uncertainty in the contract; business risk (price may rise or fall) is acceptable and necessary for profit.","trigger":"Insurance, forward sales, undefined specifications, derivatives, option-style contracts.","topicIds":["t3.2.2","t4.2.2","t6.7"],"origin":["f1","f2"],"aliases":[],"stage":"prohibitions","chapter":3,"altNames":["Gharar (Uncertainty)"]},{"id":"maisir","name":"Maisir / Qimar","group":"Prohibitions","tags":["maisir","qimar"],"oneLine":"Gambling and games of chance: gain that depends purely on chance and comes at another party's loss.","points":["Named after an ancient Arabian arrow game.","Qimar: one party gains exactly what the other loses on an uncertain event.","Conventional insurance and speculative derivatives are criticised for it."],"distinction":"Risk-taking in real business creates value; Maisir transfers wealth by chance.","trigger":"Lotteries, prize bonds, speculative derivatives, conventional insurance.","topicIds":["t3.2.3","t4.2.3","t16.2.1"],"origin":["f1","f2"],"aliases":["maisir-qimar"],"stage":"prohibitions","chapter":3,"altNames":["Maisir/Qimar (Gambling)"]},{"id":"bai","name":"Bai‘ (Sale)","group":"Sale-based modes","tags":["bai","credit-sale","trust-sales"],"oneLine":"Exchange of a thing of value for another by mutual consent — the principal lawful alternative to Riba.","points":["Seller must own and possess (actually or constructively) what he sells.","Price and object must be known; one price fixed at contract.","Credit price may exceed cash price."],"distinction":"Sale transfers ownership and risk of goods; a loan transfers money to be returned.","trigger":"‘Allah has permitted trade and forbidden Riba’ (2:275); validity of Murabaha and credit sales.","topicIds":["t6.2","t6.3.1","t6.5","t6.5.3"],"origin":["f1","f2"],"aliases":["bai-exchange"],"stage":"contracts","chapter":6,"altNames":["Bai' (Exchange of Values)"]},{"id":"murabaha","name":"Murabaha / MPO","group":"Sale-based modes","tags":["murabaha","mpo","rollover","musawamah"],"oneLine":"Sale at disclosed cost plus agreed profit; banks use Murabaha to Purchase Orderer with the client's promise to buy.","points":["Bank must own and bear the risk of the goods before selling.","Price fixed once; no increase on late payment (penalty to charity).","No rollover or buy-back."],"distinction":"Murabaha discloses cost; Musawamah bargains on price without disclosing cost.","trigger":"Working capital and trade finance; controls against back-door interest.","topicIds":["t9.3","t9.6","t9.8","t9.8.3","t9.9.1","t9.10","t14.3.4"],"origin":["f1","f2"],"aliases":[],"stage":"modes","chapter":9,"altNames":["Murabaha"]},{"id":"salam","name":"Salam","group":"Sale-based modes","tags":["salam","parallel-salam"],"oneLine":"Forward sale with full price paid in advance for precisely specified fungible goods delivered on a fixed date.","points":["Exception to ‘sell what you own’, allowed by the Prophet (pbuh).","Not for gold, silver or currencies against each other.","Parallel Salam must be independent of the first contract."],"distinction":"Salam: full prepayment, fungible goods. Istisna‘a: manufactured goods, flexible payment.","trigger":"Agricultural and working capital finance; Salam Sukuk tradability.","topicIds":["t10.2","t10.4.1","t10.4.2","t10.6","t10.10"],"origin":["f1","f2"],"aliases":[],"stage":"modes","chapter":10},{"id":"istisna","name":"Istisna‘a","group":"Sale-based modes","tags":["istisna","parallel-istisna"],"oneLine":"Order to manufacture or construct an asset to specification, with advance, deferred or instalment payment.","points":["Price and specifications must be fixed.","Parallel Istisna‘a lets banks subcontract construction.","Shart-e-Jazai: price reduction for delay benefits the buyer."],"distinction":"Istisna‘a need not be prepaid; Salam must be.","trigger":"Project, house and infrastructure finance.","topicIds":["t10.11","t10.11.3","t10.11.4","t10.11.7","t10.11.10"],"origin":["f1","f2"],"aliases":["istisnaa"],"stage":"modes","chapter":10,"altNames":["Istisna'a"]},{"id":"ijarah","name":"Ijarah","group":"Lease-based modes","tags":["ijarah","conventional-leasing"],"oneLine":"Sale of a known usufruct of a non-consumable asset for a set period against agreed rent; ownership and its risk remain with the lessor.","points":["Rent due only once the usable asset is delivered.","Lessor bears ownership costs and loss without lessee fault.","Floating rent allowed for future periods with the first fixed."],"distinction":"Ijarah transfers usufruct; sale transfers ownership. Money cannot be leased.","trigger":"Auto/house leasing, sovereign Sukuk, rent benchmarks.","topicIds":["t11.1","t11.2","t11.3","t11.3.2","t11.3.5","t11.4.4"],"origin":["f1","f2"],"aliases":[],"stage":"modes","chapter":11},{"id":"imbt","name":"Ijarah Muntahia-bi-Tamleek","group":"Lease-based modes","tags":["imbt"],"oneLine":"Lease ending in transfer of ownership through a separate unilateral promise to sell or gift.","points":["Lease and sale/gift are separate contracts.","Sale and lease-back: exceptional, sale first, about one-year gap.","AAOIFI 8/8 refund if transfer becomes impossible without lessee fault."],"distinction":"Unlike hire-purchase, rent accrues only from delivery and the bank bears ownership risk.","trigger":"Comparisons with conventional finance leases.","topicIds":["t11.5","t11.5.1","t11.4.5"],"origin":["f1","f2"],"aliases":["ijarah-muntahia-bi-tamleek"],"stage":"modes","chapter":11},{"id":"shirkah","name":"Shirkah","group":"Partnership modes","tags":["shirkah","shirkatulmilk","shirkatulaqd","shirkah-al-inan","pls","risk-sharing"],"oneLine":"Partnership combining capital, labour or creditworthiness to share profit as agreed and loss by ownership.","points":["Shirkatulmilk (ownership) vs Shirkatul‘aqd (contract).","‘Inan and Mudarabah are accepted by all jurists.","Profit by agreement, loss by capital."],"distinction":"Partners bear business risk; creditors do not.","trigger":"PLS modes, ‘most preferable’ modes, joint stock companies.","topicIds":["t12.2","t12.2.1","t12.2.2","t12.3.4"],"origin":["f1"],"aliases":[]},{"id":"musharakah","name":"Musharakah","group":"Partnership modes","tags":["musharakah","running-musharakah"],"oneLine":"All partners contribute capital and may manage; profit shared by agreed ratio, loss strictly by capital ratio.","points":["No guarantee of capital or profit by a co-partner.","Security only against negligence or misconduct.","Buy-out at market value, not at face value."],"distinction":"Musharakah: all contribute capital. Mudarabah: capital from one side only.","trigger":"Profit and loss sharing calculations; running Musharakah.","topicIds":["t12.3","t12.3.2","t12.3.4","t12.3.5","t12.7.2"],"origin":["f1","f2"],"aliases":[],"stage":"modes","chapter":12},{"id":"mudarabah","name":"Mudarabah","group":"Partnership modes","tags":["mudarabah","two-tier-mudarabah","deposit-pool"],"oneLine":"Capital from the Rabbul-mal, management by the Mudarib; profit shared as agreed, financial loss borne by the capital owner.","points":["Debt cannot be Mudarabah capital.","Mudarib is a trustee, liable only for negligence or breach.","Basis of Islamic bank deposit pools."],"distinction":"Mudarib earns a profit share, not a fee (unlike Wakalatul Istismar).","trigger":"Deposit side of Islamic banks; Mudarabah Sukuk; Takaful models.","topicIds":["t12.4","t12.4.1","t12.4.4","t12.5","t12.7.1","t8.5.2"],"origin":["f1","f2"],"aliases":[],"stage":"modes","chapter":12},{"id":"diminishing-musharakah","name":"Diminishing Musharakah","group":"Partnership modes","tags":["diminishing-musharakah","musha"],"oneLine":"Joint ownership in which the financier's units are progressively bought by the client, often with rent on the financier's share.","points":["Partnership, lease and sale are separate contracts.","Pre-agreed unit price allowed only in Shirkatulmilk.","Rent falls as units are purchased."],"distinction":"In trade (Shirkatul‘aqd) DM units must be sold at market value.","trigger":"Housing finance; Box 12.5 schedule.","topicIds":["t12.8","t12.9","t12.9.2"],"origin":["f1","f2"],"aliases":[],"stage":"modes","chapter":12},{"id":"wakalah","name":"Wakalah","group":"Accessory contracts","tags":["wakalah","fund-management"],"oneLine":"Agency: the agent acts for the principal as a trustee, with or without fee; ownership passes directly to the principal.","points":["Used in Murabaha, Salam, Istisna‘a, Ijarah and fund management.","Agent cannot delegate without consent or self-deal without disclosure.","Wakalatul Istismar: fixed fee regardless of results."],"distinction":"Wakil earns a fee; Mudarib earns a profit share.","trigger":"Agency in MPO; Takaful Wakalah model.","topicIds":["t13.2","t13.2.2","t9.8.3"],"origin":["f1","f2"],"aliases":[],"stage":"modes","chapter":13,"altNames":["Wakalah (Agency)"]},{"id":"tawarruq","name":"Tawarruq","group":"Accessory contracts","tags":["tawarruq"],"oneLine":"Buying a commodity on credit and selling it at spot to a third party to obtain cash.","points":["Differs from ‘Inah: sale to a third party, not the original seller.","Invalid if the client acts as bank's agent to buy and sell to himself.","Scholars advise limiting it to unavoidable corporate liquidity needs."],"distinction":"Tawarruq: third-party sale (preferred view permits). ‘Inah: buy-back (prohibited).","trigger":"Commodity Murabaha, personal finance, credit cards.","topicIds":["t13.3","t13.3.1","t6.11"],"origin":["f1","f2"],"aliases":[],"stage":"modes","chapter":13},{"id":"inah","name":"Bai‘ al ‘Inah","group":"Prohibitions","tags":["inah","hiyal"],"oneLine":"Sale and buy-back at different prices, producing a loan with interest — a legal ruse rejected by the majority.","points":["Used in some Malaysian Sukuk and cards.","OIC Fiqh Council and majority reject it.","Scholars impose time gaps in sale and lease-back to avoid it."],"distinction":"Sale and lease-back is allowed if the sale is complete and repurchase is delayed.","trigger":"Critiques of Sukuk, credit cards, Murabaha buy-back.","topicIds":["t6.11","t9.9.1","t15.3.4"],"origin":["f1"],"aliases":[]},{"id":"jualah","name":"Ju‘alah","group":"Accessory contracts","tags":["jualah","juala"],"oneLine":"A known reward promised to whoever achieves a specified result; nothing is due without the result.","points":["Suits uncertain work (debt recovery, finding lost property).","Offeror revoking after work starts owes a reasonable wage.","Parallel Ju‘alah allowed if independent."],"distinction":"Ju‘l is result-based; Ujrah is time-based.","trigger":"Debt collection, brokerage, feasibility services.","topicIds":["t13.4","t13.4.1","t13.4.5"],"origin":["f1","f2"],"aliases":["juaalah"],"stage":"modes","chapter":13,"altNames":["Ju'alah"]},{"id":"wad","name":"Wa‘d (Promise)","group":"Principles","tags":["wad","promise","hamish-jiddiyah"],"oneLine":"A unilateral promise, binding in commercial dealings by contemporary consensus; breach makes the promisor liable for actual loss.","points":["Bilateral binding promises are treated like contracts and restricted.","Hamish Jiddiyah secures the promise.","Used in MPO, IMBT, DM and FX cover."],"distinction":"A promise is not a contract; the sale must be executed separately.","trigger":"Binding promise to purchase; forward FX cover.","topicIds":["t5.6","t5.6.1","t9.8.2"],"origin":["f1","f2"],"aliases":["wadah-promise"],"stage":"contracts","chapter":5,"altNames":["Wa'dah (Promise)"]},{"id":"qard","name":"Qard / Qard al Hasan","group":"Principles","tags":["qard","qard-hasan","qard-al-hasan","salaf","dayn","ariyah"],"oneLine":"A loan repayable in the same kind and amount; any stipulated benefit is Riba, so every loan must be benevolent.","points":["Loans are non-commutative, virtuous acts.","Voluntary extra at repayment (Husnal Qadha) is fine if not stipulated or systematised.","Current accounts are loans to the bank."],"distinction":"Qard: fungible, returned in kind. ‘Ariyah: the same item returned.","trigger":"Current accounts, microfinance, rebates and prepayment.","topicIds":["t7.2","t7.5","t7.7","t7.11"],"origin":["f1","f2"],"aliases":["qard-hasan"],"stage":"contracts","chapter":7,"altNames":["Qard Hasan (Benevolent Loan)"]},{"id":"time-value","name":"Time value of money","group":"Principles","tags":["time-value"],"oneLine":"Recognised in pricing goods and usufruct in genuine exchange, but not as a return on loans or debts.","points":["Credit price may exceed cash price if fixed at contract.","Salam price is below spot price.","Nothing may be added once a debt exists."],"distinction":"Mark-up in trade ≠ interest on debt.","trigger":"‘Islamic banks charge interest by another name’ critiques.","topicIds":["t4.6","t6.5.3","t7.8","t17.3.4"],"origin":["f1"],"aliases":[]},{"id":"kharaj-daman","name":"Al-Kharaj bil Daman / Al-Ghunm bil Ghurm","group":"Principles","tags":["kharaj-daman","daman"],"oneLine":"Gain goes with liability for loss: profit is legitimate only for one who bears risk or responsibility.","points":["Basis of profit sharing in Shirkah.","Explains why lenders cannot earn and lessors can.","Underlies ‘no guarantee of capital’ in partnerships."],"distinction":"Rent is earned because the lessor keeps ownership risk; interest has no such risk.","trigger":"Justifying Islamic returns vs interest.","topicIds":["t4.2.6","t5.5.7"],"origin":["f1"],"aliases":[]},{"id":"bai-sarf","name":"Bai‘ al-Sarf (currency exchange)","group":"Principles","tags":["bai-sarf","forex"],"oneLine":"Exchange of monetary units must be spot, and equal in amount if of the same kind.","points":["Forward FX sale is not allowed; unilateral promise for genuine needs is.","Constructive possession includes account credits.","Spot FX may settle within two days at the deal rate."],"distinction":"Currencies are Ribawi; goods are not.","trigger":"Forex dealings, forward cover, currency settlement of debts.","topicIds":["t3.2.1.d","t4.7.2","t8.8.7","t14.4.5"],"origin":["f1"],"aliases":[]},{"id":"bai-dayn","name":"Bai‘ al Dayn (sale of debt)","group":"Prohibitions","tags":["bai-dayn","bai-al-dayn","hawalah"],"oneLine":"Sale of debt at other than face value is Riba according to the majority; debts may be assigned at par (Hawalah).","points":["Shafi‘is allowed debt sale only at par.","OIC Fiqh Council unanimously prohibits discounted debt sale.","Debt-based Sukuk trade only at face value."],"distinction":"Hawalah is assignment with recourse at par; sale is without recourse.","trigger":"Bill discounting, Murabaha receivables, Sukuk trading.","topicIds":["t6.10","t7.14","t7.16","t15.3.4"],"origin":["f1","f2"],"aliases":["bai-al-dayn"],"stage":"prohibitions","chapter":7,"altNames":["Bai' al Dayn (Sale of Debt)"]},{"id":"late-payment-penalty","name":"Penalty on default","group":"Principles","tags":["late-payment-penalty","penalty","default"],"oneLine":"Defaulters may be made to pay a charity undertaking; the bank cannot take it as income or increase the debt.","points":["Distinguish wilful defaulters from genuine hardship.","Qard: give more time; Dayn: penalty for negligent delay.","OIC Fiqh Council: void if failure was beyond control or caused no loss."],"distinction":"Penalty to charity ≠ interest to bank.","trigger":"Default management; criticism of penalties.","topicIds":["t7.13","t9.9.4","t17.4.4"],"origin":["f1"],"aliases":[]},{"id":"sukuk","name":"Sukuk","group":"Banking & markets","tags":["sukuk","ijarah-sukuk","securitization","spv","tradability","mixed-portfolio"],"oneLine":"Certificates of equal value representing undivided ownership of tangible assets, usufruct, services or project assets.","points":["Ownership Sukuk trade at market price; debt Sukuk only at par.","Returns: variable (Shirkah) or quasi-fixed (Ijarah).","Issuer may not guarantee capital or fixed profit."],"distinction":"Sukuk ≠ bonds (ownership, not debt) ≠ shares (specified assets, fixed term).","trigger":"Capital markets, sovereign finance, liquidity management.","topicIds":["t15.3","t15.3.4","t15.3.5.b","t15.3.6","t15.3.7","t11.5.3"],"origin":["f1","f2"],"aliases":[],"stage":"markets","chapter":15},{"id":"takaful","name":"Takaful","group":"Takaful & social","tags":["takaful","tabarru","waqf","family-takaful","retakaful","aqilah","insurance"],"oneLine":"Cooperative cover in which participants donate to a fund that compensates members' defined losses; surplus belongs to participants.","points":["Replaces insurance's Riba, Gharar and Maisir with Tabarru‘.","Models: Wakalah, Mudarabah, Waqf/Wakalah–Waqf (preferred).","Operator should not be a risk-taker."],"distinction":"Insurer owns underwriting surplus; Takaful participants do.","trigger":"Insurance prohibition; Takaful models; Ijarah Takaful costs.","topicIds":["t16.2.1","t16.3","t16.4","t16.4.1","t16.5"],"origin":["f1","f2"],"aliases":[],"stage":"markets","chapter":16},{"id":"islamic-banking","name":"Islamic banking","group":"Banking & markets","tags":["islamic-banking","intermediation","banking","mode-preference","mode-selection","universal-banking"],"oneLine":"Financial intermediation through trade, leasing and partnership, dealing in goods rather than money, under Shari’ah governance.","points":["Deposits: current (Qard), savings/investment (Mudarabah), Wakalah.","Assets: Murabaha, Ijarah, Salam, Istisna‘a, Musharakah, DM.","Faces additional asset, market and Shari’ah risks."],"distinction":"Not merely ‘interest-free’: a business model based on real assets and risk.","trigger":"Structure of Islamic banks, deposit pools, theory vs practice.","topicIds":["t4.1","t8.5","t8.5.1","t8.5.2","t8.6","t14.3.2"],"origin":["f1","f2"],"aliases":["islamic-banking-overview"],"stage":"markets","chapter":8,"altNames":["Islamic Banking Structure"]},{"id":"shariah-governance","name":"Shari’ah governance","group":"Banking & markets","tags":["shariah-governance","shariah-audit","standard-setters","standardisation"],"oneLine":"Shari’ah boards, internal controls and audits that ensure products and operations comply with Shari’ah.","points":["AAOIFI: board of at least three scholars; binding Fatwas.","Controls for Murabaha, Ijarah, DM and investments.","SBP framework: central board, bank advisors, annual Shari’ah audit."],"distinction":"Approving a product is not enough — boards must supervise implementation.","trigger":"Internal controls, credibility, regulatory frameworks.","topicIds":["t14.3.4","t14.appx","t18.3.2.c"],"origin":["f1"],"aliases":[]},{"id":"islamic-economics","name":"Islamic economics","group":"Foundations","tags":["islamic-economics","maqasid","distributive-justice","falah","ownership","zakat","hisbah"],"oneLine":"The study of economic behaviour guided by Shari’ah objectives — justice, welfare (Falah) and trusteeship of resources.","points":["Resources belong to Allah; humans are trustees.","Maqasid: protect faith, life, intellect, progeny, wealth.","Restrained freedom with state role (Hisbah)."],"distinction":"Differs from neoclassical economics in its value framework and distributive goals.","trigger":"Philosophy questions; why Islamic finance matters.","topicIds":["t2.2.2","t2.4.1","t2.5","t2.5.1","t2.5.2","t1.8"],"origin":["f1","f2"],"aliases":["islamic-economic-system"],"stage":"foundations","chapter":2,"altNames":["Islamic Economic System"]},{"id":"khiyar","name":"Khiyar (options)","group":"Principles","tags":["khiyar"],"oneLine":"Rights to annul a contract: of session, stipulation, defect, inspection, description, overpricing and payment.","points":["Khiyar al-Majlis until the parties separate.","Khiyar al-Shart for an agreed period.","Khiyar al-‘Aib for defects."],"distinction":"Options protect consent; they are not conventional financial options.","trigger":"Sale contract validity; Murabaha options.","topicIds":["t6.12","t9.9.2"],"origin":["f1","f2"],"aliases":["khiyar-options"],"stage":"contracts","chapter":6,"altNames":["Khiyar (Options in Sales)"]},{"id":"aqd","name":"‘Aqd (contract) and validity","group":"Principles","tags":["aqd","contract-validity","commutative-contracts","two-contracts","general-permissibility"],"oneLine":"A contract requires offer and acceptance, competent parties and a lawful, known, deliverable subject matter; contracts may be valid, voidable or void.","points":["Valid (Sahih), voidable (Fasid), void (Batil).","Two mutually contingent contracts in one are prohibited.","Everything is permissible unless prohibited (Ibahatul Asliyah)."],"distinction":"Commutative contracts may earn returns; non-commutative (loan, gift, guarantee) may not.","trigger":"Structuring products with several contracts.","topicIds":["t5.3","t5.4","t5.5","t5.5.5","t5.7","t5.8"],"origin":["f1","f2"],"aliases":["contract-elements"],"stage":"contracts","chapter":5,"altNames":["Elements of a Contract"]},{"id":"debt-equity","name":"Debt vs equity finance","group":"Foundations","tags":["debt","risk-sharing","asset-backing","fixed-return"],"oneLine":"Islamic finance allows debt through sale and lease but prefers risk-sharing equity; debt must never grow once created.","points":["Debt-creating modes: Murabaha, Salam, Istisna‘a, Ijarah.","Participatory modes: Musharakah, Mudarabah.","Preference is not the same as permissibility."],"distinction":"Conventional debt earns interest; Islamic debt arises from real sales with a fixed price.","trigger":"‘Murabaha syndrome’ and theory–practice debate.","topicIds":["t4.3","t1.2","t17.3.7","t17.4.1"],"origin":["f1"],"aliases":[]},{"id":"money","name":"Money and monetary policy","group":"Foundations","tags":["money","money-creation","monetary-policy","fictitious-assets","indexation","inflation","reserve-currency"],"oneLine":"Money is a medium of exchange and measure of value, not a commodity to rent; its creation should match real-sector growth.","points":["Paper money is treated like gold/silver for Riba rules.","No indexation of loans for inflation.","Author: fictitious money creation drives injustice."],"distinction":"Money cannot be leased because it is consumed in use.","trigger":"Inflation, indexation and policy agenda questions.","topicIds":["t4.7","t4.7.1","t4.7.3","t7.17","t17.3.3","t18.2"],"origin":["f1"],"aliases":[]},{"id":"benchmark","name":"Benchmarks (LIBOR/KIBOR)","group":"Banking & markets","tags":["benchmark"],"oneLine":"Interest-rate benchmarks may be used only as a pricing tool for goods and usufruct; Islamic benchmarks remain a future agenda.","points":["First-period Ijarah rent fixed; later periods benchmarked with cap and floor.","Use does not make the contract interest-based.","Real benchmarks need sovereign Islamic instruments."],"distinction":"Benchmark is a reference, not the contract's subject.","trigger":"‘No difference from conventional banking’ criticism.","topicIds":["t4.2.5","t11.3.2","t17.4.3","t18.3.3"],"origin":["f1"],"aliases":[]},{"id":"liquidity","name":"Liquidity management","group":"Banking & markets","tags":["liquidity","interbank"],"oneLine":"Managing surplus and shortage without interest: interbank Mudarabah, Sukuk trading, asset pools, Parallel Salam, and (as last resort) Tawarruq.","points":["Sukuk sold outright, not repo.","Pools with less than 50% receivables.","Proposed Islamic lender-of-last-resort facilities."],"distinction":"Commodity Murabaha is a grey area; Sukuk are preferable.","trigger":"Treasury and central bank questions.","topicIds":["t8.8.5","t14.4.4","t13.3.1","t18.3.3"],"origin":["f1"],"aliases":[]},{"id":"screening","name":"Equity screening and purification","group":"Banking & markets","tags":["screening","purification","stocks","shares","islamic-funds"],"oneLine":"Shares may be held if the business is Halal and financial ratios are within limits; impure income is given to charity.","points":["Exclude alcohol, pork, gambling, interest-based finance.","Ratios: interest income ≤5%, leverage ≤10–33%, illiquid assets ≥10–33%.","Liquid-capital shares trade only at par."],"distinction":"Purification cleanses dividends; it does not permit prohibited businesses.","trigger":"Islamic funds and stock investment.","topicIds":["t8.8.1","t8.8.2","t12.6","t14.3.4"],"origin":["f1"],"aliases":[]},{"id":"criticism","name":"Criticism and responses","group":"Foundations","tags":["criticism","credibility","islamic-windows"],"oneLine":"Common objections — ‘no real difference’, Murabaha syndrome, benchmarks, fixed returns, penalties — and the author's responses and concessions.","points":["Debt modes are permissible; PLS preferable.","Benchmarks are pricing tools.","Author concedes concerns on Sukuk fixed returns and socio-economic impact."],"distinction":"Distinguish the criticism, the author's response and open issues.","trigger":"‘Critically evaluate’ questions.","topicIds":["t17.2","t17.3.7","t17.4.1","t17.4.3","t17.4.6"],"origin":["f1"],"aliases":[]},{"id":"qabd","name":"Qabd (possession)","group":"Principles","tags":["qabd"],"oneLine":"A seller must own and possess the goods, physically or constructively, before selling them; possession means their risk and control have passed to him.","points":["Constructive (Hukmi) possession suffices: the goods are at the possessor’s risk and he can take delivery at will.","Sale before ownership is void; before that, only a promise to sell is allowed.","Short-selling and resale before possession are invalid."],"distinction":"Ownership (title) and possession (risk and control) are separate tests; Murabaha needs both before the sale to the client.","trigger":"Murabaha, MPO and resale questions; “can the bank sell goods it has ordered but not received?”","topicIds":["t5.4.2","t6.5.1","t9.2","t9.8.3"],"origin":["f1"],"aliases":[]},{"id":"arbun","name":"Hamish Jiddiyah and ‘Arbun","group":"Principles","tags":["arbun"],"oneLine":"Hamish Jiddiyah is security money taken before a sale to show seriousness; ‘Arbun is earnest money paid at execution as part of the price.","points":["Hamish Jiddiyah is held in trust: adjusted in the price, or only the actual loss is deducted if the promise is broken.","‘Arbun: the Hanbalis allow it; the OIC Fiqh Council and AAOIFI accept it with a specified time limit; AAOIFI prefers refunding the excess over actual loss.","Cost of funds is not part of actual loss."],"distinction":"Timing: Hamish Jiddiyah comes before the sale is executed; ‘Arbun at or after execution, as part of the price.","trigger":"Promise to purchase broken; downpayments in Murabaha, Istisna‘a or Ijarah; ‘Arbun-based options.","topicIds":["t5.6.1","t6.9","t10.11.3","t8.8.8"],"origin":["f1"],"aliases":[]},{"id":"security","name":"Kafalah and Rahn (security)","group":"Accessory contracts","tags":["kafalah","rihn","collateral"],"oneLine":"Kafalah is suretyship by a third party for a debt; Rahn (Rihn) is a pledge of the debtor’s asset held by the creditor in trust.","points":["A pledged asset stays the pledger’s: its gains and losses are his, and it cannot be appropriated in lieu of the debt.","On default it may be sold through the court or an irrevocable power of attorney, with any excess returned.","Guarantees are gratuitous: fees may cover expenses only, amount-based not time-based; a called guarantee recovers principal only."],"distinction":"Security protects recovery of what is owed; it never justifies taking more than the debt, and in PLS it covers only negligence or breach.","trigger":"Collateral questions; Salam security; L/G fees; “Islamic banks take collateral like conventional banks”.","topicIds":["t7.15","t10.5","t5.8","t14.6","t17.4.3"],"origin":["f1","f2"],"aliases":["kafalah","rahn"],"stage":"contracts","chapter":7,"altNames":["Kafalah (Guarantee)","Rahn (Pledge/Collateral)"]},{"id":"ijtihad","name":"Sources and Ijtihad","group":"Foundations","tags":["ijtihad","shariah"],"oneLine":"The Qur’an and Sunnah are primary sources; Ijma‘a and Qiyas are secondary, reached by Ijtihad — scholarly effort to solve new problems in their light.","points":["Juristic tools include Maslaha-e-Mursalah (general welfare) and ‘Urf (custom).","Ibahatul Asliyah: in dealings, whatever is not expressly prohibited is permissible.","Ijtihad cannot override a clear text (Nass) and must serve the Maqasid."],"distinction":"Ijtihad provides flexibility within the Shari’ah; it does not turn divine law into man-made law or license a Fatwa for every conventional product.","trigger":"Different interpretations, standardisation, indexation, “why can’t scholars just allow it?”","topicIds":["t2.2.1","t17.3.6","t18.3.2","t17.3.3"],"origin":["f1"],"aliases":[]},{"id":"mal","name":"Mal, ‘Ain and Dayn (property)","group":"Principles","tags":["mal","ain-dayn","mithli-qimi"],"oneLine":"Mal is anything of value that can be possessed and lawfully used; property is either specific (‘Ain) or an obligation (Dayn), and fungible (Mithli) or non-fungible (Qimi).","points":["Money is Thaman (price), not Mabi‘ (subject of sale).","Owning an asset includes its usufruct, but owning usufruct does not include the asset (as in Ijarah).","Mithli goods suit Salam; Qimi goods suit Istisna‘a."],"distinction":"‘Ain can be sold at any agreed price; Dayn (a debt) can be transferred only at face value.","trigger":"What may be sold, leased or used in Salam; sale of debt; intangible rights.","topicIds":["t5.2","t10.4.1","t10.11.2"],"origin":["f1","f2"],"aliases":["mal-usufruct-ownership"],"stage":"contracts","chapter":5,"altNames":["Mal, Usufruct and Ownership"]},{"id":"ib-risks","name":"Risks specific to Islamic banks","group":"Banking & markets","tags":["risk-management","risk"],"oneLine":"Beyond normal banking risks, Islamic banks face asset, market and Shari’ah non-compliance risk, and greater rate-of-return, fiduciary, legal and withdrawal risk.","points":["A Murabaha receivable cannot rise when market rates rise (rate-of-return risk).","Non-compliance sends income to charity and brings reputational and withdrawal risk.","Risks may be mitigated (promises, Parallel Salam, Takaful, security) but not shifted where the Shari’ah assigns them to the bank."],"distinction":"Risk management is allowed; transferring risk to another party without transferring the related reward is not.","trigger":"“Islamic banks take no risk”, securitisation risk analysis, Ijarah asset loss.","topicIds":["t4.2.9","t10.10.1","t11.5.2","t15.3.3","t17.4.3"],"origin":["f1"],"aliases":[]},{"id":"derivatives","name":"Derivatives","group":"Banking & markets","tags":["derivatives"],"oneLine":"Conventional derivatives rest on debts and rights rather than delivery; options give a right without obligation and have no direct Islamic equivalent.","points":["Some suggest ‘Arbun-based call options; reverse ‘Arbun puts are rejected by Al-Dharir.","Options on currencies, interest rates and indices have no place in Islamic finance.","Salam, Istisna‘a and Parallel Salam are only imperfect hedging substitutes."],"distinction":"Islamic hedging uses real contracts with delivery; speculative instruments priced on chance are Gharar and Maisir.","trigger":"Hedging, forward FX cover, “why is there no Islamic option?”","topicIds":["t8.8.8","t4.2.2","t14.4.5"],"origin":["f1"],"aliases":[]},{"id":"business-ethics","name":"Business ethics","group":"Foundations","tags":["business-ethics","najash","dharar","shufah","fair-pricing","transparency","ethics"],"oneLine":"Giving everyone their due is the cardinal principle: justice, honesty, disclosure of defects and freedom from harm (Dharar) in all dealings.","points":["Prohibited: Najash (bidding up without intent to buy), Khalabah (misleading marketing), Ghaban (defrauding on specifications or price).","Deceiving an unknowing market entrant (Mustarsal) is described as Riba.","Contracts must not harm third parties; Shuf‘ah (a partner’s pre-emptive right) is an example."],"distinction":"Legal validity is not enough; a transaction must also be fair, transparent and free of exploitation.","trigger":"Fair pricing, disclosure, market manipulation, Islamic bank codes of conduct.","topicIds":["t3.3","t3.3.1","t3.3.5","t18.3.2"],"origin":["f1","f2"],"aliases":[],"stage":"foundations","chapter":3,"altNames":["Business Ethics and Norms"]},{"id":"hawalah","name":"Hawalah (assignment of debt)","group":"Accessory contracts","tags":["hawalah"],"oneLine":"Transfer of a debt from one debtor to another, freeing the original debtor; it is gratuitous, at face value and immediate.","points":["Cheques, drafts, pay orders and bills of exchange are forms of Hawalah; Suftajah was the classical remittance form.","No remuneration for Hawalah itself; the majority hold the debt returns to the assignor if the assignee dies or goes bankrupt.","A debt can be transferred only at face value and with recourse — the basis for replacing bill discounting."],"distinction":"Hawalah is transfer with recourse at par; a sale of debt is without recourse and, at a discount, is Riba.","trigger":"Bill discounting, trading receivables or Murabaha Sukuk, remittances.","topicIds":["t7.14","t6.10","t5.8","t8.8.4","t15.2"],"origin":["f1","f2"],"aliases":[],"stage":"contracts","chapter":7},{"id":"maqasid","name":"Maqasid al-Shari’ah","group":"Foundations","tags":["maqasid"],"oneLine":"The objectives of the Shari’ah: people’s well-being in this world and the Hereafter, through protecting religion, life, progeny, property, intellect and honour.","points":["Secondary objectives start with justice and equity, then social security and peace.","Wealth is a trust (stewardship) to be accounted for; protection of property underpins the law of transactions.","A contract must conform to the Maqasid, not only to the letter of the rules."],"distinction":"Formal compliance satisfies the rules; Maqasid ask whether the outcome serves justice and welfare.","trigger":"Form versus substance, socio-economic impact of Islamic banking, Siddiqi’s call to redefine “Shari’ah-compliant”.","topicIds":["t2.2.2","t5.5","t17.4.6","t18.3.3"],"origin":["f1","f2"],"aliases":[],"stage":"foundations","chapter":2},{"id":"hiyal","name":"Hiyal (legal ruses)","group":"Prohibitions","tags":["hiyal"],"oneLine":"Legal devices that make a transaction technically permissible while defeating the purpose of the rule, such as ‘Inah to disguise an interest-bearing loan.","points":["Shafi‘is, Malikis and Hanbalis prohibit them; Hanafis allow only those compatible with the spirit of the Shari’ah.","Sadd al-Zarai‘ (Maliki): blocking the means to an illicit end.","Ibn Taymiyah judged such deals by the parties’ intention; a one-year gap in DM and sale and lease-back guards against ‘Inah."],"distinction":"A legitimate structure changes the substance (ownership, risk); a Hilah changes only the paperwork.","trigger":"Buy-backs, rollovers, paper-only Tawarruq, ‘Inah-based bonds and cards.","topicIds":["t6.11","t9.9.1","t15.3.4"],"origin":["f1"],"aliases":[]},{"id":"musawamah","name":"Musawamah (bargained sale)","group":"Sale-based modes","tags":["musawamah"],"oneLine":"An ordinary sale at a bargained price with no reference to the seller’s cost; all other sale conditions apply.","points":["Suits cases where cost cannot be stated precisely or supplier discounts are not disclosed.","Useful for large single deals — e.g. a bank buying a plane for $450m and selling it for $500m.","Used as an alternative to bill discounting in export finance (Section 14.4.2)."],"distinction":"Murabaha discloses cost and margin (a trust sale); Musawamah does not.","trigger":"Undisclosed costs, supplier discounts, export-bill alternatives.","topicIds":["t9.11","t9.11.1","t9.1","t14.4.2"],"origin":["f1","f2"],"aliases":[],"stage":"modes","chapter":9,"altNames":["Musawamah"]},{"id":"istijrar","name":"Bai‘ al Istijrar (supply contract)","group":"Accessory contracts","tags":["istijrar"],"oneLine":"A repeat-supply arrangement in which a supplier delivers goods from time to time on agreed price and payment terms; not a separate mode.","points":["The price may be fixed in advance, per consignment or after all deliveries.","Scholars relax price-fixing and payment rules for everyday trade where there is no Gharar (e.g. bread paid monthly).","If based on Murabaha or Salam, their conditions still apply — e.g. separate offer and acceptance for each Murabaha consignment."],"distinction":"Istijrar is a framework for repeated sales; each sale inside it must still be valid on its own terms.","trigger":"Master supply agreements, running Murabaha facilities.","topicIds":["t13.5"],"origin":["f1","f2"],"aliases":["bai-al-istijrar"],"stage":"modes","chapter":13,"altNames":["Bai' al Istijrar (Supply Contract)"]},{"id":"waqf","name":"Waqf (endowment)","group":"Takaful & social","tags":["waqf"],"oneLine":"Property retained for charitable purposes or specified beneficiaries; the Waqf is a separate entity whose corpus cannot be sold, and only its usufruct is assigned.","points":["Three kinds: religious, philanthropic and family Waqf.","A donor may also be among the beneficiaries, which is why the Waqf model suits Takaful.","Waqf and Zakat resources can support Islamic microfinance."],"distinction":"Sadaqah is given away outright; a Waqf keeps the corpus and dedicates its benefit.","trigger":"Takaful models, Tabarru‘, microfinance funding.","topicIds":["t16.3","t16.4.1","t18.3.1"],"origin":["f1"],"aliases":[]},{"id":"zakat","name":"Zakat","group":"Takaful & social","tags":["zakat"],"oneLine":"A religious obligation on wealth above needs, at a non-progressive rate — generally 2.5 % of net wealth, or 5 or 10 % of agricultural produce above a minimum — distributed to the needy (9:60).","points":["One of the six macro features of an Islamic economy.","A surety who has to pay a debt may receive Zakat as one of the Gharimeen.","Zakat and Waqf funds can finance needy small enterprises directly."],"distinction":"Zakat is an obligation with fixed rates and recipients; charity (Sadaqah) is voluntary.","trigger":"Distributive justice, need fulfilment, microfinance.","topicIds":["t1.8","t2.5","t7.15","t18.3.1"],"origin":["f1"],"aliases":[]},{"id":"islamic-funds","name":"Islamic funds (equity, Ijarah, commodity, Murabaha, mixed)","group":"Banking & markets","tags":["islamic-funds"],"oneLine":"Pooled investment vehicles run on Mudarabah (profit share) or agency (fee); what the fund holds decides whether its units can be traded.","points":["Usmani’s five categories: equity, Ijarah, commodity, Murabaha and mixed funds.","Equity and Ijarah fund units trade at market price; a Murabaha fund must be closed-end because its portfolio is debt.","A mixed fund’s units trade if tangible assets exceed 51 %."],"distinction":"A conventional fund may guarantee a return tied to face value; an Islamic fund pays only the profit actually earned.","trigger":"Mutual funds, asset management, unit trusts, screening, purification.","topicIds":["t8.8.1","t8.8.4","t15.3.8"],"origin":["f1","f2"],"aliases":["investment-funds"],"stage":"markets","chapter":8,"altNames":["Islamic Investment Funds"]},{"id":"money-market","name":"Islamic interbank money market","group":"Banking & markets","tags":["money-market"],"oneLine":"Short-term placements between banks on Mudarabah (e.g. Malaysia’s MII) or through trading in Shari’ah-compliant instruments.","points":["MII: overnight to 12 months; return based on the investee bank’s gross profit rate, with a negotiated ratio.","Elsewhere, interbank placements are treated like deposits and paid by weightage and daily product.","CODs, COIs and Ijarah-based instruments can also be traded for liquidity."],"distinction":"Conventional call money pays a fixed rate agreed upfront; an MII return is known only at maturity.","trigger":"Liquidity management, treasury, interbank placements.","topicIds":["t8.8.5","t14.4.4","t13.3.1"],"origin":["f1"],"aliases":[]},{"id":"shariah","name":"Islamic Shari'ah","group":"Foundations","groupDerivedFromStage":true,"tags":["shariah"],"stage":"foundations","chapter":2,"topicIds":[],"origin":["f2"],"aliases":[],"mapNodeOnly":true},{"id":"philosophy-islamic-finance","name":"Philosophy of Islamic Finance","group":"Foundations","groupDerivedFromStage":true,"tags":["philosophy-islamic-finance"],"stage":"foundations","chapter":4,"topicIds":[],"origin":["f2"],"aliases":[],"mapNodeOnly":true},{"id":"contract-validity-rules","name":"Rules for Validity of Contracts","group":"Principles","groupDerivedFromStage":true,"tags":["contract-validity-rules"],"stage":"contracts","chapter":5,"topicIds":[],"origin":["f2"],"aliases":[],"mapNodeOnly":true},{"id":"contract-types","name":"Types of Contracts (Valid/Void/Voidable)","group":"Principles","groupDerivedFromStage":true,"tags":["contract-types"],"stage":"contracts","chapter":5,"topicIds":[],"origin":["f2"],"aliases":[],"mapNodeOnly":true},{"id":"sale-contract-conditions","name":"Requirements of a Valid Sale","grou ,"summary":"The client promises to buy, is appointed the bank's agent to purchase the goods, and then buys them from the bank by a separate offer and acceptance.","parties":[{"id":"client","label":"Client (promisor/agent)","x":15,"y":18},{"id":"bank","label":"Islamic bank","x":50,"y":45},{"id":"supplier","label":"Supplier","x":85,"y":18}],"steps":[{"from":"client","to":"bank","kind":"promise","label":"Master agreement & promise to buy","detail":"MoU/master Murabaha facility; client's unilateral binding promise; Hamish Jiddiyah may be taken."},{"from":"bank","to":"client","kind":"agency","label":"Agency agreement","detail":"Separate agency appointing the client to buy the goods on the bank's behalf — signed before purchase."},{"from":"client","to":"supplier","kind":"contract","label":"Agent buys for the bank","detail":"Client, as agent, purchases goods per specifications in the bank's name."},{"from":"bank","to":"supplier","kind":"cash","label":"Bank pays supplier directly","detail":"Direct payment reduces the risk of misuse of funds."},{"from":"supplier","to":"client","kind":"goods","label":"Delivery to agent (bank's risk)","detail":"Goods held by the agent are at the bank's risk until sale."},{"from":"client","to":"bank","kind":"contract","label":"Offer to buy / bank accepts","detail":"Murabaha concluded by separate offer and acceptance; goods must still exist."},{"from":"client","to":"bank","kind":"cash","label":"Deferred instalments","detail":"Fixed price paid as scheduled; no rollover, discount by stipulation or rebate by condition."}],"rules":["Agency must precede purchase.","Goods must exist (not consumed) at offer.","Invoice date not earlier than agency, not later than offer."],"pitfalls":["Client already bought goods before agency","Using goods in production before offer"],"origin":["f1"]},{"id":"salam","title":"Salam (forward sale, full prepayment)","topicId":"t10.10","conceptId":"salam","modeId":"salam","productIds":["salam-agri","livestock-finance"],"summary":"The bank pays the full price in advance for specified goods to be delivered later, then disposes of them by market sale, promise, agency or Parallel Salam.","parties":[{"id":"seller","label":"Producer (Salam seller)","x":15,"y":30},{"id":"bank","label":"Islamic bank (buyer)","x":50,"y":30},{"id":"buyer","label":"Final buyer","x":85,"y":30}],"steps":[{"from":"bank","to":"seller","kind":"contract","label":"Salam contract","detail":"Quantity, quality, delivery date and place fully specified."},{"from":"bank","to":"seller","kind":"cash","label":"Full price paid in advance","detail":"Salam capital must be paid at the contract session."},{"from":"buyer","to":"bank","kind":"promise","label":"Promise to buy (optional)","detail":"Third party promises to buy at an agreed price, possibly with Hamish Jiddiyah (Box 10.4)."},{"from":"seller","to":"bank","kind":"goods","label":"Delivery on due date","detail":"Bank takes delivery and bears the goods' risk."},{"from":"bank","to":"buyer","kind":"contract","label":"Bank sells the goods","detail":"Spot/credit sale, execution of promise, or sale through the seller as agent."}],"rules":["Only fungible, specifiable goods; not currencies or gold/silver against money.","Full prepayment.","Goods cannot be resold before possession (except via Parallel Salam)."],"pitfalls":["Deferring payment of the Salam price","Salam in an identified field's produce"],"origin":["f1"]},{"id":"parallel-salam","title":"Parallel Salam","topicId":"t10.6","conceptId":"salam","modeId":"salam","productIds":[],"summary":"The bank sells goods of the same description forward to a third party in a separate Salam, independent of its first Salam purchase.","parties":[{"id":"seller","label":"Producer","x":12,"y":30},{"id":"bank","label":"Islamic bank","x":50,"y":30},{"id":"buyer","label":"Third-party buyer","x":88,"y":30}],"steps":[{"from":"bank","to":"seller","kind":"contract","label":"Salam 1: bank buys","detail":"Bank pays the producer in advance for delivery on date D1."},{"from":"buyer","to":"bank","kind":"contract","label":"Salam 2: bank sells","detail":"Separate Salam: buyer prepays the bank for goods of the same description on date D2."},{"from":"buyer","to":"bank","kind":"cash","label":"Buyer prepays bank","detail":"Contracts are independent — Salam 2 cannot be conditional on Salam 1."},{"from":"seller","to":"bank","kind":"goods","label":"Producer delivers","detail":"If the producer fails, the bank must still deliver under Salam 2."},{"from":"bank","to":"buyer","kind":"goods","label":"Bank delivers","detail":"Bank's margin = Salam 2 price − Salam 1 price."}],"rules":["Second contract must be independent and enforceable on its own.","The bank remains liable to its buyer whatever happens to the first contract."],"pitfalls":["Making Salam 2 conditional on Salam 1"],"origin":["f1"]},{"id":"istisna","title":"Istisna‘a (order to manufacture)","topicId":"t10.11","conceptId":"istisna","modeId":"istisnaa","productIds":[],"summary":"A manufacturer undertakes to make an asset to specification for a fixed price that may be paid in advance, in instalments or on deferred terms.","parties":[{"id":"buyer","label":"Buyer (Mustasni‘)","x":20,"y":30},{"id":"maker","label":"Manufacturer (Sani‘)","x":80,"y":30}],"steps":[{"from":"buyer","to":"maker","kind":"contract","label":"Istisna‘a order","detail":"Specifications, price and delivery time fixed."},{"from":"buyer","to":"maker","kind":"cash","label":"Price: advance, instalments or deferred","detail":"Flexible payment — unlike Salam."},{"from":"maker","to":"maker","kind":"risk","label":"Manufacture with own materials","detail":"Manufacturer bears risk until delivery; Shart-e-Jazai may reduce price for delay."},{"from":"maker","to":"buyer","kind":"goods","label":"Delivery; ownership passes","detail":"Buyer may reject non-conforming goods."}],"rules":["Only for things that are manufactured or constructed.","Price and specifications fixed.","Revocable until work starts, binding thereafter (OI e","to":"bank","kind":"rent","label":"Rentals over the term","detail":"Rent can reflect cost; bank bears ownership risk and Takaful."},{"from":"bank","to":"lessee","kind":"promise","label":"Separate promise to sell/gift","detail":"Unilateral promise binding only on the promisor (AAOIFI methods: token price, remaining amount, market value, gift)."},{"from":"bank","to":"lessee","kind":"ownership","label":"Separate sale/gift deed","detail":"Ownership transfers by a separate contract at the end."}],"rules":["Lease and transfer kept separate.","Sale and lease-back only exceptionally, with a time gap (~1 year)."],"pitfalls":["Automatic transfer written into the lease","Rent continuing after theft/destruction"],"origin":["f1"]},{"id":"musharakah","title":"Musharakah","topicId":"t12.3.4","conceptId":"musharakah","modeId":"musharakah","productIds":["musharakah-trade","musharakah-export"],"summary":"Bank and client pool capital in a venture; profit is shared as agreed, loss strictly by capital contribution.","parties":[{"id":"bank","label":"Islamic bank (partner)","x":20,"y":15},{"id":"client","label":"Client (partner)","x":80,"y":15},{"id":"venture","label":"Joint venture","x":50,"y":48}],"steps":[{"from":"bank","to":"venture","kind":"cash","label":"Bank contributes capital","detail":"Capital commingled; appreciation belongs to all partners pro rata."},{"from":"client","to":"venture","kind":"cash","label":"Client contributes capital","detail":"Client usually manages; may get a larger profit share for work."},{"from":"venture","to":"venture","kind":"risk","label":"Business operates","detail":"Partners are mutual agents and trustees; no guarantee of capital or profit."},{"from":"venture","to":"bank","kind":"cash","label":"Profit by agreed ratio","detail":"Loss by capital ratio; drawings adjusted at final settlement."},{"from":"venture","to":"client","kind":"cash","label":"Profit by agreed ratio","detail":"A declared sleeping partner cannot exceed his capital ratio (Hanafi view igin":["f1"]},{"id":"securitisation","title":"Securitisation through an SPV (Figure 15.1)","topicId":"t15.3.1","conceptId":"sukuk","modeId":"sukuk","productIds":["musharakah-sukuk"],"summary":"The originator sells assets to a bankruptcy-remote SPV, which funds the purchase by issuing Sukuk. Holders own the assets pro rata and receive the cash flows they generate.","parties":[{"id":"originator","label":"Originator","x":12,"y":15},{"id":"spv","label":"SPV (trustee/issuer)","x":50,"y":15},{"id":"investors","label":"Sukuk holders","x":88,"y":15},{"id":"obligors","label":"Obligors / lessees","x":50,"y":50}],"steps":[{"from":"originator","to":"spv","kind":"ownership","label":"True sale of assets","detail":"Proper segregation; irreversible even on the originator’s insolvency (p. 395)."},{"from":"spv","to":"investors","kind":"contract","label":"Issues Sukuk","detail":"Certificates of undivided ownership in the assets."},{"from":"investors","to":"spv","kind":"cash","label":"Subscription proceeds","detail":"Used to pay the purchase price."},{"from":"spv","to":"originator","kind":"cash","label":"Purchase price","detail":"The originator turns illiquid assets into cash (accumulator becomes distributor)."},{"from":"obligors","to":"spv","kind":"rent","label":"Rentals / collections","detail":"Collected by a servicer and paid to the SPV."},{"from":"spv","to":"investors","kind":"cash","label":"Pass-through or pay-through distributions","detail":"Returns come from the assets’ cash flows."}],"rules":["Ownership must pass to holders; rent receivables alone are debt.","Pools of receivables trade only under Hawalah rules unless tangible assets exceed the threshold.","No issuer guarantee of capital or fixed profit (AAOIFI)."],"pitfalls":["Securitising credit-card receivables as tradable paper","Guaranteed fixed returns"],"origin":["f1"]},{"id":"deposit-pool","title":"Two-tier Mudarabah deposit pool","topicId":"t12.7.1","conceptId":"mudarabah","modeId":"mudarabah","productIds":["mudarabah-d
