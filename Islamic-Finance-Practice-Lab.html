IFL_DATA.register("modes", [{"id":"murabaha","name":"Murabaha","category":"Trade-based (Sale)","chapter":9,"conceptId":"murabaha","shariahBasis":"A classical 'fiduciary sale' (Bai' al-Amanah): the seller must honestly disclose the original cost and add an agreed profit margin. Modern bank Murabaha takes the specific form of 'Murabaha to Purchase Orderer' (MPO), built on a client promise, an agency purchase, and a separate sale contract.","subjectMatter":"Any real, existing, Shari'ah-permissible good already owned and possessed by the bank (not currency, gold/silver, or debt instruments) that the bank resells to the client at cost plus disclosed profit.","ownershipRiskTiming":"Ownership and risk pass to the bank only after it (or its agent) takes actual or constructive possession from the supplier; only then can the bank execute a fresh offer-and-acceptance sale that transfers ownership and risk to the client.","returnType":"Fixed","returnTypeDetail":"The profit margin over the disclosed cost is fixed once at execution and cannot later be increased even though payment is deferred; rollover/re-pricing of overdue receivables is not allowed.","typicalTenor":"Short to medium term, structured around a single trade transaction financed on a deferred-payment (Bai' Mu'ajjal) basis.","liquidityTradability":"Murabaha creates a monetary receivable/debt owed by the client, which cannot be traded or sold at a discount (this would be Riba) and can only be assigned at face value under Hawalah rules.","commonUse":"Financing raw materials, inventory, equipment, and trade goods needing a cost-plus credit facility -- the book cites farm inputs, machinery, import/export trade financing, and consumer durables.","keyConditions":["Seller must truthfully disclose the original cost and any addable expenses, being honest and true to his words (a 'trust sale').","The bank must take actual or constructive possession and bear the risk of the goods before reselling to the client.","The goods requested must not already be owned by the client, otherwise the deal becomes prohibited Bai' al-'Inah (buy-back).","Currencies, gold/silver, and debt instruments cannot be the subject of Murabaha since they fall under Bai' al-Sarf rules.","The promise to purchase, the agency contract, and the actual Murabaha sale must remain three separate, independent contracts."],"majorRisks":["Shari'ah-compliance risk if agency and sale steps are collapsed together or the client already owns the requested goods.","Asset/ownership risk borne by the bank between taking possession from the supplier and completing the sale to the client.","Client default risk -- rollover (re-pricing overdue receivables) is prohibited as explicit Riba, leaving only rescheduling at the same price.","Customer backing out after being appointed purchasing agent, only partly mitigated by earnest money (Hamish Jiddiyah)."],"distinguishingFeature":"Unlike Musawamah, Murabaha requires the seller to disclose the original cost and negotiate only the profit margin added to it.","source":{"chapter":9,"section":"9.2-9.10","pages":[213,238]},"origin":["f2","f1"],"aliases":["murabaha"],"attributes":{"category":"Debt-creating (trade)","nature":"Sale at disclosed cost plus agreed profit","ownership":"Bank owns and bears risk until sale; then passes to client","return":"Fixed mark-up","payment":"Spot delivery, deferred payment","late":"Loss to the bank (price cannot increase)","tenor":"Short/long-term","uses":"Raw materials, trade, consumer goods","keyRule":"Own and possess before selling; no rollover","pitfall":"Buy-back or charging from disbursement"},"topicId":"t9.3"},{"id":"musawamah","name":"Musawamah","category":"Trade-based (Sale)","chapter":9,"conceptId":"musawamah","shariahBasis":"An ordinary, general form of Bai' in which price is freely bargained between buyer and seller with no reference to the seller's cost, lawful under the same general conditions of valid sale as any other Bai', minus Murabaha's disclosure obligation.","subjectMatter":"Any Shari'ah-permissible goods or assets the bank owns and possesses, sold at a bargained final price -- suited to cases where the bank's acquisition cost is not easily broken down for the client.","ownershipRiskTiming":"Same as Murabaha: ownership, possession and risk must pass to the bank before it resells to the customer; the only difference is that cost and profit need not be disclosed.","returnType":"Fixed","returnTypeDetail":"The final price is fixed by mutual bargaining without disclosing the bank's cost or margin, so the return is embedded in the negotiated price rather than a stated markup.","typicalTenor":"Cash or deferred; the book notes it suits single large transactions (e.g. an aircraft purchase) decided at senior levels rather than routine small-ticket financing.","liquidityTradability":"As with Murabaha, execution creates a deferred-payment receivable/debt that cannot be traded at a discount and is only assignable at face value under Hawalah.","commonUse":"Large one-off asset purchases (the book's example: aircraft financing) or retail goods where the bank has obtained an undisclosed supplier discount, which would be noncompliant to keep under Murabaha.","keyConditions":["All general conditions of a valid Bai' (Chapter 6) apply exactly as in Murabaha.","The bank must still take ownership, possession, and business risk of the asset before reselling to the customer.","No disclosure of cost price or profit margin is required or expected by either party.","Where a supplier rebate is received and not disclosed to the customer, the sale must be structured as Musawamah, not Murabaha."],"majorRisks":["Same ownership/possession and default risks as Murabaha, since all other Shari'ah essentials are identical.","Less pricing transparency than Murabaha, which the book notes makes benchmark-linked pricing and regulatory oversight harder.","Greater scope for mispricing relative to Murabaha's disclosed cost-plus structure, per the book's own comparison."],"distinguishingFeature":"Unlike Murabaha, Musawamah involves no obligation on the seller to disclose the original cost -- price is set purely by mutual bargaining on the final figure.","source":{"chapter":9,"section":"9.11","pages":[234,238]},"origin":["f2","f1"],"aliases":["musawamah"],"attributes":{"category":"Debt-creating (trade)","nature":"Bargained sale without disclosing cost","ownership":"Seller owns until sale","return":"Negotiated margin","payment":"Spot or deferred","late":"Price cannot increase","tenor":"Short-term","uses":"Trade where cost disclosure is impractical","keyRule":"Sale conditions apply; no cost disclosure needed","pitfall":"Deceptive overpricing (Ghaban)"},"topicId":"t9.11"},{"id":"salam","name":"Salam","category":"Forward Sale","chapter":10,"conceptId":"salam","shariahBasis":"An explicit exception -- sanctioned directly by the Prophet (pbuh) -- to the rule that a sold commodity must exist and be possessed by the seller, permitted for the genuine financing 'necessity' of farmers and traders, subject to strict specification and full advance payment.","subjectMatter":"Fungible (Mithli) commodities precisely defined by quality, quantity and standard specification (e.g. wheat, rice, oil, metals) and generally available in the market at delivery; not usable for money/currencies, unique items, or value-by-subjective-judgment items.","ownershipRiskTiming":"The buyer pays the full price upfront (Salam capital) while the seller keeps the goods and bears their risk until the agreed future delivery date, when ownership and risk of the delivered commodity pass to the buyer.","returnType":"Fixed","returnTypeDetail":"The buyer's gain comes from a Salam price typically cheaper than the future spot price -- effectively a fixed forward price agreed today for goods delivered later.","typicalTenor":"Historically one to three years for farm produce; contemporary use fixes any agreed period, from days to years, depending on the commodity.","liquidityTradability":"The majority view bars the Salam buyer from reselling before taking delivery; banks instead use Parallel Salam, an independent agency sale, or a third-party purchase promise -- negotiable Salam certificates remain a disputed, largely unaccepted innovation.","commonUse":"Financing producers and traders who need cash now against future delivery of a standardized commodity -- the book's archetype is agricultural financing (seed, inputs, working capital for farmers).","keyConditions":["Full price must be paid in advance, essentially at the contract session (a short customary delay is tolerated by some jurists).","Quantity, quality and specifications must be precisely defined to remove Gharar; delivery date and place must be fixed.","The commodity must be a fungible item normally available in the market at delivery, not a specific identified asset.","Salam is not permitted in gold, silver, or currencies, which fall under Bai' al-Sarf's simultaneous-exchange requirement.","The contract is binding and non-revocable except by mutual consent; Khiyar al-Shart (option) is disallowed."],"majorRisks":["Seller default or delivery of inferior/short-quantity goods, mitigated by pledges, sureties, and predefined substitution rules.","Marketing/disposal risk for the bank on taking delivery, since onward resale before possession is restricted.","Price risk since the contract is binding and neither party may rescind merely because the market price moved.","Shari'ah-compliance risk in disguised currency-based or debt-based Salam structures, rejected by the majority of jurists."],"distinguishingFeature":"Unlike Istisna'a, Salam requires full price payment in advance and is restricted to fungible (Mithli) goods rather than items requiring manufacture.","source":{"chapter":10,"section":"10.2-10.8","pages":[241,263]},"origin":["f2","f1"],"aliases":["salam"],"attributes":{"category":"Debt-creating (forward trade)","nature":"Forward sale with full prepayment","ownership":"Bank owns goods after delivery; seller liable to deliver","return":"Difference between Salam price and resale price","payment":"Spot price, deferred delivery","late":"Loss to the bank","tenor":"Short-term","uses":"Agriculture, commodities, working capital","keyRule":"Full prepayment; precise specification; fixed delivery","pitfall":"Deferring the Salam price"},"topicId":"t10.2"},{"id":"istisnaa","name":"Istisna'a","category":"Forward Sale","chapter":10,"conceptId":"istisna","shariahBasis":"Legalized on the principle of Istihsan (juristic preference) as a sale of a not-yet-existing manufactured item, justified by long-standing common practice and by the ease it affords for financing manufacture and infrastructure that Salam's rules cannot accommodate.","subjectMatter":"Items that must be manufactured, assembled or constructed -- identified by detailed specification, not by pointing to an existing unit -- such as buildings, plant, ships, aircraft, and infrastructure.","ownershipRiskTiming":"The manufacturer/seller bears the risk of raw materials and work-in-progress until delivery; risk and ownership of the completed asset transfer to the purchaser only on delivery in the agreed specifications.","returnType":"Fixed","returnTypeDetail":"Price is fixed by mutual agreement at execution and cannot be unilaterally changed, though it may be revised by mutual consent for material design changes or unforeseen cost shifts.","typicalTenor":"Medium to long term, suited to long-gestation projects (construction, shipbuilding, plant manufacture); price can be paid in instalments linked to completion stages rather than in full advance.","liquidityTradability":"The purchaser is not deemed owner of work-in-progress materials, and the completed asset is not readily tradable before delivery; banks typically use Parallel Istisna'a as manufacturer-supplier rather than reselling receivables.","commonUse":"Financing manufacture and construction -- housing, plant and machinery, infrastructure (roads, bridges, dams), and high-technology goods such as aircraft and ships -- plus export/working-capital financing.","keyConditions":["Subject matter must require manufacturing/construction and be defined by specification, not by identifying an existing unit.","Price need not be paid in advance (unlike Salam) and can be instalment-based or tied to completion stages.","The contract only becomes binding once the manufacturer starts work; before that either party may cancel.","A penalty clause (Shart-e-Jazai) reducing price for late delivery is permitted, with its benefit going to the purchaser -- unlike Salam's late-delivery penalty, which goes to charity.","Parallel Istisna'a with a third-party contractor is permitted provided the two contracts stay fully independent."],"majorRisks":["Delivery/completion risk if the manufacturer or a parallel subcontractor delays or fails to perform.","Quality risk -- the purchaser has the option of defect (Khiyar al-'Aib) if the delivered asset lacks agreed specifications.","Settlement, price, and possession risk during the manufacturing period, since sale before delivery is restricted.","Market/cost risk if project costs or values shift over long gestation periods before delivery completes."],"distinguishingFeature":"Unlike Salam, Istisna'a does not require full advance payment and only becomes binding once work has actually started.","source":{"chapter":10,"section":"10.11","pages":[263,270]},"origin":["f2","f1"],"aliases":["istisna"],"attributes":{"category":"Debt-creating (forward trade)","nature":"Order to manufacture/construct","ownership":"Manufacturer bears risk until delivery","return":"Margin between contract and cost/sub-contract price","payment":"Flexible: advance, instalments or deferred","late":"Controllable (e.g. Shart-e-Jazai)","tenor":"Short/long-term","uses":"Houses, plants, infrastructure, machinery","keyRule":"Only for manufactured items; fixed price and specs","pitfall":"Using it for natural produce"},"topicId":"t10.11","altNames":["Istisna‘a"]},{"id":"ijarah","name":"Ijarah","category":"Lease-based","chapter":11,"conceptId":"ijarah","shariahBasis":"Sanctioned by Qur'an, Sunnah and juristic consensus (Ijma'a) as the sale of usufruct (Manafa'ah) of an asset -- not its corpus -- for rent, valid for any asset whose corpus is not consumed by use and whose usufruct can be clearly ascertained.","subjectMatter":"The right to use a specified tangible asset (property, vehicle, equipment) whose corpus is not consumed through use; corpus ownership stays with the lessor throughout.","ownershipRiskTiming":"Ownership of the corpus never transfers in pure Ijarah; it stays with the lessor for the whole term, and all ownership-related risks/expenses remain the lessor's, while the lessee is liable only for loss he causes by negligence.","returnType":"Rental","returnTypeDetail":"Rent (Ujrah) is agreed for a specified period and becomes due only once the asset is delivered in usable form -- not from when the lessor pays for the asset -- and may be benchmarked or revised with agreed ceilings/floors.","typicalTenor":"Flexible -- can run for the asset's full useful life (financial-lease style) or a shorter period (operating lease), which the book notes suits high-cost, long-production-time assets like aircraft and ships.","liquidityTradability":"Accrued rent is a debt and cannot be sold at a discount; sub-leasing is permitted with the lessor's consent, and the lessor may sell the leased asset to a third party without ending the lease.","commonUse":"Financing use of equipment, vehicles, machinery, and property where the client needs the asset's usufruct rather than outright purchase.","keyConditions":["The leased asset's corpus must not be consumed by use (excludes money, food, fuel, and similar consumables).","The usufruct, rental amount, and lease period must all be clearly known/ascertained to avoid Gharar.","Rent does not become due until the asset is actually delivered to the lessee in usable condition.","All ownership-related expenses and risks (including Takaful) remain the lessor's responsibility throughout.","Any interest-benchmark-linked rental review must be capped/floored to avoid Gharar."],"majorRisks":["Asset ownership risk borne entirely by the lessor -- if the asset is destroyed without the lessee's fault, the lessor bears the loss and cannot claim further rent.","Rental default risk, since accrued rent is a debt; only charity-directed late-payment penalties (not bank income) are permitted as a deterrent.","Residual/obsolescence risk for the lessor in operating leases, which must be re-leased or disposed of at term end.","Shari'ah-compliance risk if conventional-lease practices (rent before delivery, shifting all ownership risk to the lessee) creep into the structure."],"distinguishingFeature":"Unlike a sale, Ijarah transfers only the usufruct (right to use), never the corpus/ownership, which stays with the lessor throughout the lease term.","source":{"chapter":11,"section":"11.1-11.4","pages":[279,290]},"origin":["f2","f1"],"aliases":["ijarah"],"attributes":{"category":"Semi-debt (lease)","nature":"Sale of usufruct for rent","ownership":"Lessor retains ownership and its risk","return":"Rent (fixed or benchmarked, quasi-fixed net)","payment":"Rent from usable delivery","late":"Controllable; charity undertaking","tenor":"Long-term","uses":"Vehicles, machinery, property, sovereign assets","keyRule":"Non-consumable assets; no rent before delivery","pitfall":"Putting all risk on lessee"},"topicId":"t11.1"},{"id":"ijarah-muntahia-bi-tamleek","name":"Ijarah Muntahia-bi-Tamleek","category":"Lease-based","chapter":11,"conceptId":"imbt","shariahBasis":"Built on ordinary Ijarah rules but kept compliant by strictly separating the lease from ownership transfer: a unilateral, binding promise by the lessor to sell or gift the asset at lease end, executed through a wholly separate contract, avoids the prohibited 'two contracts in one bargain'.","subjectMatter":"Same as Ijarah -- a specified usable asset whose corpus is not consumed by use -- with an accompanying separate promise mechanism for eventual ownership transfer to the lessee.","ownershipRiskTiming":"Corpus ownership and risk stay with the bank/lessor throughout, exactly as in ordinary Ijarah; only at lease-end, via a separate sale, gift, or gift-contingent-on-final-payment contract, do ownership and risk pass to the lessee.","returnType":"Rental","returnTypeDetail":"Payments are structured purely as rent throughout the lease (not as purchase instalments), starting only when the asset is supplied in usable form -- unlike a conventional finance lease, where accrual starts on payment to the supplier.","typicalTenor":"Generally spans the asset's expected productive life, ending with a separate ownership-transfer contract at term -- commonly multi-year in the book's housing and equipment finance examples.","liquidityTradability":"Same as Ijarah: accrued rent is a non-tradable debt; the ownership-transfer promise is unilateral and not itself a negotiable instrument.","commonUse":"The dominant Islamic-bank leasing structure for financing houses, vehicles, and equipment where the client's end goal is ownership -- the Shari'ah-compliant counterpart to conventional hire-purchase/finance lease.","keyConditions":["The ownership-transfer promise must be unilateral and binding only on the lessor; the lessee retains the option not to proceed.","Transfer of ownership must be executed via a separate, independent contract (sale, gift, or gift contingent on final instalment), never as a built-in condition of the lease.","If structured as sale-and-lease-back, a reasonable interval (the book suggests around one year) should separate purchase and eventual repurchase to avoid Bai' al-'Inah.","All ordinary Ijarah essentials (defined usufruct and rent, lessor bearing ownership risk) must still be fully satisfied throughout.","Rent must start only from actual usable delivery to the lessee, not from the date the bank pays the supplier."],"majorRisks":["Shari'ah-compliance risk if the sale/gift is effectively pre-conditioned into the lease rather than kept independent.","Ownership risk for the lessor for the full lease term, since risk transfer is deferred to the final ownership-transfer contract.","Bai' al-'Inah risk in sale-and-lease-back variants if repurchase follows too quickly after the initial sale.","Default/termination risk -- if the lessee fails to complete purchase, the lessor may recover only actual loss (not opportunity cost) from any earnest money held."],"distinguishingFeature":"Unlike plain Ijarah, IMT adds a separate, unilateral promise mechanism for ownership to transfer at lease end -- but that transfer must never be built into the lease contract itself.","source":{"chapter":11,"section":"11.5","pages":[290,293]},"origin":["f2","f1"],"aliases":["imbt"],"attributes":{"category":"Semi-debt (lease + transfer)","nature":"Lease with separate promise to sell/gift","ownership":"Bank until separate transfer contract","return":"Rent","payment":"Rent over term; transfer at end","late":"Controllable","tenor":"Long-term","uses":"Auto and house finance","keyRule":"Lease and sale separate","pitfall":"Automatic transfer clause"},"topicId":"t11.5","altNames":["IMBT"]},{"id":"musharakah","name":"Musharakah","category":"Participatory (Equity)","chapter":12,"conceptId":"musharakah","shariahBasis":"Rooted in Shirkatul-'aqd (contractual partnership), specifically Shirkah al-'Inan, which enjoys the consensus (Ijma'a) of the major schools: partners combine capital (and optionally labour) to conduct a joint business, sharing profit by agreement and loss strictly by capital ratio.","subjectMatter":"A jointly owned commercial venture or specific project/asset, financed by the combined capital contributions (cash or valued-in-kind) of two or more partners who act as each other's mutual agents.","ownershipRiskTiming":"Ownership of the venture's assets is joint and proportional to each partner's capital from inception; each partner bears business risk and loss immediately and continuously in proportion to capital invested.","returnType":"Variable/Profit-Share","returnTypeDetail":"Profit is shared in any mutually agreed ratio (which may differ from the capital ratio to reward a working partner's effort), but loss must always be borne strictly in proportion to capital contribution.","typicalTenor":"Can be continuous, lasting as long as the business operates, or restricted to a specific project until completion; a partner may generally withdraw at will unless a fixed term is mutually agreed.","liquidityTradability":"A partner's share can be sold or assigned subject to partnership rules, and in corporate form takes the shape of tradable shares; but a promise to buy another partner's share at a pre-fixed price (rather than market/agreed value) is not permitted, since that would guarantee his capital.","commonUse":"Joint-venture and project financing where the bank and client both contribute capital and share business risk -- the book frames it as the most genuinely risk-sharing, and preferred, mode.","keyConditions":["Profit-sharing ratio must be agreed at execution and can differ from the capital ratio; loss must always follow the capital ratio exactly.","No partner may be guaranteed a lump-sum or fixed-percentage-of-capital return -- profit must be a share of actual realized profit.","Capital contributed (cash or valued goods) must be quantified without ambiguity.","All partners are mutual agents (Wakil) of one another but not guarantors (Kafil) of one another's losses due to misconduct.","A sleeping partner (one who does not work) cannot receive a profit share exceeding his capital ratio."],"majorRisks":["Full exposure to business/commercial loss in proportion to capital invested -- there is no capital protection.","Partner-management (agency) risk, since a partner is liable only for negligence or misconduct, not ordinary business loss.","Termination/liquidity risk, since Musharakah is non-binding by default and any partner may seek to withdraw.","Valuation risk at exit or profit-distribution points, requiring fair valuation (actual or constructive liquidation) of assets."],"distinguishingFeature":"Unlike Mudarabah, in Musharakah all partners contribute capital and may participate in management, and all partners bear loss in proportion to their own investment.","source":{"chapter":12,"section":"12.2-12.3","pages":[307,320]},"origin":["f2","f1"],"aliases":["musharakah"],"attributes":{"category":"Participatory (PLS)","nature":"Partnership; all contribute capital","ownership":"Joint, pro rata","return":"Variable: agreed share of actual profit","payment":"Periodic profit on valuation; capital at exit","late":"No issue (profit depends on results)","tenor":"Short/long-term","uses":"Projects, trade consignments, working capital","keyRule":"Profit as agreed, loss by capital","pitfall":"Guaranteeing capital or fixed profit"},"topicId":"t12.3"},{"id":"mudarabah","name":"Mudarabah","category":"Participatory (Equity)","chapter":12,"conceptId":"mudarabah","shariahBasis":"A specific form of Shirkah recognized since pre-Islamic times and confirmed by Prophetic practice and juristic consensus, in which one party (Rabbul-mal) supplies capital and another (Mudarib) supplies labour/expertise, sharing profit by agreement while capital loss is borne solely by the financier.","subjectMatter":"Capital (preferably cash, precisely valued if in kind) entrusted to a Mudarib to trade or conduct business with, on either a restricted (specific business/place/time) or unrestricted basis.","ownershipRiskTiming":"The Rabbul-mal owns the capital and all business assets/profits until distribution; the Mudarib owns nothing of the venture and bears no capital risk -- his only loss on failure is uncompensated time and effort, absent negligence.","returnType":"Variable/Profit-Share","returnTypeDetail":"Profit is split in a pre-agreed ratio (e.g. 50:50) fixed at inception and never a lump sum or a percentage of capital; capital loss is borne entirely by the Rabbul-mal unless caused by the Mudarib's negligence or misconduct.","typicalTenor":"Can run to a fixed term by agreement or continue until wound up at will (unrestricted Mudarabah); once the Mudarib has commenced business, the contract becomes binding until actual or constructive liquidation.","liquidityTradability":"Mudarabah certificates/Sukuk can be traded subject to conditions -- as cash they follow Bai' al-Sarf rules, as debt they follow debt-trading rules, and as mixed assets they trade at market-agreed value; final profit/loss is only fixed at actual or constructive liquidation.","commonUse":"The classical basis for Islamic banks' deposit-taking (banks as Mudarib for depositors' funds) and for asset-management/investment-agency products.","keyConditions":["Profit-sharing ratio must be fixed at inception as a share of actual realized profit, never a lump sum or percentage of capital.","Capital must be reasonably liquid/quantifiable; a pre-existing debt cannot be converted into Mudarabah capital.","The Mudarib may not work contrary to the financier's specified conditions (business, place, time) in a restricted Mudarabah.","The financier (Rabbul-mal) generally may not interfere in day-to-day management, though he may monitor fiduciary compliance.","If the Mudarib contributes his own capital alongside the financier's, that portion becomes a hybrid Musharakah-Mudarabah arrangement."],"majorRisks":["Full capital-loss exposure for the financier -- the working partner risks only his labour, creating potential agency/moral-hazard risk.","Difficulty verifying the Mudarib's honesty and diligence, since he is a trustee liable only for negligence, not ordinary business loss.","Profit-recognition risk: profit is not final until actual or constructive liquidation, complicating periodic distributions.","Termination risk, since Mudarabah is non-binding by default absent an agreed minimum duration."],"distinguishingFeature":"Unlike Musharakah, only the financier (Rabbul-mal) contributes capital and bears any capital loss -- the Mudarib contributes labour only and loses nothing but his effort if the venture fails.","source":{"chapter":12,"section":"12.4-12.5","pages":[320,328]},"origin":["f2","f1"],"aliases":["mudarabah"],"attributes":{"category":"Participatory (PLS)","nature":"Capital from one, management from other","ownership":"Assets owned by Rabbul-mal","return":"Variable: agreed profit share","payment":"Profit after capital is intact; final at liquidation","late":"No issue","tenor":"Short/long-term","uses":"Deposits, funds, trade, Sukuk","keyRule":"Loss borne by capital owner; no salary to Mudarib","pitfall":"Debt as capital"},"topicId":"t12.4"},{"id":"diminishing-musharakah","name":"Diminishing Musharakah","category":"Participatory (Equity)","chapter":12,"conceptId":"diminishing-musharakah","shariahBasis":"A contemporary juristic development combining Shirkatulmilk (joint ownership) with separate leasing and sale sub-contracts, permissible because each element is kept independently valid and not made conditional on the others, avoiding the prohibition on tying two contracts together.","subjectMatter":"A jointly owned fixed asset (typically a house, vehicle, plant, or building) in which the financier partner's ownership units are periodically leased and then sold to the client partner until full ownership transfers.","ownershipRiskTiming":"Both partners hold proportional ownership and bear risk from the outset pro rata; as the client buys successive ownership units, the financier's ownership share, risk, and rental entitlement all shrink until full ownership passes to the client.","returnType":"Mixed","returnTypeDetail":"The client pays declining rent on the financier's shrinking ownership share plus a separate periodic payment to purchase further ownership units, combining a rental return with capital repayment.","typicalTenor":"Medium to long term, matched to the underlying asset -- the book's worked housing-finance example runs a 10-year (120-month) unit-purchase and rental-decline schedule.","liquidityTradability":"The financier's remaining ownership units are not freely tradable to third parties in typical bank structures; the client's promise to purchase is unilateral and binding on him (in Shirkatulmilk) or, in DM-in-trade, only on the financier, priced independently of any guaranteed capital value.","commonUse":"The book's leading example for house financing, auto financing, plant/machinery financing, and balance-transfer facilities replacing interest-based mortgages, plus gradual buyout of a trading partner's equity stake.","keyConditions":["Partnership, lease, and sale must be structured as three separate, independently enforceable contracts, never bundled or conditional on one another.","In Shirkatulmilk-based DM (e.g. housing), a pre-agreed purchase price schedule is permitted; in DM-in-trade, units must instead be sold at prevailing market/valuation price to avoid guaranteeing the financier's capital.","Rent is charged only on the financier's outstanding ownership share and must decline as the client buys further units.","Sale-and-lease-back variants require a suitable interval (the book suggests about one year) before repurchase, to avoid Bai' al-'Inah.","Both partners bear ownership-related expenses and losses pro rata according to their current ownership share."],"majorRisks":["Client default risk -- if payments stop, the financier's ownership share and rental income do not decline, though the client's asset may be at stake via security.","Shari'ah-compliance risk if the three sub-contracts are stipulated together rather than kept independent, or a pre-fixed buyout price is used in DM-in-trade.","Valuation risk when a client buys multiple units at once, requiring fresh appraisal and capital-gain sharing.","Rate risk on floating rental components, requiring a floor-and-cap structure to avoid Gharar."],"distinguishingFeature":"Unlike ordinary Musharakah, Diminishing Musharakah has a built-in exit mechanism: one partner's ownership share is progressively bought out by the other through periodic unit purchases until sole ownership results.","source":{"chapter":12,"section":"12.8-12.9","pages":[337,343]},"origin":["f2","f1"],"aliases":["dm"],"attributes":{"category":"Participatory + lease","nature":"Joint ownership + lease of financier's share + unit sales","ownership":"Joint, shifting to client","return":"Rent on bank's share (+ unit sale)","payment":"Monthly rent + unit purchase","late":"Controllable (rent continues)","tenor":"Long-term","uses":"Housing, vehicles, machinery","keyRule":"Separate contracts; pre-agreed price only in Shirkatulmilk","pitfall":"Interdependent contracts"},"topicId":"t12.8"},{"id":"wakalah","name":"Wakalah","category":"Agency-based","chapter":13,"conceptId":"wakalah","shariahBasis":"Agency is directly evidenced by Shari'ah texts and Prophetic practice (the Prophet delegated a purchase to a Companion); a Wakil acts on behalf of a principal with the diligence of a trustee (Amanah), and the resulting rights/liabilities attach to the principal as if he acted himself.","subjectMatter":"Any lawful act that admits representation -- purchase, sale, letting, borrowing/lending, debt assignment, payment collection, or fund management -- delegated by a principal to an agent for a specific or general purpose.","ownershipRiskTiming":"Per the preferred juristic view, ownership of anything the agent purchases for the principal transfers directly from the seller to the principal without passing through the agent's ownership; the agent bears no ownership risk unless negligent.","returnType":"Fee-based","returnTypeDetail":"Banks typically charge a fee (fixed lump sum or percentage of net asset value/investment) for agency services such as Wakalatul Istismar fund management, while often not charging clients who act as the bank's own purchasing agent.","typicalTenor":"Can be a one-off specific agency or an ongoing general agency; it terminates by mutual agreement, unilateral termination, task completion, destruction of the subject matter, or death/loss of capacity.","liquidityTradability":"Not applicable in the usual sense -- Wakalah creates a service relationship rather than a tradable financial claim, though the transactions it enables may be tradable per their own rules.","commonUse":"Used pervasively as a supporting contract across almost every Islamic banking mode -- Murabaha, Salam, Istisna'a, Ijarah, Diminishing Musharakah -- plus standalone fund management (Wakalatul Istismar), L/C handling, and bill collection.","keyConditions":["The delegated act must be clearly known and must admit representation (excludes personal acts like prayer or giving testimony).","Agency is not permitted for unlawful acts (theft, Riba-based dealing) or acts of disobedience.","The agent must perform per the principal's instructions with due care and skill, and may not sub-delegate without consent.","The agent must avoid conflicts of interest -- e.g. cannot sell his own property to the principal without full disclosure.","An agency contract can be specific or general, but the scope of work must be clearly defined either way."],"majorRisks":["Agency (moral hazard) risk -- the agent may not act with full diligence, especially where he is also a counterparty (as in Murabaha's client-as-agent structure).","Fuduli risk -- an agent acting beyond his authority creates a contract valid only subject to the principal's ratification.","Shari'ah-compliance risk when agency and sale steps are improperly combined (e.g. double agency for both payment and purchase).","Third-party liability risk, since an agent's dealings can create obligations the principal must honor."],"distinguishingFeature":"Wakalah's defining feature is that the agent's actions and any resulting ownership pass directly to the principal, without the agent bearing risk in a personal capacity absent negligence.","source":{"chapter":13,"section":"13.2","pages":[347,349]},"origin":["f2","f1"],"aliases":["wakalah"],"attributes":{"category":"Accessory (agency)","nature":"Agency, with or without fee","ownership":"Principal owns; agent is trustee","return":"Fee (Wakalatul Istismar)","payment":"Pre-agreed fee","late":"N/A","tenor":"Any","uses":"MPO agency, fund management, Takaful","keyRule":"Agent liable only for negligence","pitfall":"Undisclosed self-dealing"},"topicId":"t13.2"},{"id":"tawarruq","name":"Tawarruq","category":"Trade-based (Sale)","chapter":13,"conceptId":"tawarruq","shariahBasis":"Permitted by the majority (preferred) view across the schools as a genuine credit-then-cash-sale sequence, distinguished from prohibited Bai' al-'Inah because the commodity is sold on to an unrelated third party, not back to the original seller.","subjectMatter":"A liquid, marketable commodity (e.g. exchange-traded metals, shares, or other tradable goods) purchased on deferred payment and then sold for spot cash, purely to generate liquidity rather than to acquire the commodity itself.","ownershipRiskTiming":"The Mutawarriq (liquidity seeker) must take ownership and possession of the commodity from the original seller before reselling it to a genuinely separate third party; ownership/risk briefly passes through the client before being sold on for cash.","returnType":"Fixed","returnTypeDetail":"The bank's return is the fixed profit margin embedded in the credit sale price to the client, realized once the commodity is resold at spot for cash.","typicalTenor":"Short-term, used mainly for liquidity management and interbank placements and for personal financing/credit cards.","liquidityTradability":"The commodity must be genuinely transferred and sold, not merely papered over; commodity-exchange-based Tawarruq (e.g. LME) is flagged as vulnerable to Shari'ah violations if goods never actually move.","commonUse":"Personal and consumer financing, credit cards, and interbank/treasury liquidity management (Commodity Murabaha/Shares Murabaha), used only when no other compliant financing option is available.","keyConditions":["The commodity must be sold to a genuine, unrelated third party -- reselling to the original seller makes it invalid Bai' al-'Inah.","The bank should not appoint the Mutawarriq as its own agent to both buy and then sell the same commodity to himself.","Where the bank acts as agent for the onward sale, this agency should not be stipulated as a condition inside the sale contract.","The transaction must involve real transfer of ownership and possession of an actual commodity, not just an exchange of paperwork.","Scholars cited in the book advise strictly limited, exceptional use, particularly discouraging it for individual consumer financing."],"majorRisks":["High Shari'ah-compliance risk -- widely regarded as a 'grey area' vulnerable to becoming a disguised interest loan if any step is mishandled.","Reputational/systemic risk from widespread or careless use, which scholars warn could undermine the industry's credibility.","Execution risk in commodity-exchange-based structures where actual transfer/possession of the underlying metal may be doubtful.","Counterparty/settlement risk in the rapid buy-then-sell sequence across multiple brokers."],"distinguishingFeature":"Unlike Bai' al-'Inah (prohibited), Tawarruq requires the commodity to be resold to a genuinely separate third party, and the buyer's motive is pure liquidity, not owning the commodity.","source":{"chapter":13,"section":"13.3","pages":[349,351]},"origin":["f2","f1"],"aliases":["tawarruq"],"attributes":{"category":"Accessory (liquidity)","nature":"Credit purchase and spot sale to third party","ownership":"Client owns before selling to third party","return":"Fixed mark-up to financier","payment":"Deferred","late":"Price cannot increase","tenor":"Short-term","uses":"Liquidity, personal finance (cautioned)","keyRule":"Sale to third party; no agency to self","pitfall":"Paper exchange without real trade"},"topicId":"t13.3"},{"id":"juaalah","name":"Ju'alah","category":"Agency-based","chapter":13,"conceptId":"jualah","shariahBasis":"Permitted on the authority of the Qur'an (the King's lost-beaker reward in Surah Yousuf) and Sunnah; it is a contract where a specified reward is promised to whoever achieves a determined result, even where the work needed involves inherent uncertainty.","subjectMatter":"A required end result (not a minutely specified task) to be achieved by an unspecified worker (the general public) or a specified worker, such as recovering a lost asset, collecting overdue debt, or producing a report.","ownershipRiskTiming":"No corpus ownership transfer is involved; entitlement to the reward arises only upon realization of the specified result, and the worker bears the risk of unrewarded effort if the result is never achieved, except in specific defined cases.","returnType":"Fee-based","returnTypeDetail":"A fixed or result-proportional reward (Jua'l) is paid only upon successful realization of the stipulated result; partial advance payment 'on account' is possible but full entitlement stays contingent on completion.","typicalTenor":"Can specify a completion deadline after which the worker forfeits the reward (extendable by mutual consent for genuine cause); otherwise open-ended until the result is achieved or the contract is terminated.","liquidityTradability":"Not a tradable financial instrument -- it is a service/reward contract, and entitlement to reward is personal to the worker who achieves the result.","commonUse":"Used by Islamic banks for recovery of overdue/nonperforming debts, securing feasibility studies to obtain financing, and brokerage -- suited to tasks Ijarah cannot cover because the work cannot be minutely specified in advance.","keyConditions":["The task (required end result) and the reward must both be clearly indicated, even though the work needed to achieve it may remain uncertain.","The reward must be known, valuable, permissible, and deliverable once the result is achieved -- it can be a proportion of the realized result.","The task must not already be a legal/employment obligation of the worker and must involve genuine effort.","Ju'alah is non-binding before work commences (either party may terminate); once work begins, the offeror cannot revoke without paying a reasonable wage.","Parallel Ju'alah is permitted -- a bank can be worker in one contract and offeror in an independent parallel contract with a third party."],"majorRisks":["No-result, no-reward risk for the worker -- if the task fails despite genuine effort, no compensation is due absent a specific exception.","Ambiguity/dispute risk if the required result or reward is not clearly specified up front.","Offeror revocation risk after work has commenced, obligating a reasonable wage despite no result yet achieved.","Counterparty performance risk in Parallel Ju'alah, since the bank stays liable to the original offeror regardless of the parallel worker's performance."],"distinguishingFeature":"Unlike Ijarah, Ju'alah does not require the work itself to be precisely specified -- only the end result and reward -- making it usable for tasks where the effort needed is inherently uncertain.","source":{"chapter":13,"section":"13.4","pages":[351,355]},"origin":["f2","f1"],"aliases":["jualah"],"attributes":{"category":"Accessory (service)","nature":"Reward for a specified result","ownership":"N/A (service)","return":"Reward on achieving result","payment":"On completion","late":"N/A","tenor":"Task-based","uses":"Debt recovery, brokerage, feasibility","keyRule":"No result, no reward","pitfall":"Paying for effort regardless of result"},"topicId":"t13.4","altNames":["Ju‘alah"]},{"id":"sukuk","name":"Sukuk","category":"Capital Market","chapter":15,"conceptId":"sukuk","shariahBasis":"AAOIFI defines Sukuk as certificates of equal value representing undivided ownership shares in tangible assets, usufruct, services, or a specified investment/project; compliance requires interest-bearing debt not to dominate the underlying pool, and the structure to rest on real modes such as Shirkah, Ijarah, Salam, or Istisna'a rather than a disguised loan.","subjectMatter":"A pool or specific asset (real estate, equipment, receivables from real transactions, or a project) transferred to a special purpose vehicle (SPV)/special purpose Mudarabah, whose proportional undivided ownership is represented by the issued certificates.","ownershipRiskTiming":"Sukuk holders collectively own the underlying assets from issuance (via the SPV) and bear the associated risk of loss/underperformance from that point; return and capital recovery depend on the actual performance of the specific underlying assets.","returnType":"Mixed","returnTypeDetail":"Return is variable/participatory when the underlying mode is Shirkah-based (profit/loss share) or quasi-fixed when based on Ijarah/fixed-return modes; a truly fixed return, as with conventional bonds, requires an independent third-party guarantee.","typicalTenor":"Issued for a defined period against specific assets, ranging from about three months to ten years in the book's account of market practice.","liquidityTradability":"Ijarah- and Shirkah-based Sukuk (representing real asset/usufruct ownership) can be actively traded at market-determined prices; Sukuk relying on Bai' al-Dayn-based secondary trading (criticized in some Malaysian structures) are Shari'ah-contentious among the majority of scholars.","commonUse":"Sovereign and corporate funding of large infrastructure and development projects, an alternative to conventional bonds for issuers, and a liquidity-management/diversification instrument for Islamic banks -- the book's case studies include Pakistan's motorway and WAPDA power Sukuk.","keyConditions":["The underlying assets transferred to the SPV must involve a real, complete, irrevocable transfer, not merely a paper assignment.","Interest-bearing debt must not be the dominant component of the asset pool for the certificates to be Shari'ah-compliant.","In sale-and-lease-back Ijarah Sukuk, a reasonable interval should separate the sale to the SPV and any eventual repurchase, to avoid Bai' al-'Inah.","Secondary-market trading must correspond to trading real ownership of tangible assets/usufruct (Ijarah/Shirkah basis), not a discounted debt claim (Bai' al-Dayn), which the majority of jurists reject.","Any guarantee making returns fully fixed must come from an independent third party, not the issuer/manager guaranteeing its own capital or profit."],"majorRisks":["Shari'ah-compliance risk where structures (e.g. Bai' al-'Inah or Bai' al-Dayn-based secondary trading) resemble conventional interest-bearing bonds in substance.","Asset/collateral risk -- variation in the value or performance of the underlying assets directly affects Sukuk holder returns.","Credit and bankruptcy risk of the originator/obligor, plus payment risk from credit-enhancement providers and legal/regulatory risk.","Liquidity and market risk, since secondary-market depth varies by structure, and reliance on Ijarah Sukuk alone may not sustain the industry's full securitization potential."],"distinguishingFeature":"Unlike a conventional bond (a pure debt claim), a Sukuk represents proportional real ownership in underlying tangible assets, usufruct, or a project -- its return and tradability derive from that asset's actual performance.","source":{"chapter":15,"section":"15.1-15.4","pages":[389,416]},"origin":["f2"],"aliases":[],"topicId":"t15.1"},{"id":"takaful","name":"Takaful","category":"Risk-Pooling","chapter":16,"conceptId":"takaful","shariahBasis":"Developed as a cooperative alternative to conventional insurance -- rejected by the majority of scholars for containing Riba, Gharar, and Maisir -- Takaful is grounded in mutual-help concepts like 'Aqilah (shared tribal responsibility) and Waqf (endowment), converting the relationship into mutual donation (Tabarru') rather than a commutative risk-transfer sale.","subjectMatter":"Participant contributions (split into a donation/protection portion and, for family Takaful, a savings/investment portion) pooled into a Takaful (often Waqf) fund used to pay claims to participants who suffer a defined loss.","ownershipRiskTiming":"Once contributed as Tabarru' (donation) to the fund, participants relinquish individual ownership of that portion; the underwriting surplus or deficit (UWS/UWL) belongs collectively to the participants, while the operator manages the fund as Wakil and/or Mudarib for a fee/profit share.","returnType":"Mixed","returnTypeDetail":"The operator earns a Wakalah management fee and/or a Mudarabah share of investment profit; participants may receive a share of any underwriting surplus and, in family Takaful, their accumulated savings/investment portion plus profit at maturity.","typicalTenor":"Mirrors conventional insurance terms -- ongoing and renewed periodically for general Takaful, or running to a defined policy term for family (life) Takaful savings/protection plans.","liquidityTradability":"Not a tradable market instrument; a participant's claim is a right to a defined benefit/beneficiary share from the fund, not a security, though the fund's own investments must be Shari'ah-compliant.","commonUse":"Shari'ah-compliant risk cover for individuals and businesses, including insuring assets underlying other Islamic bank contracts (auto Ijarah, Murabaha goods in transit, Istisna'a projects), plus family (life) Takaful savings/protection plans.","keyConditions":["The core contribution (or a defined portion) must be structured as Tabarru' (donation) to the mutual fund, not a commutative premium-for-indemnity exchange.","The underwriting surplus or deficit (UWS/UWL) must belong to the participants as a group, not to the operator/shareholders.","The operator's compensation must be a defined Wakalah fee and/or Mudarabah profit share -- not a share of UWS alone without bearing corresponding downside.","Fund investments must be made only in Shari'ah-compliant avenues, avoiding Riba-based instruments.","A Waqf structure (or Wakalah-Waqf combination) is regarded by the cited contemporary scholarly consensus as the most Shari'ah-robust model."],"majorRisks":["Model-design (Shari'ah-compliance) risk -- pure Wakalah, pure Mudarabah, and combined models each face specific scholarly objections.","Fund solvency/deficit risk -- if claims exceed the pool and reserves, the operator must extend Qard al-Hasan to cover the shortfall.","Governance/trust risk given the operator's dual roles (Wakil and/or Mudarib) and the need for transparent surplus and fee allocation.","Re-Takaful (reinsurance) counterparty risk when funds cede catastrophic-loss risk to re-Takaful operators."],"distinguishingFeature":"Unlike conventional insurance's premium-for-indemnity risk transfer, Takaful is built on mutual donation (Tabarru') among participants, with the underwriting surplus belonging to the participant pool rather than the operator/shareholders.","source":{"chapter":16,"section":"16.1-16.4","pages":[417,426]},"origin":["f2"],"aliases":[],"topicId":"t16.1"},{"id":"qard-hasan","name":"Qard Hasan","category":"Loan-based (Qard)","chapter":7,"conceptId":"qard","shariahBasis":"Qard is a virtuous, interest-free loan sanctioned by the Qur'an and Sunnah: legally, giving something of value into another's ownership by way of virtue, repayable in a similar amount, with any stipulated excess over the principal constituting Riba.","subjectMatter":"Cash or another valuable, fungible item advanced to a borrower for his own benefit -- most commonly cash placed in a current/Qard-based deposit account or lent for a genuine social or microfinance need.","ownershipRiskTiming":"Ownership of the loaned item transfers fully to the borrower immediately on disbursement, who may use, sell, or donate it as he wishes; only a similar amount/value need be returned, on demand (Qard) or at a settled time.","returnType":"None (interest-free)","returnTypeDetail":"No return over the principal may be stipulated or expected at all -- the lender cannot benefit from the loan, and even accepting an unstipulated post-loan gift from the borrower is restricted unless such gift-giving already predated and was customary between them.","typicalTenor":"Classically repayable on demand at any time since Qard is defined by the amount rather than a fixed term; can also be settled at a mutually agreed date without any extra value attaching to the delay.","liquidityTradability":"Not a tradable instrument -- it is a debt (Dayn) owed at exactly its face value, which cannot be sold at a discount or carry any time-value premium.","commonUse":"Bank current accounts (deposits the book treats as interest-free loans to the bank) and benevolent/social lending such as microfinance and hardship loans.","keyConditions":["Any condition attaching a benefit or increase to the loan -- whether in quantity or quality -- makes it void as Riba.","The loan must not be made conditional upon any other contract, such as a sale (Bai').","Repayment is due on demand under Qard, since the amount rather than a fixed term defines it; a similar (not necessarily identical) amount/value must be returned.","A creditor may not accept even a gift from the borrower after the loan unless such gift-exchange predates and was already customary between them.","No value can be assigned to the time given for repayment -- once the amount is mutually fixed, exactly that amount is owed regardless of delay."],"majorRisks":["Full credit/default risk borne by the lender, since no collateral or return compensates for the risk taken.","No compensation for inflation or delay -- the lender recovers only the nominal amount lent, even after a long deferral.","Moral-hazard/wilful-default risk on the borrowing side, since repayment relies on the debtor's diligence and on religious injunctions against delay that carry no direct commercial enforcement.","Opportunity-cost risk for a bank funding Qard Hasan facilities or covering a shortfall (e.g. a Takaful fund deficit), since the committed funds earn no return."],"distinguishingFeature":"Unlike every other product in this matrix, Qard Hasan carries zero markup, rent, or profit share by definition -- the lender may recover only the exact principal (or its equivalent value), making it the sole genuinely benevolent, non-commercial mode.","source":{"chapter":7,"section":"7.2, 7.7","pages":[155,161]},"origin":["f2"],"aliases":[],"topicId":"t7.2"},{"id":"kafalah","name":"Kafalah","category":"Guarantee-based","chapter":7,"conceptId":"security","shariahBasis":"A pre-Islamic guarantee practice approved by the Prophet, in which a third party voluntarily becomes surety (Kafil) for a debt or liability unpaid by the person originally responsible, provided the scope of the suretyship is known and free of preconditions.","subjectMatter":"A guarantee of payment or performance -- a third party's (the Kafil's) promise to pay a debt, fine, or other liability, or to ensure a person's court appearance, if the original obligor defaults.","ownershipRiskTiming":"No asset ownership changes hands; the surety's liability arises only if and when the original debtor fails to pay, at which point the creditor may claim from either the debtor or the surety.","returnType":"Fee-based","returnTypeDetail":"Classically Kafalah is a gratuitous, non-commutative undertaking, but banks issuing letters of guarantee in trade finance charge a service/commission fee for the facility rather than for the guarantee liability itself.","typicalTenor":"Runs for the life of the underlying obligation it secures, ending once that debt is discharged or the guaranteed liability lapses; any delay granted to the principal debtor extends automatically to the surety.","liquidityTradability":"Not a tradable instrument -- Kafalah creates a personal, non-assignable surety obligation rather than a claim that can be sold or transferred.","commonUse":"Bank guarantees and letters of guarantee supporting trade finance and contract performance, alongside tools like third-party guarantees, Hamish Jiddiyah, and post-dated cheques used to secure a bank's financing exposure.","keyConditions":["The scope/degree of the suretyship must be known and must not come with preconditions.","A surety agreement becomes enforceable once offered and accepted by the claimant/creditor.","Multiple simultaneous (joint) sureties for one obligation each bear only their own share, but successive sureties, one after another, are each liable for the whole debt.","If the guarantor undertakes to remit the principal debtor's debt himself, the effect becomes equivalent to Hawalah (transfer of debt).","A delay granted to the principal debtor extends automatically to the surety, but a delay given only to the surety does not extend to the principal debtor."],"majorRisks":["Full contingent credit risk for the surety/bank if the principal debtor defaults and the guarantee is called.","Shari'ah-compliance risk if a fee is structured so as to effectively price the guarantee liability itself rather than a genuine service.","Recourse/recovery risk against the original debtor once the surety has paid the creditor.","Documentation risk, since the suretyship's scope must be clearly defined or the guarantee can be disputed as invalid."],"distinguishingFeature":"Unlike Rahn, which secures a debt with a pledged asset, Kafalah secures it with a third party's personal promise to pay -- no property changes hands unless and until the guarantee is actually called.","source":{"chapter":7,"section":"7.15","pages":[168,170]},"origin":["f2"],"aliases":[],"topicId":"t7.15"},{"id":"hawalah","name":"Hawalah","category":"Debt-Transfer","chapter":7,"conceptId":"hawalah","shariahBasis":"Hawalah is an agreement by which a debtor is freed from his debt by another party becoming responsible for it, encouraged by the Prophet's own guidance to accept transfer to a trustworthy, wealthy debtor, and permissible -- unlike an outright sale of debt -- because it preserves recourse to the original debtor.","subjectMatter":"An existing monetary debt (Dayn), transferred from the original debtor (assignor) to a new debtor (assignee) who undertakes to pay the creditor.","ownershipRiskTiming":"Responsibility for the debt shifts to the assignee immediately once Hawalah is contracted -- it must take effect at once and cannot be suspended or made contingent -- though the obligation reverts to the original assignor if the new debtor later becomes bankrupt or dies.","returnType":"Fee-based","returnTypeDetail":"Hawalah itself is a noncommutative contract -- the assignee cannot take remuneration for the transfer service -- though banks providing remittance/transfer facilities built on Hawalah charge a separate service fee for the operational service.","typicalTenor":"Takes effect immediately upon the contract, though the actual payment date of the transferred debt can be deferred to a mutually agreed future date.","liquidityTradability":"Assignable only at the debt's nominal (face) value with recourse preserved to the original debtor -- this is what distinguishes it from a prohibited discounted sale of debt, which carries no such recourse.","commonUse":"Modern bank instruments the book identifies as forms of Hawalah -- cheques, drafts, pay orders, remittances, promissory notes, bills of exchange, overdrafts, and endorsements -- used for fund transfers and receivables assignment.","keyConditions":["Hawalah must take effect immediately; it cannot be suspended for a period, made temporary, or contingent on a future unlikely event.","It is valid only by mutual consent between the assignor (original debtor) and the assignee (new debtor).","The assignee cannot take any remuneration for the transfer, since Hawalah is a noncommutative contract.","It is a binding contract once concluded and is not subject to unilateral termination.","Assignment is permitted only at the debt's nominal value -- discounting the transferred amount would make it a prohibited sale of debt."],"majorRisks":["Assignee (new debtor) credit/default risk, which the original assignor may still bear via recourse.","Reversion risk -- if the assignee becomes bankrupt or dies, the obligation to pay can revert to the original assignor.","Shari'ah-compliance risk if the arrangement drops the recourse feature, effectively becoming a prohibited discounted sale of debt.","Operational/settlement risk in high-volume instruments (cheques, remittances) built on the Hawalah structure."],"distinguishingFeature":"Unlike the prohibited sale of debt (a discounted Bai' al-Dayn with no recourse), Hawalah is permitted specifically because it transfers the debt at par value while preserving the creditor's recourse to the original debtor if the new debtor defaults.","source":{"chapter":7,"section":"7.14","pages":[167,168]},"origin":["f2"],"aliases":[],"topicId":"t7.14"},{"id":"rahn","name":"Rahn","category":"Collateral-based","chapter":7,"conceptId":"security","shariahBasis":"Sanctioned directly by the Qur'an (2:283, \"Rihn Maqbudah\" -- a pledge with possession), permissible whether travelling or at home and even between a Muslim and non-Muslim; the debtor hands over property as security while the creditor holds it strictly as a trust, not as owner.","subjectMatter":"Any asset that is a valid subject of sale -- including a share in jointly owned property -- pledged by the debtor (pledger) to the creditor (pledgee) as collateral, encumbered only to the extent of the debt.","ownershipRiskTiming":"Ownership, risk, and reward (Ghunm/Ghurm) of the pledged property remain with the pledger throughout; the pledgee only holds possession as a trustee and is not liable if the pledge is lost or destroyed without proven negligence.","returnType":"Fee-based","returnTypeDetail":"Rahn itself creates no return for the pledgee, but jurists differ on whether the pledgee may derive some benefit from the pledged asset (e.g. use, or a maintenance-linked charge) while holding it, generally capped at the level of upkeep expenditure.","typicalTenor":"Runs alongside the underlying debt it secures, ending when the debt is repaid (releasing the pledge) or, on default, when the pledgee obtains a court-sanctioned sale of the pledged item to recover the debt.","liquidityTradability":"The pledge itself is not a tradable claim -- \"pledge cannot be foreclosed\", meaning the pledgee may never simply appropriate or sell it outright on default but must proceed through the courts (or a pre-agreed power of attorney) to realize it.","commonUse":"Collateralized and pawn-based Islamic microfinance, and as a general security device banks combine with other guarantee tools to secure financing exposure.","keyConditions":["Whatever is a valid subject of a sale can be pledged, encumbered only to the extent of the debt it secures.","The pledger retains ownership and bears the pledge's risk and reward (Ghunm/Ghurm) throughout.","The pledgee holds the pledge as a trust and is not liable for loss absent proven negligence.","A provision letting the pledgee simply take over the pledged item in place of the debt on default is not valid -- \"pledge cannot be foreclosed\".","Any pledgee benefit from the asset is disputed among the schools and, where allowed, should correspond to maintenance cost rather than be stipulated as extra return."],"majorRisks":["Valuation and market risk on the pledged asset, since recovery depends on the item's sale value on default.","Enforcement/liquidity risk, since the pledgee cannot simply seize the item and must pursue a court-sanctioned sale process.","Shari'ah-compliance risk if pledgee benefit from the asset is stipulated as a condition at contract time in a way that amounts to Riba.","Custodial risk for the pledgee as trustee of the pledged property until the debt is settled."],"distinguishingFeature":"Unlike Kafalah's personal third-party guarantee, Rahn secures a debt with a specific pledged asset that the debtor himself continues to own and bear the risk/reward of, while the creditor merely holds it in trust.","source":{"chapter":7,"section":"7.15","pages":[168,172]},"origin":["f2"],"aliases":[],"topicId":"t7.15"},{"id":"bai-al-istijrar","name":"Bai' al Istijrar","category":"Trade-based (Sale)","chapter":13,"conceptId":"istijrar","shariahBasis":"Not a distinct Shari'ah mode but an ordinary repeat sale/purchase arrangement, permitted with some scholarly relaxation on price fixation and payment timing because it reflects normal, everyday wholesaler-retailer business, provided the arrangement involves no Gharar.","subjectMatter":"A commodity or product a supplier agrees to deliver to a buyer repeatedly, in various amounts or a series of consignments, under one master supply agreement rather than a fresh contract each time.","ownershipRiskTiming":"Ownership and risk of each consignment pass to the buyer on that delivery, exactly as in an ordinary cash or credit sale; where the arrangement is structured through a specific mode like Murabaha, that mode's own ownership/possession requirements apply to each consignment.","returnType":"Fixed","returnTypeDetail":"Price may be fixed in advance for the whole arrangement, per consignment, or settled after all consignments are delivered, with payment typically collected periodically (e.g. monthly) rather than transaction by transaction.","typicalTenor":"Ongoing/recurring for as long as the master supply agreement runs, structured around regular (e.g. monthly) delivery and payment cycles rather than a single one-off transaction.","liquidityTradability":"Creates the same receivables/debts as whichever underlying sale structure is used (cash or credit); any deferred-payment balance follows ordinary Dayn rules and cannot be traded at a discount.","commonUse":"Ongoing supply financing between wholesalers and retailers, or banks and clients needing recurring commodity deliveries -- the book's example is a bread supplier delivering daily to a retailer and collecting payment once a month.","keyConditions":["The arrangement must not involve Gharar to qualify for the relaxed treatment scholars allow on price fixation and payment timing.","Price can be fixed in advance for the whole series, with each individual consignment, or after all consignments are delivered.","If a specific mode such as Murabaha is used to structure the supply, that mode's full Shari'ah conditions must still be met for every single consignment.","Under a Murabaha-based Istijrar, a separate offer and acceptance is required for each consignment, based on the client's requisition each time."],"majorRisks":["Shari'ah-compliance risk if the relaxed price/payment flexibility is used to disguise Gharar in an otherwise ordinary sale.","Price risk over the life of a long master agreement if a price fixed once in advance diverges from later market prices.","Supplier/delivery risk across a long series of consignments if any single delivery falls short of the agreed specification.","Documentation risk if the underlying specific mode's per-consignment requirements (e.g. Murabaha's offer/acceptance) are not properly executed each time."],"distinguishingFeature":"Unlike an ordinary Murabaha or Musawamah negotiated afresh for each transaction, Bai' al Istijrar fixes price/terms once under a master agreement covering a whole series of repeat deliveries -- though any specific mode layered on top (e.g. Murabaha) must still satisfy its own conditions per consignment.","source":{"chapter":13,"section":"13.5","pages":[355]},"origin":["f2"],"aliases":[],"topicId":"t13.5"}]);
