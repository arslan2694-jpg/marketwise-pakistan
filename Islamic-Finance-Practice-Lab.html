ss share is met first from the Takaful fund."],"pitfalls":["Treating refinance as a fixed-rate loan"],"origin":["f1"]},{"id":"running-musharakah","title":"Running Musharakah (working capital)","topicId":"t12.7.2","conceptId":"musharakah","modeId":"musharakah","productIds":["running-musharakah"],"summary":"The bank provides a Musharakah limit for the client’s running business. Sale proceeds of finished goods flow through a Running Musharakah Account, and each month or quarter the bank takes its agreed share of the computed operating profit.","parties":[{"id":"bank","label":"Islamic bank","x":15,"y":30},{"id":"account","label":"Running Musharakah Account","x":50,"y":30},{"id":"client","label":"Client’s business","x":85,"y":30}],"steps":[{"from":"bank","to":"account","kind":"contract","label":"Musharakah limit approved","detail":"Clients are grouped as seasonal, cyclical or continuous for the period of the limit (p. 333)."},{"from":"account","to":"client","kind":"cash","label":"Client draws as needed","detail":"The bank’s capital is measured by the average amount utilised (daily product) (p. 314)."},{"from":"client","to":"account","kind":"cash","label":"Sale proceeds credited","detail":"Only proceeds from selling finished goods — not sales of fixed assets or long-term loans."},{"from":"account","to":"bank","kind":"cash","label":"Periodic profit share","detail":"Based on the computed operating profit for the period, at the agreed ratio."},{"from":"client","to":"bank","kind":"risk","label":"Loss shared by capital","detail":"Security covers only negligence, misconduct or breach."}],"rules":["Profit is a ratio of actual operating profit, never a fixed amount.","Loss follows the capital ratio."],"pitfalls":["Crediting non-operating cash flows to inflate the base","Guaranteeing the bank’s profit"],"origin":["f1"]},{"id":"musawamah-export","title":"Musawamah alternative to bill discounting (Section 14.4.2)","topicId":"t14.4.2","conceptId":"musawamah","modeId":"musawamah","productIds":["export-bill-musawamah"],"summary":"Instead of discounting an export bill, the bank advances local currency to the exporter as its agent to buy goods, then sells him those goods for the bill’s foreign-currency amount, payable on the bill date.","parties":[{"id":"bank","label":"Islamic bank","x":15,"y":30},{"id":"exporter","label":"Exporter (client/agent)","x":50,"y":30},{"id":"foreign","label":"Foreign buyer’s bank","x":85,"y":30}],"steps":[{"from":"exporter","to":"bank","kind":"contract","label":"Bill US$100,000 due in 55 days","detail":"Spot Rs.57.75; the bank quotes Rs.57.60 (p. 371)."},{"from":"bank","to":"exporter","kind":"cash","label":"Rs.5,760,000 as agent to buy goods","detail":"Under an agency agreement, for the raw materials the exporter needs."},{"from":"exporter","to":"bank","kind":"goods","label":"Declaration of possession","detail":"The exporter buys the goods for the bank and declares possession."},{"from":"exporter","to":"bank","kind":"contract","label":"Offer to buy for US$100,000","detail":"Payable on 25 February; the bank accepts — a Musawamah sale."},{"from":"foreign","to":"exporter","kind":"cash","label":"Bill proceeds received","detail":"Remitted into the exporter’s account at the Islamic bank."},{"from":"exporter","to":"bank","kind":"cash","label":"US$100,000 debited","detail":"Settles the Musawamah price."}],"rules":["The bank must own the goods before selling them.","No discounting of the bill itself."],"pitfalls":["Paying cash without any goods changing hands"],"origin":["f1"]},{"id":"import-murabaha","title":"Import L/C Murabaha with sub-Murabaha (Section 14.4.2)","topicId":"t14.4.2","conceptId":"murabaha","modeId":"murabaha","productIds":["import-murabaha","shipping-guarantee-murabaha"],"summary":"The bank opens an L/C to import goods for itself through the client as agent. When documents arrive it sells the goods to the client, for cash (Musawamah at L/C cost plus charges) or on credit (sub-Murabaha).","parties":[{"id":"client","label":"Importer (agent/buyer)","x":12,"y":30},{"id":"bank","label":"Islamic bank","x":50,"y":30},{"id":"exporter","label":"Foreign exporter","x":88,"y":30}],"steps":[{"from":"client","to":"bank","kind":"agency","label":"Master Murabaha + agency agreement","detail":"Signed before the L/C is opened (p. 372)."},{"from":"bank","to":"exporter","kind":"contract","label":"L/C opened","detail":"At the client’s request, with the relevant documents."},{"from":"exporter","to":"bank","kind":"goods","label":"Goods shipped; documents to bank","detail":"The goods are at the bank’s risk."},{"from":"bank","to":"exporter","kind":"cash","label":"Nostro debited — bill paid","detail":"Profit on credit runs from this date."},{"from":"bank","to":"client","kind":"contract","label":"Sub-Murabaha or Musawamah","detail":"Credit: client offers, bank accepts; price fixed. Cash: L/C cost plus charges."},{"from":"client","to":"bank","kind":"cash","label":"Payment on settlement date","detail":"If a shipping guarantee was used, only the cost part can be adjusted later."}],"rules":["The agency must precede the purchase.","Profit runs from the Nostro debit to the settlement date."],"pitfalls":["Adjusting the profit part after the sale"],"origin":["f1"]},{"id":"mudarabah-sukuk","title":"Mudarabah Sukuk (OIC Fiqh Council 1988)","topicId":"t15.3.5","conceptId":"mudarabah","modeId":"mudarabah","productIds":["mudarabah-sukuk"],"summary":"The issuer, as Mudarib, raises capital from subscribers through Mudarabah certificates and invests it in a project. Profit is shared by the prospectus ratio, and loss falls on the certificate holders.","parties":[{"id":"holders","label":"Certificate holders (Rabbul-mal)","x":12,"y":30},{"id":"issuer","label":"Issuer / SPV (Mudarib)","x":50,"y":30},{"id":"project","label":"Project","x":88,"y":30}],"steps":[{"from":"issuer","to":"holders","kind":"contract","label":"Prospectus: capital, ratio, conditions","detail":"No guarantee of capital or of a fixed profit by the issuer (p. 399)."},{"from":"holders","to":"issuer","kind":"cash","label":"Subscription = Mudarabah capital","detail":"The Mudarib may add its own funds and earn on them too."},{"from":"issuer","to":"project","kind":"cash","label":"Capital deployed","detail":"Trading rules change as cash becomes assets."},{"from":"project","to":"issuer","kind":"cash","label":"Project income","detail":"The P&L account must be published to holders."},{"from":"issuer","to":"holders","kind":"cash","label":"Profit by agreed ratio","detail":"Reserves may be created; an unrelated third party may promise to cover losses free of charge."},{"from":"project","to":"holders","kind":"risk","label":"Loss borne by holders","detail":"The Mudarib loses its effort only, unless negligent."}],"rules":["Cash stage: Sarf rules; debt stage: debt rules; mixed assets: market price.","No issuer guarantee."],"pitfalls":["Promising a fixed percentage of capital"],"origin":["f1"]},{"id":"hawalah","title":"Hawalah (assignment of debt)","topicId":"t7.14","conceptId":"hawalah","modeId":"hawalah","productIds":[],"summary":"A debtor transfers his debt to a third party, who becomes responsible for paying the creditor; the original debtor is freed. It is gratuitous and at face value.","parties":[{"id":"creditor","label":"Creditor","x":12,"y":30},{"id":"debtor","label":"Original debtor (assignor)","x":50,"y":30},{"id":"assignee","label":"Assignee (new payer)","x":88,"y":30}],"steps":[{"from":"creditor","to":"debtor","kind":"cash","label":"Original debt exists","detail":"E.g. the debtor owes 100,000."},{"from":"debtor","to":"assignee","kind":"contract","label":"Assignment agreed","detail":"Restricted (paid from the assignor’s property held by the assignee) or unrestricted (p. 167)."},{"from":"assignee","to":"creditor","kind":"promise","label":"Assignee accepts liability","detail":"Takes effect immediately; payment may still be at the due date."},{"from":"assignee","to":"creditor","kind":"cash","label":"Payment at face value","detail":"No remuneration for the Hawalah itself; no discount."},{"from":"creditor","to":"debtor","kind":"risk","label":"Recourse if the assignee fails","detail":"On the majority view, the debt returns to the assignor if the assignee dies or becomes bankrupt."}],"rules":["Face value only.","Gratuitous: no fee for the assignment itself."],"pitfalls":["Using it to sell debts at a discount"],"origin":["f1"]},{"id":"istisna-housing","title":"Housing finance through Istisna‘a and Diminishing Musharakah (Box 10.13)","topicId":"t10.11.10","conceptId":"istisna","modeId":"istisnaa","productIds":["apartment-istisna-dm"],"summary":"Client and bank jointly buy a flat under construction from a builder by Istisna‘a; after handover the bank leases its share to the client, who buys it unit by unit.","parties":[{"id":"client","label":"Client A (Rs.2 m)","x":14,"y":30},{"id":"bank","label":"Bank B (Rs.5 m)","x":50,"y":8},{"id":"builder","label":"Builder C","x":86,"y":30}],"steps":[{"from":"client","to":"bank","kind":"contract","label":"Shirkatulmilk pool of Rs.7 m","detail":"A contributes Rs.2 m and B Rs.5 m for a flat priced Rs.7 m (p. 275)."},{"from":"bank","to":"builder","kind":"contract","label":"Joint Istisna‘a with the builder","detail":"A and B jointly contract for a flat of defined specifications."},{"from":"bank","to":"builder","kind":"cash","label":"Rs.7 m in four instalments","detail":"The price is paid as construction proceeds."},{"from":"bank","to":"client","kind":"agency","label":"Client supervises construction","detail":"The bank appoints A its agent to supervise the work."},{"from":"builder","to":"client","kind":"goods","label":"Flat handed over","detail":"Ownership is joint in the ratio 2 : 5."},{"from":"bank","to":"client","kind":"rent","label":"Bank leases its share","detail":"Rent is charged on the bank’s share only."},{"from":"client","to":"bank","kind":"cash","label":"Monthly unit purchases","detail":"Rent falls after each unit; after ten years ownership passes to A (Diminishing Musharakah)."}],"rules":["The builder deals in cash and has no financing relationship with the bank.","Rent starts only after handover; before that the bank is a co-owner of a flat under construction."],"pitfalls":["Charging rent during construction","Treating the bank’s share as a loan"],"origin":["f1"]},{"id":"istisna-export","title":"Istisna‘a for pre-shipment export finance (Box 10.14)","topicId":"t10.11.10","conceptId":"istisna","modeId":"istisnaa","productIds":["export-istisna"],"summary":"The bank buys the export goods from the exporter by Istisna‘a, takes delivery and bears their risk, then exports them through the exporter as its agent.","parties":[{"id":"exporter","label":"Exporter A","x":14,"y":30},{"id":"bank","label":"Bank B","x":50,"y":8},{"id":"importer","label":"Foreign importer","x":86,"y":30}],"steps":[{"from":"bank","to":"exporter","kind":"contract","label":"Istisna‘a for Rs.100 m","detail":"Garments of a specified nature to be supplied within three months (p. 276)."},{"from":"bank","to":"exporter","kind":"agency","label":"Exporter appointed export agent","detail":"Effective once the garments are the bank’s."},{"from":"importer","to":"bank","kind":"contract","label":"L/C of Rs.110 m","detail":"Opened in the bank’s name. If an L/C already exists, Istisna‘a is not possible (it would be ‘Inah)."},{"from":"exporter","to":"bank","kind":"goods","label":"Bank takes delivery","detail":"Actual or constructive possession; the garments are now at the bank’s risk."},{"from":"exporter","to":"importer","kind":"goods","label":"Goods exported as the bank’s agent","detail":"Documents are sent on the bank’s behalf."},{"from":"importer","to":"bank","kind":"cash","label":"Rs.110 m under the L/C","detail":"The bank’s gross margin of Rs.10 m is earned by owning and exporting goods."}],"rules":["No existing L/C for the same sale when the Istisna‘a is signed.","The bank must take delivery and bear the goods’ risk before export."],"pitfalls":["Buying from the exporter after the L/C is opened","Skipping the bank’s possession"],"origin":["f1"]},{"id":"ijarah-istisna-project","title":"Syndicated Ijarah–Istisna‘a for an oil terminal (p. 374)","topicId":"t14.4.3","conceptId":"istisna","modeId":"istisnaa","productIds":["syndication"],"summary":"A consortium commissions the terminal by Istisna‘a, with the operator supervising as its agent, and leases the completed terminal to the operator under a prior binding promise.","parties":[{"id":"operator","label":"Terminal operator","x":14,"y":30},{"id":"syndicate","label":"Bank consortium","x":50,"y":8},{"id":"contractor","label":"Contractor","x":86,"y":30}],"steps":[{"from":"operator","to":"syndicate","kind":"promise","label":"Binding promise to lease","detail":"A unilateral promise gives the consortium comfort before it commits funds."},{"from":"syndicate","to":"contractor","kind":"contract","label":"Istisna‘a to build the terminal","detail":"Price paid in stages as the work proceeds."},{"from":"syndicate","to":"operator","kind":"agency","label":"Operator supervises construction","detail":"As the consortium’s agent."},{"from":"contractor","to":"syndicate","kind":"goods","label":"Completed terminal delivered","detail":"The consortium owns it and bears ownership risk."},{"from":"syndicate","to":"operator","kind":"rent","label":"Ijarah executed","detail":"Rent runs only once the terminal is ready for use."}],"rules":["Ijarah cannot start until the asset exists and can be used.","The consortium members own the terminal in proportion to their funding."],"pitfalls":["Charging rent during construction","Signing the Ijarah before the asset exists"],"origin":["f1"]},{"id":"interbank-mii","title":"Mudarabah interbank investment (MII, Malaysia’s IIMM)","topicId":"t8.8.5","conceptId":"liquidity","productIds":["interbank-mudarabah"],"summary":"A surplus bank invests with a deficit bank on Mudarabah for overnight to 12 months; the return is a negotiated share of the investee’s actual profit rate, known only at the end.","parties":[{"id":"investor","label":"Surplus (investor) bank","x":14,"y":30},{"id":"investee","label":"Deficit (investee) bank","x":86,"y":30},{"id":"bnm","label":"Central bank (BNM)","x":50,"y":4}],"steps":[{"from":"bnm","to":"investee","kind":"contract","label":"Minimum benchmark rate","detail":"From February 1996: government investment issue rate + 0.5 %, so only banks with reasonable returns take funds (p. 206)."},{"from":"investor","to":"investee","kind":"contract","label":"Profit-sharing ratio negotiated","detail":"Tenor from overnight to 12 months."},{"from":"investor","to":"investee","kind":"cash","label":"Principal placed","detail":"The investee uses it in its Shari’ah-compliant business."},{"from":"investee","to":"investor","kind":"risk","label":"Return not known in advance","detail":"Based on the investee’s gross profit rate before distribution on one-year investments."},{"from":"investee","to":"investor","kind":"cash","label":"Principal + share of profit at maturity","detail":"The actual return crystallises at the end of the period."}],"rules":["No fixed return: the ratio is agreed, and the rate is known only at the end.","The benchmark filters participants; it is not a guarantee."],"pitfalls":["Treating the placement as a fixed-rate deposit","Promising the benchmark as the return"],"origin":["f1"]},{"id":"dm-construction","title":"House on the customer’s land: sale and lease-back Diminishing Musharakah (Box 12.4)","topicId":"t12.9.2","conceptId":"diminishing-musharakah","modeId":"diminishing-musharakah","productIds":["house-construction-dm"],"summary":"The bank buys part of the client’s land to become co-owner, releases the price in instalments to build the house, then leases its share and sells it back unit by unit.","parties":[{"id":"client","label":"Client (owns the land)","x":14,"y":30},{"id":"bank","label":"Islamic bank","x":86,"y":30},{"id":"house","label":"Joint property","x":50,"y":56}],"steps":[{"from":"client","to":"bank","kind":"ownership","label":"Bank buys 8 of 10 land units","detail":"Land worth Drs 1,000,000; the bank buys Drs 800,000 of it (Shirkatulmilk)."},{"from":"bank","to":"client","kind":"cash","label":"Price paid in four instalments","detail":"Drs 200,000 each; the client uses them to build the house."},{"from":"client","to":"house","kind":"goods","label":"House built on the joint land","detail":"The client supervises the construction."},{"from":"bank","to":"client","kind":"rent","label":"Lease of the bank’s share","detail":"Starts when the house is habitable; for the first year only rent is paid, so it does not fall."},{"from":"client","to":"bank","kind":"cash","label":"Unit purchases begin a year after the last instalment","detail":"The gap avoids buy-back (‘Inah); rent falls with each unit bought."},{"from":"bank","to":"client","kind":"ownership","label":"Title passes after the last unit","detail":"For a renovation, rent starts from the first month because the client already lives in the house."}],"rules":["One-year gap before units are sold back (p. 341).","No rent until the house can be used (except in a renovation)."],"pitfalls":["Selling units back immediately (‘Inah)","Charging rent during construction"],"origin":["f1"]},{"id":"post-shipment","title":"Post-shipment finance: Qard against the export bill plus a collection fee","topicId":"t14.4.2","conceptId":"qard","modeId":"qard-hasan","productIds":["post-shipment-qard"],"summary":"Instead of discounting, the bank lends the bill amount interest-free, collects the bill as the exporter’s agent for a flat fee, and may earn the exchange differential through a promise.","parties":[{"id":"exporter","label":"Exporter","x":14,"y":30},{"id":"bank","label":"Islamic bank","x":50,"y":6},{"id":"importer","label":"Importer’s bank","x":86,"y":30}],"steps":[{"from":"exporter","to":"bank","kind":"contract","label":"Bill lodged for collection","detail":"The bank acts as collecting agent (Wakalah)."},{"from":"bank","to":"exporter","kind":"cash","label":"Qard at face value, at spot rate","detail":"No deduction that grows with time (p. 371)."},{"from":"exporter","to":"bank","kind":"promise","label":"Promise to sell the FX proceeds","detail":"Exchange at settlement; the rate differential is the bank’s income (Box 8.2)."},{"from":"importer","to":"bank","kind":"cash","label":"Bill paid at maturity","detail":"Proceeds repay the Qard."},{"from":"exporter","to":"bank","kind":"cash","label":"Flat collection fee","detail":"Related to the amount, not to the days outstanding."}],"rules":["Face value; no time-based charge on the loan.","The FX leg is a promise; the actual exchange is spot at settlement."],"pitfalls":["A fee that rises with the number of days","Buying the bill at a discount"],"origin":["f1"]},{"id":"islamic-fund","title":"Islamic equity fund: screening and purification","topicId":"t8.8.1","conceptId":"screening","productIds":["equity-fund"],"summary":"Investors pool money with a manager who invests only in screened shares, purifies tainted income and distributes actual gains pro rata.","parties":[{"id":"investors","label":"Unit holders","x":12,"y":30},{"id":"manager","label":"Fund manager","x":50,"y":30},{"id":"stocks","label":"Screened companies","x":88,"y":30},{"id":"charity","label":"Charity account","x":50,"y":58}],"steps":[{"from":"investors","to":"manager","kind":"cash","label":"Subscriptions","detail":"No guarantee of principal or of a rate of profit (p. 202)."},{"from":"manager","to":"stocks","kind":"contract","label":"Screen before buying","detail":"Halal business; debt, cash and receivables each < 33 % of average market cap (DJIM)."},{"from":"manager","to":"stocks","kind":"cash","label":"Shares bought","detail":"Regular income, capital gain, aggressive or balanced strategy."},{"from":"stocks","to":"manager","kind":"cash","label":"Dividends and capital gains","detail":"Returns as actually earned."},{"from":"manager","to":"charity","kind":"cash","label":"Purification","detail":"Charity rate (non-compliant income ÷ gross revenue) × dividend (Al Meezan method)."},{"from":"manager","to":"investors","kind":"cash","label":"Net returns pro rata","detail":"The manager takes a profit share (Mudarabah) or a fee on NAV (agency)."}],"rules":["Screen and re-screen; divest stocks that fail.","Purify income; the manager is not obliged to purify its own fee."],"pitfalls":["Promising a fixed return","Keeping non-compliant income"],"origin":["f1"]},{"id":"salam-sukuk","title":"Salam Sukuk: Bahrain’s aluminium securities (BMA, 2001)","topicId":"t15.3.5.c","conceptId":"salam","modeId":"salam","productIds":["salam-sukuk"],"summary":"Banks pay the government in advance for aluminium to be delivered in three months, then appoint the government to sell it on their behalf.","parties":[{"id":"banks","label":"Participating banks (Sukuk holders)","x":12,"y":30},{"id":"bib","label":"Bahrain Islamic Bank (representative)","x":50,"y":6},{"id":"gov","label":"Government of Bahrain","x":88,"y":30},{"id":"market","label":"Aluminium buyers","x":50,"y":58}],"steps":[{"from":"banks","to":"bib","kind":"cash","label":"Subscriptions","detail":"Three-month Salam securities held for liquidity requirements."},{"from":"bib","to":"gov","kind":"cash","label":"Salam price paid in advance","detail":"For a specified amount of aluminium at a future date."},{"from":"bib","to":"gov","kind":"agency","label":"Government appointed selling agent","detail":"A separate agency contract."},{"from":"gov","to":"market","kind":"goods","label":"Aluminium delivered and sold","detail":"At a price that gives holders their return."},{"from":"gov","to":"banks","kind":"cash","label":"Sale proceeds to holders","detail":"Certificates are not traded before delivery: they are a Salam debt (p. 404)."}],"rules":["Full advance payment; a precisely specified commodity.","No secondary trading of Salam debt."],"pitfalls":["Trading the certificates before delivery","Guaranteeing the sale price"],"origin":["f1"]},
