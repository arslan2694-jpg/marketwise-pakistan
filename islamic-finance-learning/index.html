  <link rel="stylesheet" href="styles.css">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('ifl.v1') || '{}').settings || {};
        var t = s.theme || 'system';
        if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (s.fontScale) document.documentElement.style.setProperty('--font-scale', s.fontScale);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
